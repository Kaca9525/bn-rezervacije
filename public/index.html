<style>
/* Layout: sticky espresso brand band with gold hairline; one serene 1100px column on ivory paper;
   serif editorial headings with italic gold accents; cards as soft porcelain tiles; gold-gradient CTAs. */
:root{
  --bg:#FBF8F2; --bg-glow:rgba(186,148,74,.07);
  --surface:#FFFFFF; --surface2:#F5EFE3;
  --ink:#231D17; --muted:#8B7D6A;
  --gold:#AE873C; --gold2:#D7B66C; --gold-strong:#8F6D2C; --gold-soft:#F1E7CF;
  --on-gold:#2B1F09;
  --band:#17120E; --band-ink:#F3EBDB; --band-mut:#C9BBA0; --band-gold:#E3C784;
  --line:#E9E0CC; --line-soft:#F0E9D9;
  --ok:#4F7A4B; --ok-bg:#EBF2E6; --danger:#A5473C; --danger-bg:#F7E9E5;
  --shadow:0 1px 2px rgba(35,29,23,.05),0 12px 32px -8px rgba(35,29,23,.12);
  --shadow-lg:0 2px 4px rgba(35,29,23,.06),0 24px 48px -12px rgba(35,29,23,.18);
  --ff-disp:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ff-hero:"Playfair Display",Georgia,"Times New Roman",serif;
  --ff-body:"Mulish",-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.6;font-variant-numeric:lining-nums;
  background:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -120px,var(--bg-glow),transparent 70%);
  background-repeat:no-repeat}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::selection{background:var(--gold-soft)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- header band ---------- */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  border-bottom:1px solid rgba(227,199,132,.28)}
.band::after{content:"";display:block;height:2px;background:linear-gradient(90deg,transparent,var(--band-gold) 30%,var(--band-gold) 70%,transparent);opacity:.55}
.band-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:13px;min-width:0}
.logo-mark{width:56px;height:auto;flex:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.logo-word{line-height:1.05}
.logo-word b{display:block;font-family:var(--ff-disp);font-weight:600;font-size:21px;letter-spacing:.15em;color:var(--band-ink)}
.logo-word span{display:block;font-size:9px;letter-spacing:.46em;color:var(--band-gold);text-transform:uppercase;margin-top:4px}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav button{position:relative;padding:9px 14px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-mut);transition:color .18s ease}
.nav button::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--band-gold);transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
.nav button:hover{color:var(--band-ink)}
.nav button.on{color:var(--band-gold)}
.nav button.on::after,.nav button:hover::after{transform:scaleX(1)}
.userchip{display:flex;align-items:center;gap:10px;margin-left:10px;padding:5px 6px 5px 14px;border:1px solid rgba(227,199,132,.4);border-radius:999px;font-size:13px;color:var(--band-ink)}
.userchip .out{padding:6px 12px;border-radius:999px;background:rgba(227,199,132,.16);color:var(--band-gold);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.userchip .out:hover{background:rgba(227,199,132,.28)}
.nav .ig{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;margin-left:8px;border-radius:50%;border:1px solid rgba(227,199,132,.4);color:var(--band-gold);transition:background .18s ease}
.nav .ig:hover{background:rgba(227,199,132,.16)}

/* ---------- shell & typography ---------- */
.wrap{max-width:1100px;margin:0 auto;padding-block:34px 140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app > *{animation:rise .4s ease both}
#app.still > *{animation:none}  /* osvežen isti ekran (tab, Dodaj): bez ponovnog ulaska, da strana ne trepne */
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.h-page{font-family:var(--ff-hero);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.h-page em{font-style:italic;font-weight:500;color:var(--gold-strong)}
.sub{color:var(--muted);margin:0 0 22px;max-width:64ch;font-size:15.5px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-strong)}
/* hero sa fotografijom salona: tekst levo na kremastoj podlozi, zdesna zid sa natpisom koji se blago utapa u podlogu,
   pa se ni naslov ni natpis na zidu ne preklapaju */
.hero{position:relative;padding:36px 40px 30px;margin:0 0 22px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
  background:#FBF8F2;min-height:380px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hero::before{content:"";position:absolute;top:0;right:0;bottom:0;width:60%;background:#F3ECDF url(/img/hero.jpg) 60% 8%/auto 126% no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 16%,#000 34%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 16%,#000 34%)}
.hero>*{position:relative;max-width:46%}
.hero-h{margin-top:0;font-size:clamp(34px,5.6vw,54px)}
.hero-hours{margin-top:6px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;background:var(--surface);display:inline-block}
.hero-hours-t{display:block;font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.hero-meta{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.75}
.hero-orn{display:block;width:120px;height:20px;color:var(--gold);margin-top:22px;opacity:.8}
.rule{display:flex;align-items:center;gap:16px;margin:34px 0 16px}
.rule h2{font-family:var(--ff-disp);font-weight:600;font-size:26px;margin:0;white-space:nowrap}
@media (max-width:760px){.rule h2{white-space:normal}}  /* dug naslov uz dugme (admin „Masaže (u sklopu tretmana tela)") se lomi u dva reda umesto da izađe iz ekrana */
.rule::after{content:"";height:1px;background:linear-gradient(90deg,var(--gold),var(--line) 60%,transparent);flex:1;opacity:.7}
.hidden{display:none!important}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- cards & controls ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;
  font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;
  transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);box-shadow:0 6px 18px -4px rgba(174,135,60,.5)}
.btn-gold:hover{box-shadow:0 10px 24px -4px rgba(174,135,60,.65);transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-strong)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:9px 15px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);outline:none}
.field textarea{min-height:90px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pill-cat{background:var(--gold-soft);color:var(--gold-strong)}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--danger-bg);color:var(--danger)}
.pill-wait{background:#FBEDD0;color:#8A5A06}
.tab-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--danger);color:#FFF;font-size:10.5px;letter-spacing:0;vertical-align:middle}
.bk.wait{border-color:#E4C27A;box-shadow:0 0 0 1px #E4C27A inset,var(--shadow)}

/* ---------- auth ---------- */
.auth-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:start;padding-top:18px}
.auth-hero{padding:10px 4px}
.auth-hero .big{font-family:var(--ff-hero);font-size:clamp(32px,5vw,50px);font-weight:600;line-height:1.08;margin:14px 0 14px;text-wrap:balance}
.auth-hero .big em{font-style:italic;font-weight:500;color:var(--gold-strong)}
.auth-hero p{color:var(--muted);max-width:48ch;font-size:15.5px}
.auth-points{display:grid;gap:12px;margin-top:22px}
.auth-points div{display:flex;gap:12px;align-items:baseline;font-size:14px}
.auth-points b{color:var(--gold);font-family:var(--ff-disp);font-size:17px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--surface2);width:max-content;max-width:100%}
.tabs button{padding:9px 18px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .15s ease}
.tabs button.on{background:var(--surface);color:var(--gold-strong);box-shadow:var(--shadow)}
.form-note{font-size:12.5px;color:var(--muted);margin-top:12px}
.err{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:12px}

/* ---------- catalog ---------- */
.cat-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 22px}
.cat-tabs button{padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  transition:all .18s ease;box-shadow:var(--shadow)}
.cat-tabs button:hover{border-color:var(--gold);color:var(--gold-strong)}
.cat-tabs button.on{background:var(--band);border-color:var(--band);color:var(--band-gold);box-shadow:var(--shadow-lg)}
.search{position:relative;flex:1 1 230px;min-width:190px;margin-left:auto;display:flex;align-items:center}
.search>svg{position:absolute;left:15px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:11px 38px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search .clr{display:none;position:absolute;right:6px;width:30px;height:30px;padding:0;border:0;background:transparent;box-shadow:none;border-radius:50%;place-items:center;color:var(--muted)}
.search.has-q .clr{display:grid}
.search .clr:hover{background:var(--surface2);color:var(--ink)}
.search-sum{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;container-type:inline-size}
.svc{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden;
  transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease}
.svc::before{content:"";position:absolute;z-index:2;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--gold));opacity:0;transition:opacity .2s ease}
/* efekti pri prelasku mišem samo na uređajima sa mišem: na telefonu bi dodir „zalepio" izdizanje i zum slike (0,6 s) */
@media (hover:hover){
  .svc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
  .svc:hover::before{opacity:1}
}
.svc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.svc h3{font-family:var(--ff-disp);font-weight:600;font-size:21.5px;line-height:1.18;margin:0;text-wrap:balance}
.svc-meta{display:flex;gap:16px;align-items:baseline;font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.svc-meta .price{font-weight:800;color:var(--gold-strong);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:0}
.svc p{margin:0;color:var(--muted);font-size:13.5px}
/* opis tretmana je sakriven dok se ne klikne „Prikaži više" */
.svc p.desc{display:none}
.svc.open p.desc{display:block}
.svc .more{align-self:flex-end;margin-top:auto;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-strong)}
.svc-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;align-content:start;gap:10px 14px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft)}
.svc-foot .note{min-width:0}
.svc-acts{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;min-width:136px}
/* opis, napomena o paketu i „Prikaži više" (desno, odmah iznad linije sa dugmadima) */
.svc-x{display:flex;flex-direction:column;gap:10px;min-width:0}
.svc-x:empty{display:none}
.svc-acts .btn svg{flex:none}
.svc-note{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;line-height:1.45;color:var(--gold-strong);font-weight:700}
.svc-note svg{flex:none;margin-top:-0.5px}
.svc.inCart{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
.svc.inCart::before{opacity:1}
/* fotografija preko cele kartice (img/usluge/<slika>.jpg, uspravni isečak 2:3; img/usluge/full/<slika>.jpg cela slika):
   naziv, cena i dugmad stoje pri dnu na tamnom prelivu, klik na fotografiju je uvećava */
.svc.photo{padding:0;gap:0;min-height:540px;justify-content:flex-end;isolation:isolate;background:var(--band);border-color:#2B2219}
.svc.photo.inCart{border-color:var(--gold)}
@media (hover:hover){.svc.photo:hover{border-color:var(--gold)}.svc.photo:hover .svc-img img{transform:scale(1.04)}}
.svc-img{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:inherit;
  background:var(--band);overflow:hidden;cursor:zoom-in}
.svc-img img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform .6s ease}
.svc-img:focus-visible{outline:2px solid var(--gold);outline-offset:-5px}
.svc-body{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:120px 22px 22px;pointer-events:none;
  background:linear-gradient(180deg,rgba(23,18,14,0) 0,rgba(23,18,14,.5) 56px,rgba(23,18,14,.8) 118px,rgba(23,18,14,.9) 100%)}
.svc-body :is(button,a,input,p.desc,.opt){pointer-events:auto}
.svc.photo h3{color:#FFF}
.svc.photo .svc-meta{color:var(--band-mut)}
.svc.photo .svc-meta .price{color:var(--band-gold)}
.svc.photo p{color:rgba(243,235,219,.9)}
.svc.photo .svc-note,.svc.photo .more{color:var(--band-gold)}
.svc.photo .svc-foot{border-top-color:rgba(243,235,219,.18)}
.svc.photo .svc-foot .note{color:var(--band-mut)}
.svc.photo .btn-ghost{background:rgba(23,18,14,.35);border-color:rgba(243,235,219,.42);color:var(--band-ink)}
.svc.photo .btn-ghost:hover{background:rgba(243,235,219,.14);border-color:var(--band-gold)}
/* tretman bez fotografije: znak salona na tamnoj pozadini, na telefonu (jedna kolona) samo tekst */
.svc-img.ph{cursor:default;display:grid;align-content:start;justify-items:center;gap:12px;padding-top:15%;
  background:radial-gradient(110% 70% at 50% 22%,#3A2E22 0,#211A14 55%,var(--band) 100%)}
.svc-img.ph svg{width:46px;height:46px;color:var(--band-gold);opacity:.8}
.svc-img.ph span{font-family:var(--ff-disp);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--band-gold);opacity:.8}
@container (max-width:635px){
  .svc.photo.noimg{min-height:0}
  .svc.photo.noimg::after{display:none}
  .svc.photo.noimg .svc-img{display:none}
  .svc.photo.noimg .svc-body{padding-top:22px;background:var(--band)}
}
/* tekst u istoj ravni u celom redu kartica: svaka kartica zauzima pet redova mreže (fotografija, naziv, trajanje i cena,
   opis/napomena/„Prikaži više", dugmad), a ti redovi su zajednički za sve kartice u istom redu (subgrid).
   Naziv u jednom redu ostaje poravnat sa nazivima u dva reda, cene, linije i dugmad su na istoj visini.
   Pregledači bez subgrid-a zadržavaju raniji raspored. */
@supports (grid-template-rows:subgrid){
  .svc-grid{row-gap:0}
  .svc-grid>.svc{margin-bottom:16px}
  .svc.photo{display:grid;grid-row:span 5;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr);justify-content:stretch;row-gap:0;min-height:0}
  .svc.photo::after{content:"";grid-row:1;grid-column:1;height:var(--svc-img-h,212px)}
  .svc-body{grid-row:2/span 4;display:grid;grid-template-rows:subgrid;row-gap:0}
  .svc-body>.svc-top{grid-row:1}
  .svc-body>.svc-meta{grid-row:2;margin-top:10px}
  .svc-body>.svc-x{grid-row:3;margin-top:10px}
  .svc-body>.svc-foot{grid-row:4;margin-top:10px}
}
.empty{border:1px dashed var(--line);border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.remind{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--gold-soft),transparent 160%);border:1px solid var(--gold);color:var(--gold-strong);border-radius:14px;padding:13px 18px;margin:0 0 20px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}

/* ---------- cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--band);color:var(--band-ink);z-index:40;
  border-top:1px solid rgba(227,199,132,.4);box-shadow:0 -14px 40px rgba(0,0,0,.28);
  padding-top:13px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cartbar .sum{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.cartbar .sum b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--band-gold)}
.cartbar .sum span{font-size:12.5px;color:var(--band-mut)}
.cartbar .actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.cartbar .clear{color:var(--band-mut);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cartbar .clear:hover{color:var(--band-ink)}

/* ---------- booking ---------- */
.book-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:20px;align-items:start}
.step-h{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.step-h .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);font-family:var(--ff-disp);font-weight:700;font-size:16px;display:grid;place-items:center;flex:none}
.step-h h3{font-family:var(--ff-disp);font-size:22px;font-weight:600;margin:0}
.choice-row{display:flex;gap:9px;flex-wrap:wrap}
.chip{padding:10px 17px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink);transition:all .15s ease}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:var(--on-gold);box-shadow:0 5px 14px -3px rgba(174,135,60,.5)}
.chip[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
/* kompaktni mesečni kalendar (izbor datuma) */
.mcal{width:100%;max-width:330px}
.mcal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mcal-title{position:relative;display:inline-flex;align-items:center;min-width:0}
.mcal-title::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:2px solid var(--gold-strong);border-bottom:2px solid var(--gold-strong);transform:translateY(-75%) rotate(45deg);pointer-events:none}
.mcal-title select{-webkit-appearance:none;appearance:none;font-family:var(--ff-disp);font-size:19px;font-weight:600;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:10px;padding:3px 28px 3px 10px;cursor:pointer;max-width:100%}
.mcal-title select:hover,.mcal-title select:focus-visible{border-color:var(--gold);outline:none}
.mcal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1;color:var(--gold-strong);transition:border-color .15s ease}
.mcal-nav:hover{border-color:var(--gold)}
.mcal-nav[disabled]{opacity:.3;cursor:not-allowed}
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal-dow{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:2px 0 4px}
.mcal-day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid transparent;transition:all .13s ease}
.mcal-day:not([disabled]):hover{border-color:var(--gold);color:var(--gold-strong)}
.mcal-day[disabled]{color:var(--muted);opacity:.38;cursor:not-allowed}
.mcal-day.today{border-color:var(--line)}
.mcal-day.on{background:var(--band);border-color:var(--band);color:var(--band-gold);box-shadow:var(--shadow)}
.mcal-foot{font-size:11.5px;color:var(--muted);margin-top:8px}
.modal.cal-modal{max-width:420px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--danger);transition:all .15s ease}
.icon-btn:hover{border-color:var(--danger);background:var(--danger-bg)}
.icon-btn.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.rule .btn{flex:none;order:2}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;margin-top:4px}
.slot{padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:center;transition:all .13s ease}
.slot:hover{border-color:var(--gold);color:var(--gold-strong)}
.slot.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:var(--on-gold);box-shadow:0 5px 14px -3px rgba(174,135,60,.5)}
.slot[disabled]{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.bk-sum{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.bk-sum ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:9px}
.bk-sum li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:9px}
.bk-sum li .rm{display:inline-flex;align-items:center;gap:5px;color:var(--danger);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.bk-sum li .rm:hover{text-decoration:underline}
.bk-sum .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold-strong);font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:2px}
.bk-sum .tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin:9px 0 2px}
.bk-sum .tot span{font-variant-numeric:tabular-nums}
.ok-box{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:15px 17px;font-weight:700;margin-top:14px}
.ok-ico{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);box-shadow:0 6px 18px rgba(176,137,64,.28)}
.spam-box{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);font-size:13.5px;line-height:1.5;text-align:left}
.spam-box b{color:var(--ink)}
.wait-box{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid #E4C27A;background:#FBF3E2;color:var(--ink);font-size:13.5px;line-height:1.5;text-align:left}
.notice-pop .notice-txt p{margin:0 0 11px;font-size:14px;line-height:1.55;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.notice-pop .notice-txt b{color:var(--ink)}
.notice-pop .notice-ok{margin-top:16px!important;padding-top:12px;border-top:1px solid var(--line)}
.notice-pop .notice-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.notice-pop .notice-btns .btn{flex:1 1 150px}
.notice-pop .notice-btns .btn-gold{flex:1.7 1 230px}
.done-pop{text-align:center}
.done-pop h3{margin:0 0 6px}
.done-pop .note{margin:0 0 4px;font-size:14px}
.done-pop .spam-box{margin:16px 0 18px}
.done-pop .btn{margin-top:16px}
.done-pop .spam-box+.btn{margin-top:0}
/* avans 30%: podaci za uplatu (posle rezervacije, u „Moje rezervacije" i kod edukacija) */
.avans-box{container-type:inline-size;margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);text-align:left;font-size:13.5px;line-height:1.5}
.avans-box .av-h{font-weight:800;font-size:15px;color:var(--gold-strong);margin-bottom:6px}
.avans-box .av-p{margin:8px 0 0;color:var(--muted)}
.avans-box .av-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding:6px 0;border-top:1px dashed var(--line)}
.avans-box .av-row>span{color:var(--muted);font-size:12.5px}
.avans-box .av-row>b{font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
@container (max-width:330px){
  .avans-box .av-row{grid-template-columns:minmax(0,1fr) auto;padding:5px 0}
  .avans-box .av-row>span{grid-column:1/-1;font-size:11.5px;line-height:1.35}
}
.done-pop .avans-box{margin:16px 0 0}
.done-pop .avans-box+.btn{margin-top:18px}
.av-mini{margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:13px;line-height:1.45}
.av-mini b{font-variant-numeric:tabular-nums}

/* ---------- my bookings & admin ---------- */
.bk-list{display:grid;gap:14px}
.bk{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bk .when{flex:none;text-align:center;border-right:1px solid var(--line);padding-right:16px;min-width:90px}
.bk .when .d{font-family:var(--ff-disp);font-size:28px;font-weight:600;line-height:1}
.bk .when .m{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.bk .when .t{font-weight:800;font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--gold-strong)}
.bk .mid{flex:1;min-width:220px}
.bk .mid .who{font-weight:800;font-size:15px}
.ico-inl{display:inline-flex;vertical-align:-2px;margin-right:7px;color:var(--gold-strong)}
.bk .mid .list{color:var(--muted);font-size:13px;margin-top:3px}
.bk .mid .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.bk .side{display:flex;flex-direction:column;gap:9px;align-items:flex-end;margin-left:auto}
.bk .price{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;color:var(--gold-strong)}
.adm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}

"use strict";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RSD=n=>new Intl.NumberFormat("sr-RS").format(n)+" RSD";
const priceTxt=(s,v)=>s&&s.cur==="EUR"?(new Intl.NumberFormat("sr-RS").format(v)+" €"):RSD(v);
const money=(r,e)=>[e?new Intl.NumberFormat("sr-RS").format(e)+" €":null,r?RSD(r):null].filter(Boolean).join(" + ")||RSD(0);
const DOWS=["Nedelja","Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota"];
const DOWS_S=["NED","PON","UTO","SRE","ČET","PET","SUB"];
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const toHM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const fmtD=s=>{const d=parseD(s);return DOWS[d.getDay()]+", "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear()+"."};

/* Instagram salona (zaglavlje i podnožje) i znak potvrde posle rezervacije; definisano pre boot()-a jer prvi render() crta zaglavlje */

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"},credentials:"same-origin"},opts||{}));
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||("Greška ("+r.status+")"));e.data=j||{};e.status=r.status;throw e}
  return j;
}
const apiGet=p=>api(p);
const apiPost=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

/* broj telefona: prima 064 123 4567, +381 64…, 00381…; isto pravilo kao na serveru */
function normTel(s){let t=String(s||"").trim().replace(/[\s\-\/().]/g,"");if(!t)return null;
  if(t.startsWith("00"))t="+"+t.slice(2);else if(t.startsWith("0"))t="+381"+t.slice(1);else if(t.startsWith("381"))t="+"+t;else if(/^6\d{7,9}$/.test(t))t="+381"+t;
  return /^\+[1-9]\d{7,14}$/.test(t)?t:null}
const telOk=s=>!!normTel(s);
const CATS={lice:"Tretmani lica",telo:"Tretmani tela",masaze:"Masaže",akcije:"Akcija",edu:"Edukacije"};
const TABS={lice:"Tretmani lica",telo:"Tretmani tela",akcije:"Akcije",vauceri:"Poklon vaučeri",edu:"Edukacije i obuke"};
const tabCats=t=>t==="telo"?["telo","masaze"]:[t];

const ICON_ROLL=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-35 12 12)"><rect x="6.5" y="8" width="11" height="8" rx="2.4"/><rect x="1.5" y="10.6" width="5" height="2.8" rx="1.4"/><rect x="17.5" y="10.6" width="5" height="2.8" rx="1.4"/><path d="M10.2 8v8M13.8 8v8"/></g></svg>`;
const ICON_GIFT=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="4.5" rx="1"/><path d="M5 12.5v7.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5M12 8v13"/><path d="M12 8c-1.4-3.4-5.6-3.9-5.6-1.4C6.4 8 9.2 8 12 8zM12 8c1.4-3.4 5.6-3.9 5.6-1.4C17.6 8 14.8 8 12 8z"/></svg>`;

/* ================= auth ================= */
/* označi polje sa greškom (crveni okvir) i stavi fokus na njega */
function markBad(f,name){f.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));const el=name&&f[name];if(el&&el.classList){el.classList.add("bad");el.focus();el.addEventListener("input",()=>el.classList.remove("bad"),{once:true})}}
async function register(f){
  const ime=f.ime.value.trim(),prezime=f.prezime.value.trim(),email=f.email.value.trim(),tel=f.tel.value.trim(),pw=f.pw.value;
  const bad=(name,m)=>{markBad(f,name);authErr(m)};
  if(!ime)return bad("ime","Unesite ime.");
  if(!prezime)return bad("prezime","Unesite prezime.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return bad("email","Unesite ispravnu e-mail adresu - na nju stižu potvrde termina.");
  if(!tel)return bad("tel","Unesite broj telefona - bez njega registracija nije moguća.");
  if(!telOk(tel))return bad("tel","Broj telefona nije ispravan - upišite ga npr. kao 064 123 4567.");
  if(pw.length<6)return bad("pw","Lozinka mora imati najmanje 6 karaktera.");
  markBad(f,null);
  const gd=f.querySelector("#r-gdpr");
  if(!gd||!gd.checked)return consentGate(()=>{const g=f.querySelector("#r-gdpr");if(g)g.checked=true;register(f)});
  try{
    const r=await apiPost("/api/register",{ime,prezime,email,telefon:tel,pw,consent:true});
    S.me=r.me;loadMy();toast("Dobro došli, "+S.me.ime+"!");S.view="catalog";render();
  }catch(e){if(e.data&&e.data.field)markBad(f,e.data.field);authErr(e.message,{forgot:!!(e.data&&e.data.exists)})}
}
async function login(f){
  const ident=f.ident.value.trim(),pw=f.pw.value;
  if(!ident||!pw)return authErr("Unesite e-mail ili ime i prezime, i lozinku.");
  try{
    const r=await apiPost("/api/login",{ident,pw});
    S.me=r.me;
    const fin=()=>{loadMy();toast("Prijavljeni ste kao "+S.me.ime);S.view="catalog";render()};
    if(r.me.needConsent)consentGate(async()=>{try{await apiPost("/api/consent");S.me.needConsent=false}catch(e){}fin()},()=>logout());
    else fin();
  }catch(e){authErr(e.message,{forgot:/lozink/i.test(e.message)})}
}
async function logout(){
  try{await apiPost("/api/logout")}catch(e){}
  S.me=null;S.myBookings=[];S.admBookings=[];S.view="catalog";render();toast("Odjavljeni ste.");
}
function authErr(m,o){
  const b=$("#auth-err");if(!b)return toast(m);
  b.innerHTML=esc(m)+(o&&o.forgot?` <button type="button" class="more" data-forgot>Zaboravljena lozinka?</button>`:"");
  b.classList.remove("hidden");
  const f=b.querySelector("[data-forgot]");if(f)f.onclick=forgotModal;
}

/* ================= hours / slots ================= */
function dayHours(dateStr){
  const d=parseD(dateStr).getDay();
  const h=S.hours&&S.hours[String(d)];
  if(!h||h.closed)return null;
  return {open:toMin(h.open),close:toMin(h.close)};
}
function cartTotals(){const t={dur:0,rsd:0,eur:0};S.cart.forEach(s=>{t.dur+=+s.duration||0;if(s.cur==="EUR")t.eur+=+s.price||0;else t.rsd+=+s.price||0});return t}
const isDev=e=>!!e&&e.kind==="aparat";
function performs(e,s){return s.aparat?isDev(e):!isDev(e)&&(Array.isArray(s.emps)?s.emps.includes(e.id):(e.cats||[]).includes(s.cat))}
function svcEmps(s){return S.employees.filter(e=>e.active!==false&&performs(e,s))}
function eligibleEmployees(){return S.cart.length?S.employees.filter(e=>e.active!==false&&S.cart.every(s=>performs(e,s))):[]}
function hoursSummary(){
  if(!S.hours)return[];
  const hm=t=>String(t).replace(/:00$/,"");
  const key=k=>{const h=S.hours[k];return !h||h.closed?"x":(hm(h.open)+"-"+hm(h.close))+(h.appt?" (radimo na zakazivanje)":"")};
  const order=["1","2","3","4","5","6","0"];const parts=[];let i=0;
  while(i<order.length){
    let j=i;while(j+1<order.length&&key(order[j+1])===key(order[i]))j++;
    const lab=(i===j?DOWS_S[+order[i]]:DOWS_S[+order[i]]+"-"+DOWS_S[+order[j]]).toLowerCase();
    const v=key(order[i]);parts.push(lab+": "+(v==="x"?"neradno":v));i=j+1;
  }
  return parts;
}
async function bookingsFor(dateStr){return apiGet("/api/day?date="+encodeURIComponent(dateStr))}
function freeAt(bks,emp,start,dur){
  const end=start+dur;
  return !bks.some(b=>b.employee===emp&&!(end<=toMin(b.start)||start>=toMin(b.end)));
}
/* radno vreme zaposlenih za dan (server uzima u obzir stalni raspored i izmene po datumu) */
async function workFor(dateStr){try{return await apiGet("/api/work?date="+encodeURIComponent(dateStr))}catch(e){return null}}
function empWins(work,ids,h){
  return ids.map(id=>{const w=work&&work.emps?work.emps[id]:{open:toHM(h.open),close:toHM(h.close)};return w?{id,open:toMin(w.open),close:toMin(w.close)}:null}).filter(Boolean);
}
function slotGrid(dateStr,wins,bks,dur){
  const open=Math.min(...wins.map(w=>w.open)),close=Math.max(...wins.map(w=>w.close));
  const today=dstr(new Date());const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const slots=[];
  for(let t=open;t+dur<=close;t+=30){
    if(dateStr===today&&t<nowMin+60)continue;
    slots.push({t,free:wins.some(w=>t>=w.open&&t+dur<=w.close&&freeAt(bks,w.id,t,dur))});
  }
  return{slots,h:{open,close}};
}
async function computeSlots(dateStr){
  const h=dayHours(dateStr);if(!h)return{slots:[],h:null};
  const {dur}=cartTotals();
  const [bks,work]=await Promise.all([bookingsFor(dateStr),workFor(dateStr)]);
  const ids=S.bEmp==="__any"?eligibleEmployees().map(e=>e.id):[S.bEmp];
  const wins=empWins(work,ids,h);
  if(!wins.length)return{slots:[],h,off:true};
  return slotGrid(dateStr,wins,bks,dur);
}
/* slobodni termini za proizvoljnu listu usluga (popup kalendar na karticama) */
async function slotsForServices(dateStr,list){
  const h=dayHours(dateStr);if(!h)return{slots:[],h:null};
  const dur=list.reduce((a,s)=>a+(+s.duration||0),0);
  const emps=S.employees.filter(e=>e.active!==false&&list.every(s=>performs(e,s))).map(e=>e.id);
  if(!emps.length)return{slots:[],h,noEmp:true};
  const [bks,work]=await Promise.all([bookingsFor(dateStr),workFor(dateStr)]);
  const wins=empWins(work,emps,h);
  if(!wins.length)return{slots:[],h,off:true};
  return slotGrid(dateStr,wins,bks,dur);
}
/* kompaktni mesečni kalendar: od januara tekuće godine (najranije 2026.) do decembra naredne godine,
   sada cela 2026. i 2027.; klijent bira samo današnji i buduće radne dane salona */
const MONTHS_L=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
const CAL_Y0=2026;
/* opseg meseci kao pomak od tekućeg meseca (negativno = prošli meseci) */
function calRange(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();return{min:(Math.max(CAL_Y0,y)-y)*12-m,max:(Math.max(CAL_Y0+1,y+1)-y)*12+11-m}}
const calYears=()=>{const a=[],y1=Math.max(CAL_Y0+1,new Date().getFullYear()+1);for(let y=CAL_Y0;y<=y1;y++)a.push(y);return a};
const capM=i=>MONTHS_L[i].charAt(0).toUpperCase()+MONTHS_L[i].slice(1);
function calMonthHTML(off,sel,attr){
  const R=calRange();off=Math.max(R.min,Math.min(R.max,+off||0));
  const now=new Date();const today=dstr(now);
  const m0=new Date(now.getFullYear(),now.getMonth()+off,1);
  const days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const lead=(m0.getDay()+6)%7;
  const cells=[];for(let i=0;i<lead;i++)cells.push(`<span></span>`);
  for(let d=1;d<=days;d++){
    const ds=dstr(new Date(m0.getFullYear(),m0.getMonth(),d));
    const ok=ds>=today&&!!dayHours(ds);
    cells.push(`<button class="mcal-day ${ds===today?"today":""} ${sel===ds?"on":""}" data-${attr}="${ds}" ${ok?"":"disabled"} aria-label="${esc(fmtD(ds))}">${d}</button>`);
  }
  const opts=[];for(let o=R.min;o<=R.max;o++){const d=new Date(now.getFullYear(),now.getMonth()+o,1);opts.push(`<option value="${o}"${o===off?" selected":""}>${capM(d.getMonth())} ${d.getFullYear()}.</option>`)}
  return `<div class="mcal">
    <div class="mcal-head">
      <button class="mcal-nav" data-${attr}-off="${off-1}" ${off<=R.min?"disabled":""} aria-label="Prethodni mesec"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <label class="mcal-title"><select data-${attr}-sel aria-label="Izaberite mesec">${opts.join("")}</select></label>
      <button class="mcal-nav" data-${attr}-off="${off+1}" ${off>=R.max?"disabled":""} aria-label="Sledeći mesec"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mcal-grid">${["PON","UTO","SRE","ČET","PET","SUB","NED"].map(x=>`<span class="mcal-dow">${x}</span>`).join("")}${cells.join("")}</div>
    <div class="mcal-foot">Radno vreme: ${hoursSummary().map(esc).join(" · ")}</div>
  </div>`;
}
const calOffFor=ds=>{if(!ds)return 0;const R=calRange(),d=parseD(ds),n=new Date();return Math.max(R.min,Math.min(R.max,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth()))};
const ICON_CAL=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;
const ICON_TRASH=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>`;
function calModal(svcId){
  const s=S.services.find(x=>x.id===svcId);if(!s)return;
  const list=S.cart.some(c=>c.id===s.id)?S.cart.slice():S.cart.concat([cartItem(s)]);
  const st={off:0,date:null,slot:null};
  const dur=list.reduce((a,x)=>a+(+x.duration||0),0);
  const draw=()=>{
    const m=$("#modal-root .modal");if(!m)return;
    m.innerHTML=`<h3>${esc(s.name)}</h3>
      <p class="note" style="margin:-4px 0 14px">${list.length>1?"Zajedno sa uslugama iz korpe · ":""}trajanje ${durTxt(dur)}. Izaberite dan, pa slobodan termin.</p>
      ${calMonthHTML(st.off,st.date,"cmday")}
      <div id="cm-slots" style="margin-top:14px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn btn-gold btn-sm" id="cm-go" ${st.date&&st.slot!=null?"":"disabled"}>${st.date&&st.slot!=null?"Nastavi · "+esc(st.date.split("-").reverse().slice(0,2).join(".")+". u "+toHM(st.slot)):"Nastavi"}</button>
        <button class="btn btn-ghost btn-sm" id="m-close">Zatvori</button>
      </div>`;
    m.querySelector("#m-close").onclick=closeModal;
    m.querySelectorAll("[data-cmday-off]").forEach(b=>b.onclick=()=>{if(b.disabled)return;st.off=+b.dataset.cmdayOff;draw()});
    m.querySelectorAll("[data-cmday-sel]").forEach(s=>s.onchange=()=>{st.off=+s.value;draw();const x=m.querySelector("[data-cmday-sel]");if(x)x.focus({preventScroll:true})});
    m.querySelectorAll("[data-cmday]").forEach(b=>b.onclick=()=>{if(b.disabled)return;st.date=b.dataset.cmday;st.slot=null;draw()});
    m.querySelector("#cm-go").onclick=()=>{
      if(!st.date||st.slot==null)return;
      if(!S.cart.some(c=>c.id===s.id))S.cart.push(cartItem(s));
      S.bEmp="__any";S.bDate=st.date;S.bSlot=st.slot;S.bOff=null;closeModal();S.view="booking";render();
    };
    const area=m.querySelector("#cm-slots");
    if(!st.date){area.innerHTML=`<p class="note">Izaberite datum da biste videli slobodne termine.</p>`;return}
    area.innerHTML=`<div class="loading" style="padding:10px 0">Proveravam slobodne termine…</div>`;
    const want=st.date;
    slotsForServices(want,list).then(({slots,h,noEmp})=>{
      if(st.date!==want||!area.isConnected)return;
      if(noEmp){area.innerHTML=`<p class="note" style="color:var(--danger)">Nijedna zaposlena ne izvodi sve izabrane tretmane u jednoj poseti.</p>`;return}
      if(!h){area.innerHTML=`<p class="note">Salon ne radi izabranog dana.</p>`;return}
      if(!slots.some(x=>x.free)){area.innerHTML=`<p class="note">Nema slobodnih termina tog dana - izaberite drugi dan.</p>`;return}
      area.innerHTML=`<p class="note" style="margin:0 0 8px">${esc(fmtD(want))} · radno vreme ${toHM(h.open)}-${toHM(h.close)}</p>
        <div class="slots">${slots.map(x=>`<button class="slot ${st.slot===x.t?"on":""}" data-cmslot="${x.t}" ${x.free?"":"disabled"}>${toHM(x.t)}</button>`).join("")}</div>`;
      area.querySelectorAll("[data-cmslot]").forEach(b=>b.onclick=()=>{st.slot=+b.dataset.cmslot;draw()});
    }).catch(()=>{if(area.isConnected)area.innerHTML=`<p class="note">Termine trenutno nije moguće učitati. Pokušajte ponovo.</p>`});
  };
  showModal("");
  const m=$("#modal-root .modal");if(m)m.classList.add("cal-modal");
  draw();
}

async function sendBooking(){
  if(!S.cart.length||!S.bDate||S.bSlot==null)return;
  const btn=$("#bk-confirm");if(btn)btn.disabled=true;
  try{
    const r=await apiPost("/api/bookings",{services:S.cart.map(s=>s.pkg?{id:s.id,pkg:s.pkg}:s.id),employee:S.bEmp,date:S.bDate,start:toHM(S.bSlot)});
    S.cart=[];S.bSlot=null;S.bDate=null;S.bOff=null;S.bEmp="__any";
    S.lastBooking=r.booking;S.view="done";render();loadMy();doneModal(r.booking);
  }catch(e){
    if(btn)btn.disabled=false;
    if(e.data&&e.data.code==="phone")return phoneModal(sendBooking);
    if(e.data&&e.data.code==="blocked"){if(S.me)S.me.blocked=true;return blockedModal()}
    toast(e.message);
    if(/zauzet|ne radi/i.test(e.message)){S.bSlot=null;renderSlots()}
  }
}

  try{
    const was=(S.myBookings||[]).concat(S.admBookings||[]).find(x=>x.id===id);
    await apiPost("/api/bookings/"+encodeURIComponent(id)+"/cancel");
    toast(was&&was.status==="ceka"?"Zahtev je otkazan.":"Rezervacija je otkazana.");
    loadMy();if(isStaff()){S.calBk=null;loadAdm()}
  }catch(e){toast(e.message)}
}

/* ================= render ================= */
/* na vrh stranice se ide samo pri prelasku na drugi ekran; kad se osvežava isti ekran (tab, Dodaj/Ukloni,
   izbor kozmetičarke ili dana, podaci stigli sa servera) stranica ostaje gde je bila (shownView je pre boot()-a) */
function render(){
  renderNav();renderCartbar();
  const app=$("#app");
  if(S.loadErr){app.innerHTML=`<div class="empty"><p style="font-weight:800">Server trenutno nije dostupan.</p><p class="note">Osvežite stranicu za koji trenutak.</p></div>`;return}
  const v=S.view,y=window.scrollY,same=v===shownView;shownView=v;app.classList.toggle("still",same);
  if(v==="auth")app.innerHTML=tplAuth();
  else if(v==="catalog")app.innerHTML=tplCatalog();
  else if(v==="booking"){app.innerHTML=tplBooking();renderSlots()}
  else if(v==="done")app.innerHTML=tplDone();
  else if(v==="my")app.innerHTML=tplMy();
  else if(v==="admin")app.innerHTML=tplAdmin();
  wire(app);
  window.scrollTo({top:same?y:0});
}
function renderNav(){
  const n=$("#nav");
  const b=(id,label)=>`<button data-nav="${id}" class="${S.view===id?"on":""}">${label}</button>`;
  let html=b("catalog","Usluge");
  if(S.me)html+=b("my","Moje rezervacije");
  if(isStaff())html+=b("admin","Admin");
  html+=S.me
    ?`<span class="userchip"><span>${esc(S.me.ime)} ${esc(S.me.prezime)}</span><button class="out" data-nav="logout">Odjava</button></span>`
    :`<button data-nav="auth" class="${S.view==="auth"?"on":""}">Prijava</button>`;
  html+=`<a class="ig" href="${IG_URL}" target="_blank" rel="noopener" title="Instagram ${IG_NAME}" aria-label="Instagram ${IG_NAME} (otvara se u novom prozoru)">${ICON_IG}</a>`;
  n.innerHTML=html;
  n.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{
    const t=el.dataset.nav;
    if(t==="logout")return logout();
    S.view=t;if(t==="admin")loadAdm();render();window.scrollTo({top:0});  /* dugmad u zaglavlju uvek vode na vrh */
  });
}
function renderCartbar(){
  const bar=$("#cartbar");
  const show=S.cart.length>0&&(S.view==="catalog"||S.view==="my");
  bar.classList.toggle("hidden",!show);
  const ck=$("#cookie");if(ck)ck.classList.toggle("lift",show);
  if(!show)return;
  const t=cartTotals(),dur=t.dur;
  $("#cb-count").textContent=S.cart.length+(S.cart.length===1?" usluga":S.cart.length<5?" usluge":" usluga");
  $("#cb-time").textContent="ukupno "+durTxt(dur);
  $("#cb-price").textContent=money(t.rsd,t.eur);
  $("#cb-clear").onclick=()=>{S.cart=[];render()};
  $("#cb-go").onclick=()=>{S.view="booking";S.bDate=null;S.bSlot=null;S.bOff=null;render()};
}

function toCatList(){
  const tabs=$(".cat-tabs"),body=$("#cat-body"),first=body&&body.firstElementChild;if(!tabs||!first)return;
  /* položaj u dokumentu preko offsetTop, nezavisno od transform-a (animacija „rise" pomera elemente za 10px) */
  const docY=el=>{let y=0;for(let e=el;e;e=e.offsetParent)y+=e.offsetTop;return y};
  const band=$(".band"),top=(band?band.getBoundingClientRect().bottom:0)+10;
  const tt=docY(tabs),ft=docY(first);
  const y=Math.max(0,Math.round((top+ft-tt<=innerHeight*.35?tt:ft)-top));
  if(Math.abs(y-window.scrollY)<4)return;
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:y,behavior:calm?"auto":"smooth"});
}

ostavite\nputem e-mail-a, telefona, naše internet stranice, društvenih mreža ili\ndrugih komunikacionih kanala,</p>\n<p>Fotografije i druge vizuelne materijale kada je to primenljivo i kada\npostoji odgovarajući pravni osnov, odnosno potrebna saglasnost, za\npotrebe dokumentovanja tretmana, sprovođenja edukacija ili promotivnih\naktivnosti.</p>\n<p>Podatke u vezi sa reklamacijama i prigovorima uključujući informacije\nkoje dostavite prilikom podnošenja reklamacije, opis tretmana, usluge\nili edukacije na koju se reklamacija odnosi, razloge za nezadovoljstvo,\nrelevantnu komunikaciju, kao i dokumentaciju i druge podatke neophodne\nza razmatranje, rešavanje i evidentiranje reklamacije, u skladu sa\nvažećim propisima.</p>\n<p>Druge lične podatke koje nam dobrovoljno dostavite u vezi sa\nrealizacijom naših usluga, edukativnih programa i korišćenjem aplikacije\nili u vezi sa drugim poslovnim aktivnostima.</p>\n<p>Prikupljamo i obrađujemo isključivo one lične podatke koji su\nrelevantni i neophodni za ostvarivanje konkretnih, opravdanih i\nzakonitih svrha.</p>\n<p class=\"h\"><strong>3. Svrha i pravni osnov obrade</strong></p>\n<p>Podatke prikupljamo i obrađujemo isključivo u svrhu efikasnog i\nbezbednog pružanja relevantnih usluga u okviru Edukativnog centra, kao i\nvođenja vašeg naloga na web aplikaciji, upravljanja rezervacijama,\nslanja potvrda i podsetnika o terminima e-poštom, kontakta u vezi sa\nzakazanim uslugama, izdavanja sertifikata kada je to primenjivo,\nevidentiranja uplata, vođenja poslovne dokumentacije i ispunjavanja\nzakonskih i regulatornih obaveza i kontakta u vezi sa zakazanim\nuslugama.</p>\n<p>U zavisnosti od konkretne svrhe obrade, pravni osnov može biti\nizvršenje usluge koju ste zatražili i Vaša saglasnost, preduzimanje\nradnji na vaš zahtev pre zaključenja ili izvršenja ugovora, ispunjavanje\nzakonskih obaveza ili naš legitimni interes za upravljanje, organizaciju\ni unapređenje poslovanja, pod uslovom da takav interes ne preteže nad\nVašim prav <p class=\"h\"><strong>6. Rok čuvanja</strong></p>\n<p>Podaci se čuvaju onoliko dugo koliko je potrebno za ostvarivanje\nsvrha zbog kojih su prikupljeni i dok postoji vaš nalog. Na Vaš zahtev\npodaci se brišu, osim onih koje smo zakonski dužni da čuvamo. Određena\ndokumentacija, uključujući računovodstvene evidencije, podatke o\nedukacijama, izdatim sertifikatima i dokumentaciju o tretmanima, može se\nčuvati u rokovima utvrđenim primenjivim propisima.</p>\n<p>Po isteku propisanog ili opravdanog roka čuvanja, odnosno kada podaci\nviše nisu potrebni za zakonitu svrhu, lični podaci će biti bezbedno\nobrisani, u skladu sa važećim propisima.</p>\n<p class=\"h\"><strong>7. Vaša prava</strong></p>\n<p>Pravo na pristup podacima – imate pravo da zatražite informaciju o\ntome koje vaše lične podatke prikupljamo i obrađujemo, u koju svrhu i\nkoliko dugo ih čuvamo.</p>\n<p>Pravo na opoziv saglasnosti – ako se obrada vaših podataka zasniva na\nsaglasnosti, možete je povući u bilo kom trenutku. To ne utiče na\nzakonitost obrade izvršene pre povlačenja saglasnosti.</p>\n<p>Pravo na ispravku, dopunu i brisanje podataka – imate pravo da\nzatražite ispravku netačnih podataka, dopunu, kao i brisanje podataka\nkada su za to ispunjeni zakonski uslovi.</p>\n<p>Pravo na ograničenje obrade – u određenim slučajevima možete\nzatražiti da se obrada vaših ličnih podataka privremeno ograniči.</p>\n<p>Pravo na prigovor – imate pravo da u zakonom predviđenim slučajevima\nuložite prigovor na obradu svojih ličnih podataka.</p>\n<p>Pravo na podnošenje pritužbe – ukoliko smatrate da se vaši lični\npodaci obrađuju suprotno zakonu, imate pravo da podnesete pritužbu\nPovereniku za informacije od javnog značaja i zaštitu podataka o\nličnosti Republike Srbije.</p>\n<p>Za ostvarivanje prava pišite na <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>u.</p>\n<p class=\"h\"><strong>8. Kolačići (Cookies)</strong></p>\n<p>Aplikacija koristi isključivo neophodne kolačiće, bez ko
