></li>\n<li><p><strong>Šifra i opis pretežne delatnosti:</strong> 85.59 – Ostalo\nobrazovanje</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> andrijanaobradovic5@gmail.com</p></li>\n<li><p><strong>Društvene mreže:</strong> Facebook i Instagram\n(@beauty_and_nutrition_)</p></li>\n<li><p><strong>PDV status:</strong> nije u sistemu PDV-a.</p></li>\n</ul>\n<ol start=\"2\" type=\"I\">\n<li><p class=\"h\"><strong>Definicije pojmova</strong></p></li>\n</ol>\n<p>U ovim Uslovima korišćenja navedeni pojmovi imaju sledeće\nznačenje:</p>\n<ul>\n<li><p><strong>„Uslovi korišćenja“</strong> – Posebni uslovi pružanja\nUsluga i Opšti uslovi korišćenja Sajta i Aplikacije dostupni u ovom\ndokumentu</p></li>\n<li><p><strong>„Pružalac“, „Centar“, „mi“</strong> – subjekt naveden u\ntački 1.</p></li>\n<li><p><strong>„Sajt“</strong> – internet prezentacija dostupna na\nadresi bg-beauty-and-nutrition.com, sa svim podstranicama (uključujući\nstranice o uslugama, edukacijama, galeriji, kontaktu i blogu\n„Nutrition“).</p></li>\n<li><p><strong>„Aplikacija“</strong> – web aplikacija i alati dostupni\npreko Sajta, uključujući formu za kontakt i modul za online zakazivanje\ntermina.</p></li>\n<li><p><strong>„Korisnik“, „Vi“</strong> – svako lice koje posećuje\nSajt, koristi Aplikaciju, zakazuje termin ili kupuje uslugu, uključujući\ni polaznike edukativnog programa ili kursa u organizaciji\nCentra.</p></li>\n<li><p><strong>„Potrošač“</strong> – fizičko lice koje na tržištu\npribavlja robu ili usluge u svrhe koje nisu namenjene njegovoj poslovnoj\nili drugoj komercijalnoj delatnosti.</p></li>\n<li><p><strong>„Tretman“</strong> – pojedinačna kozmetička usluga ili\npaket tretmana koji se izvodi u prostorijama Centra.</p></li>\n<li><p><strong>„Edukacija“ ili „Obuka“</strong> – edukativni program ili\nkurs koji organizuje Centar.</p></li>\n<li><p><strong>„Usluge“</strong> – kozmetički Tretmani lica i tela,\npaketi Tretmana, Obuke i Edukacije za tretmane lica i tela, kao i\ninformativni sadržaji (blog).</p></li>\n<li><p><strong>„Termin“</strong> – dogovoreni datum i vreme pružanja\nusluge.</p></li>\n<li><p><strong>„Sadržaj Sajta i Aplikacije“</strong> – tekstovi,\nfotografije, video zapisi, logotipi, grafika, dizajn i drugi materijali\nna Sajtu i Aplikaciji.</p></li>\n<li><p><strong>„Korisnički sadržaj“</strong> – svaki sadržaj koji\nKorisnik dostavi Centru preko Sajta, Aplikacije ili društvenih mreža\n(poruke, fotografije, komentari).</p></li>\n</ul>\n<ol start=\"3\" type=\"I\">\n<li><p class=\"h\"><strong>Predmet i prihvatanje uslova, stupanje na\nsnagu</strong></p></li>\n</ol>\n<p>Ovim Uslovima korišćenja uređuju se uslovi pod kojima Centar pruža\nUsluge Korisnicima kao i uslovi koriščenja korišćenja Sajta i\nAplikacije.</p>\n<p>Korišćenjem Sajta i/ili Aplikacije, slanjem upita, zakazivanjem\nTermina ili kupovinom Usluge, Korisnik potvrđuje da je pročitao ove\nUslove korišćenja, da ih razume i da ih prihvata. Ako se ne slažete sa\nUslovima korišćenja, molimo vas da ne koristite Sajt i Aplikaciju i ne\nzakazujete Usluge.</p>\n<p>Uslovi korišćenja stupaju na snagu danom objavljivanja na Sajtu i\nAplikaciji i primenjuju se do objavljivanja izmenjene verzije. Na\npojedinačne ugovore o uslugama primenjuje se verzija Uslova korišćenja\nkoja je važila u trenutku zaključenja ugovora.</p>\n<p>Ugovor o pružanju usluge smatra se zaključenim kada Centar potvrdi\ntermin (putem sistema Aplikacije za online zakazivanje, telefonom ili\nporukom) ili kada Korisnik izvrši uplatu za Obuku/Edukaciju, Tretman ili\npaket, u zavisnosti od toga šta nastupi prvo i traju dok odnosna Usluga\nne bude u potpunosti izvršena.</p>\n<p>****</p>\n<p class=\"h\"><strong><u>1. Opšti Uslovi korišćenja Sajta i\nAplikacije</u></strong></p>\n<p>1.1. <strong>Uzrast.</strong> Aplikaciju i Sajt mogu koristiti i\nUsluge zakazivati lica starija od 18 godina. Maloletna lica mogu\nkoristiti Usluge isključivo uz prisustvo i pisanu ili usmenu saglasnost\nroditelja ili staratelja, koji preuzima odgovornost za korišćenje\nUsluge. Pojedini Tretmani (na primer EMS tretmani, tretmani\nmezoporacijom i voćnim kiselinama) ne izvode se maloletnim licima.\nKlikom na link da prihvatatate uslove korišćenja, potvrđujete da ste\nstariji od 18 godina i da imate pravo da koristite Sajt odnosno\nAplikaciju.</p>\n<p>1.2. <strong>Registracija i zakazivanje.</strong> Pregled Sajta ne\nzahteva registraciju. Za online zakazivanje koristi se Aplikacija, za\nčije korišćenje je potrebno otvaranje korisničkog naloga i unos traženih\npodataka. Za zakazivanje putem web sajta „Sredi me“ koristi se sistem\ntrećeg lica (Sredi me – sredime.rs), za koji može biti potrebno\notvaranje naloga ili unos kontakt podataka. Na korišćenje tog servisa\nprimenjuju se i njegovi uslovi korišćenja i politika privatnosti.</p>\n<p>1.3. <strong>Tačnost podataka.</strong> Korisnik garantuje da su\npodaci koje unosi (ime, kontakt telefon, e-adresa) tačni, potpuni i\nažurni. Centar nije odgovoran za propuštene termine ili izostanak\nobaveštenja usled netačno unetih podataka.</p>\n<p>1.4. <strong>Bezbednost naloga.</strong> Ukoliko Korisnik koristi\nnalog u Aplikaciji za zakazivanje Termina, odgovoran je za čuvanje\nsvojih pristupnih podataka i za sve radnje preduzete preko naloga.\nKorisnik je dužan da bez odlaganja obavesti Centar o svakom neovlašćenom\nkorišćenju naloga. U slučaju zakazivanja putem web sajta „Sredi me“,\nKorisnik je dužan da bez odlaganja obavesti odnosnog pružaoca usluge o\nsvakom neovlašćenom korišćenju naloga u skladu sa njihovim uslovima\nkorišćenja.</p>\n<p>1.5. <strong>Informativni sadržaji.</strong> Sadržaj bloga\n<em>„Nutrition“</em> o nezi, zdravlju i ishrani i drugi savetodavni\ntekstovi na Sajtu odnosno Aplikaciji su isključivo informativnog\nkaraktera i ne predstavljaju medicinski savet, dijagnozu niti lečenje.\nPre promene ishrane ili započinjanja programa mršavljenja, naročito kod\npostojećih zdravstvenih stanja, posavetujte se sa lekarom.</p>\n<p>1.6. <strong>Tehnički uslovi.</strong> Za korišćenje Aplikacije i\nSajta potrebni su uređaj sa pristupom internetu i savremen internet\npregledač. Troškove internet veze snosi Korisnik.</p>\n<p class=\"h\"><strong>2. Korisnički sadržaj i licenca</strong></p>\n<p>2.1. Korisnik zadržava sva prava na sadržaj koji dostavi Centru\n(poruke, fotografije, recenzije, komentari).</p>\n<p>2.2. Davanjem saglasnosti i slanjem Korisničkog sadržaja koji je\nnamenjen objavljivanju (npr. recenzija, fotografije pre i posle)\nKorisnik daje Centru izričitu saglasnost i neekskluzivnu, neprenosivu,\nvremenski neograničenu i teritorijalno neograničenu licencu da taj\nsadržaj, bez naknade, prikazuje, čuva i koristi na Sajtu i/ili\nAplikaciji i zvaničnim društvenim mrežama Centra, uz opoziv u bilo kom\ntrenutku pisanim zahtevom, osim za sadržaj koji je već objavljen u\nštampanim ili arhiviranim materijalima.</p>\n<p>2.3. Korisnik garantuje da je nosilac prava na dostavljeni sadržaj\nili da ima potrebnu dozvolu i da sadržaj ne krši prava trećih lica niti\nzakon.</p>\n<p class=\"h\"><strong>3. Zabranjena ponašanja</strong></p>\n<p>Korisniku je zabranjeno da:</p>\n<ul>\n<li><p>koristi Sajt ili Aplikaciju na način koji je protivan zakonu,\novim Uslovima ili dobrim poslovnim običajima;</p></li>\n<li><p>unosi lažne, netačne ili tuđe podatke, ili se lažno\npredstavlja;</p></li>\n<li><p>pokušava neovlašćen pristup Aplikaciji, Sajtu, serverima, bazama\npodataka ili nalozima drugih lica;</p></li>\n<li><p>unosi ili širi viruse, zlonamerni kod ili sadržaj koji može\noštetiti ili ometati rad Aplikacije i Sajta;</p></li>\n<li><p>koristi automatizovane alate (botove, skripte, scraping) bez\npisane saglasnosti Centra;</p></li>\n<li><p>masovno ili zlonamerno zakazuje termine koje ne namerava da\niskoristi;</p></li>\n<li><p>objavljuje ili šalje uvredljiv, pretnjujući, diskriminatorni,\nnezakonit ili obmanjujući sadržaj, kao i sadržaj kojim se povređuju\nprava trećih lica;</p></li>\n<li><p>kopira, umnožava, distribuira ili komercijalno koristi Sadržaj\nSajta, uključujući materijale iz Obuka, bez prethodne pisane\nsaglasnosti;</p></li>\n<li><p>snima, fotografiše ili emituje tretmane, osoblje, druge Korisnike\nili materijale sa Obuka u prostorijama Centra bez saglasnosti;</p></li>\n</ul>\n<p>U slučaju kršenja zabrana Centar može ograničiti ili ukinuti pristup\nAplikaciji i Sajtu, odbiti pružanje usluge i preduzeti zakonom\ndozvoljene mere.</p>\n<p class=\"h\"><strong>4. Intelektualna svojina</strong></p>\n<p>4.1. Sadržaj Aplikacije i Sajta, uključujući logotip, naziv, vizuelni\nidentitet, tekstove, fotografije, video zapise, galeriju, dizajn,\nstrukturu i programski kod, zaštićen je autorskim i srodnim pravima i\npripada Centru, odnosno licima od kojih je Centar dobio pravo\nkorišćenja. Dizajn Sajta može biti zaštićen i pravima njegovog\nautora.</p>\n<p>4.2. Korisniku se daje ograničeno, neekskluzivno, neprenosivo pravo\nda Aplikaciju i/ili Sajt koristi isključivo za lične, nekomercijalne\npotrebe u skladu sa ovim Uslovima.</p>\n<p>4.3. Materijali koji se dele na Obukama i Edukacijama (skripte,\nprezentacije, protokoli, tehnike rada) predstavljaju intelektualnu\nsvojinu Centra odnosno lica od kojih je Centar dobio pravo korišćenja i\nnamenjeni su isključivo ličnoj upotrebi polaznika i Korisnika. Njihovo\numnožavanje, objavljivanje ili preprodaja nisu dozvoljeni bez pisane\nsaglasnosti ovlašćenog lica Centra.</p>\n<p>4.4. Nazivi uređaja, brendova i proizvoda koji se pominju na Sajtu\npripadaju njihovim vlasnicima.</p>\n<p class=\"h\"><strong>5. Ograničenje odgovornosti i odricanje od\ngarancija</strong></p>\n<p>5.1. Sajt, Aplikacija i informativni sadržaji pružaju se u stanju\n<em>kakvi jesu</em>. Ulažemo razumnu pažnju da informacije na Aplikaciji\ni Sajtu budu tačne i ažurne, ali ne garantujemo da su u svakom trenutku\npotpune, bez grešaka ili odgovaraju svakoj pojedinačnoj situaciji. Cene,\nopisi i dostupnost Usluga mogu se menjati.</p>\n<p>5.2. Centar nije odgovoran za štetu nastalu usled:</p>\n<ul>\n<li><p>pojave tehničkih smetnji, prekida internet veze ili rada servisa\ntrećih lica (uključujući sistem za zakazivanje i servise društvenih\nmreža), na koje Centar ne može uticati;</p></li>\n<li><p>više sile;</p></li>\n<li><p>korišćenja linkova ka spoljnim sajtovima trećih lica, za čiji\nsadržaj Centar ne odgovara.</p></li>\n</ul>\n<p>5.3. U meri u kojoj to zakon dozvoljava, Centar ne odgovara za\nindirektne i posledične štete, kao ni za izgubljenu dobit, izgubljene\nprilike ili druge slične štete nastale u vezi sa korišćenjem Sajta,\nAplikacije ili Usluga, čak i ako je Centar unapred obavešten o\nmogućnosti nastanka takve štete.</p>\n<p class=\"h\"><strong>6. Raspoloživost usluge, održavanje, prekid i suspenzija\nnaloga</strong></p>\n<p>6.1. Trudimo se da Aplikacija i Sajt budu dostupni neprekidno, ali ne\ngarantujemo da će pristup biti bez prekida ili grešaka. Centar može\nprivremeno obustaviti rad Aplikacije, Sajta ili pojedinih funkcija radi\nodržavanja, unapređenja ili iz bezbednosnih razloga, a o planiranim\ndužim prekidima nastojaće da blagovremeno obavesti Korisnike.</p>\n<p>6.2. Centar može iz opravdanih razloga (bolest osoblja, kvar uređaja,\nviša sila) promeniti ili otkazati zakazani termin. U tom slučaju\nKorisniku se nudi novi termin ili povraćaj uplaćenog iznosa za\nneiskorišćenu uslugu ili rezervaciju.</p>\n<p>6.3. Centar može privremeno ili trajno ograničiti ili ukinuti pristup\nAplikaciji i Sajtu, odnosno nalogu Korisnika (u meri u kojoj Centar\nupravlja nalozima), kao i odbiti zakazivanje, u slučaju kršenja ovih\nUslova, zloupotrebe, ponovljenih neopravdanih nedolazaka ili ugrožavanja\nbezbednosti osoblja i drugih Korisnika. Korisnik će, kad je to moguće,\nbiti obavešten o razlozima i imaće mogućnost da se izjasni.</p>\n<p>6.4. Korisnik može u svakom trenutku prestati da koristi Aplikaciju i\nSajt, a brisanje naloga ili podataka može zatražiti slanjem zahteva na\ne-adresu iz tačke VII, uz poštovanje zakonskih rokova čuvanja\ndokumentacije.</p>\n<p class=\"h\"><strong>7. Zaštita podataka o ličnosti</strong></p>\n<p>7.1. Centar obrađuje podatke o ličnosti u skladu sa Zakonom o zaštiti\npodataka o ličnosti i drugim primenjivim propisima. Detaljne informacije\no vrstama podataka koji se prikupljaju, svrhama i pravnom osnovu obrade,\nrokovima čuvanja, primaocima podataka i pravima lica na koje se podaci\nodnose (pristup, ispravka, brisanje, ograničenje obrade, prenosivost,\nprigovor i opoziv saglasnosti) nalaze se u <strong>Politici\nprivatnosti</strong> dostupnoj na Aplikaciji, odnosno Sajtu.</p>\n<p>7.2. Informacije o kolačićima i sličnim tehnologijama koje koristi\nSajt nalaze se u <strong>Politici kolačića</strong>.</p>\n<p>7.3. Podaci o zdravstvenom stanju koje Korisnik dostavi pre Tretmana\nsmatraju se naročito osetljivim podacima i obrađuju se samo u meri\nneophodnoj za bezbedno pružanje Usluge i uz odgovarajući pravni osnov, u\nskladu sa Politikom privatnosti.</p>\n<p>7.4. Ukoliko smatrate da su Vam povređena prava u vezi sa obradom\npodataka o ličnosti, možete se obratiti Centru, a imate pravo da\npodnesete pritužbu Povereniku za informacije od javnog značaja i zaštitu\npodataka o ličnosti.</p>\n<ol start=\"4\" type=\"I\">\n<li><p class=\"h\"><strong>Podaci o pružaocu usluge</strong></p></li>\n</ol>\n<p>U skladu sa Zakonom o elektronskoj trgovini i Zakonom o zaštiti\npotrošača, objavljujemo sledeće podatke:</p>\n<ul>\n<li><p><strong>Poslovno ime / naziv:</strong> ANDRIJANA OBRADOVIĆ PR\nEDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa izdvojenim\nprostorom, poslovno ime pod kojim se nastupa: Beauty &amp; Nutrition –\nEstetsko edukativni centar</p></li>\n<li><p><strong>Pravni oblik:</strong> preduzetnik</p></li>\n<li><p><strong>Sedište i adresa poslovnog prostora:</strong> Živojina\nŽujovića 25, Zvezdara, 11000 Beograd, Srbija, adresa sedišta: Branka\nMiljkovića 27, 34000 Kragujevac</p></li>\n<li><p><strong>PIB:</strong> 113013378</p></li>\n<li><p><strong>Matični broj:</strong> 66506665</p></li>\n<li><p><strong>Registar:</strong> upisan u registar Agencije za\nprivredne registre (APR), broj rešenja o upisu БП 48846/2022 od\n05.05.2022. godine</p></li>\n<li><p><strong>Šifra i opis pretežne delatnosti:</strong> 85.59 – Ostalo\nobrazovanje</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> andrijanaobradovic5@gmail.com</p></li>\n<li><p><strong>Društvene mreže:</strong> Facebook i Instagram\n(@beauty_and_nutrition_)</p></li>\n<li><p><strong>PDV status:</strong> nije u sistemu PDV-a.</p></li>\n</ul>\n<p class=\"h\"><strong><u>Posebni uslovi pružanja Usluga</u></strong></p>\n<p class=\"h\"><strong>1. Opis usluge i prava i obaveze Korisnika</strong></p>\n<p>1.1. <strong>Opis Usluga.</strong> Centar pruža:</p>\n<ul>\n<li><p>kozmetičke tretmane lica navedene u cenovniku (npr. higijenski\ntretman, mezoporacija, oksigen terapija, kolagenski anti-age tretman,\ntretmani sa fototerapijom);</p></li>\n<li><p>tretmane tela (npr. rolosfera, EMS body sculpt, maderoterapija,\nbrazilsko podizanje zadnjice, vacuum sonda, anticelulit\nprogrami);</p></li>\n<li><p>obuke i edukacije za tretmane lica i tela;</p></li>\n</ul>\n<p>1.2. <strong>Cene i sadržaj usluga.</strong> Opis, sadržaj i cena\npojedinačnih usluga i paketa objavljeni su na Aplikaciji i Sajtu i\nizraženi su u dinarima (RSD). Rezultati Tretmana zavise od individualnih\nkarakteristika i mogu se razlikovati od osobe do osobe; opisi rezultata\nu na Aplikaciji i/ili Sajtu nisu garancija konkretnog ishoda.</p>\n<p>1.3. <strong>Zdravstveno stanje Korisnika.</strong> Pre svakog\nTretmana Korisnik je dužan da istinito i potpuno obavesti stručno lice\nCentra o zdravstvenom stanju, alergijama, lekovima koje uzima, trudnoći\ni dojenju, implantatima (uključujući pejsmejker i metalne implantate),\nkožnim oboljenjima i drugim okolnostima relevantnim za bezbednost\nTretmana. Pojedini Tretmani su kontraindikovani u određenim stanjima, a\nCentar zadržava pravo da odbije ili prekine Tretman ukoliko proceni da\nbi mogao ugroziti zdravlje Korisnika. Korisnik može biti zamoljen da\npopuni i potpiše informisani pristanak ili upitnik pre Tretmana na licu\nmesta.</p>\n<p>1.4. <strong>Zakazivanje i dolazak.</strong> Termin se zakazuje preko\nsistema za online zakazivanje dostupnog u Aplikaciji, telefonom, putem\nsistema web sajta „sredi me“ ili putem društvenih mreža. Molimo da na\ntretman dođete na vreme. Kašnjenje može skratiti trajanje Tretmana i/ili\nEdukacije bez umanjenja cene, ako se tretman ne može izvesti u celosti u\npreostalom vremenu.</p>\n<p>1.5. <strong>Zakazivanje putem Aplikacije.</strong></p>\n<p>Zakazivanje putem Aplikacije vrši se u skladu sa Opštim uslovima\nkorišćenja Sajta i Aplikacije. Prilikom rezervacije termina, Korisnik\nbira osobu iz salona koja će obaviti tretman u skladu sa ponuđenim\nmogućnostima. Radi dobijanja potvrde rezervisanog termina, putem\nAplikacije, Korisnik je dužan da unapred uplati avans od 30% ukupne cene\nizabrane Usluge, na ime rezervacije termina Tretmana ili\nEdukacije. Preostali iznos plaća se prilikom\npružanja Usluge.</p>\n<p>1.6. <strong>Otkazivanje i pomeranje Termina.</strong> Termin je\nmoguće otkazati ili pomeriti najkasnije 24 (dvadeset četiri) sata pre\nzakazanog vremena, telefonom ili preko sistema za zakazivanje. Razumemo\nda se nepredviđene situacije dešavaju, ali otkazivanje u kraćem roku ne\nostavlja dovoljno vremena da se upražnjeni termin ponudi drugom\nKorisniku. Zbog toga, u slučaju otkazivanja nakon navedenog roka ili\nnedolaska bez prethodnog obaveštenja, Centar zadržava pravo da\nkumulativno: zadrži naplaćeni iznos 30% cene Usluge na ime rezervacije\ntermina Tretmana ili Edukacije; odbije zakazivanje novih termina bez\nprethodne uplate; smatra Termin iskorišćenim u okviru paketa.</p>\n<p>1.7. <strong>Paketi tretmana.</strong> Paketi (npr. Paket od 5 ili\npaket od 10 tretmana) koriste se prema dinamici koju preporuči stručno\nlice Centra. Rok važenja paketa je 1 mesec od dana uplate, osim ukoliko\nje drukčije dogovoreno. Neiskorišćeni tretmani nakon isteka roka\nprestaju da važe. Izuzetno, neiskorišćeni tretmani nakon isteka roka,\nmogu se produžiti uz dogovor i potvrdu Centra.</p>\n<p>1.8. <strong>Obuke i Edukacije.</strong> Prijava na Obuku i Edukaciju\nvrši se putem kontakt forme Aplikacije, telefona, telefona ili\ndruštvenih mreža. program, trajanje, termin, cena i uslovi izdavanja\npotvrde ili sertifikata dogovaraju se pojedinačno i potvrđuju pre\nuplate. Centar zadržava pravo da promeni termin održavanja iz opravdanih\nrazloga, uz blagovremeno obaveštenje, kao i da otkaže Obuku i/ili\nEdukaciju ili izvrši zakazivanje u novom terminu. Završetak Obuke i/ili\nEdukacije ne predstavlja javnu ispravu niti zamenu za obrazovanje\nstečeno u okviru formalnog obrazovnog sistema.</p>\n<p>1.9. <strong>Vaučeri i njihovo korišćenje.</strong> Vaučeri se mogu\nkoristiti za plaćanje Usluga i Edukacija koje Centar nudi, u skladu sa\nnjihovom nominalnom vrednošću i/ili izabranim Uslugama, shodno ponuđenim\ni dogovorenim uslovima. Prilikom korišćenja vaučera, Korisnik je dužan\nda prezentuje validan Vaučer. Rok važenja vaučera je 12 meseci od dana\nkupovine. Ukoliko je cena odabrane usluge veća od vrednosti vaučera,\nKorisnik je dužan da doplati razliku, dok se eventualni neiskorišćeni\niznos može koristiti za naredne Usluge u roku od 12 meseci od dana\nkupovine vaučera. Vaučeri se ne mogu zameniti za novac, osim kada je to\npredviđeno zakonskim uslovima ili izuzetno, uz odobrenje i pristanak\nCentra.</p>\n<p>1.10. <strong>Obaveze Korisnika.</strong> Korisnik je dužan da\npoštuje ove Uslove, pravila ponašanja Centra, uputstva stručnog osoblja\ni higijenske mere, da ne pristupa tretmanima pod dejstvom psihoaktivnih\nsupstanci i bez ometajućeg ponašanja i da blagovremeno izmiruje obaveze\nplaćanja.</p>\n<p>1.11. <strong>Fotografije i snimci pre/posle tretmana.</strong>\nFotografije i video zapisi Korisnika (uključujući snimke pre i posle\ntretmana) objavljuju se isključivo uz prethodnu izričitu pisanu\nsaglasnost Korisnika, koju je moguće opozvati u bilo kom trenutku bez\nposledica po pružanje Usluga.</p>\n<p>1.12. Centar zadržava pravo da ukloni sadržaj koji je u suprotnosti\nsa ovim Uslovima ili relevantnim zakonskim propisima.</p>\n<p class=\"h\"><strong>2. Cene, naplata, pretplata i otkazivanje</strong></p>\n<p>2.1. Cene su izražene u dinarima (RSD) bez obračunatog PDV-a budući\nda pružalac nije u sistemu PDV-a i važe u trenutku zaključenja ugovora.\nCentar zadržava pravo izmene cena; izmena ne utiče na već zaključene\nugovore i plaćene Usluge.</p>\n<p>2.2. Plaćanje se vrši gotovinom, platnim karticama, ili uplatom na\nračun. Za potvrdu\nrezervisanog termina putem Aplikacije, Korisnik je dužan da unapred\nuplati avans od 30% ukupne cene ugovorene Usluge, kako u slučaju\nzakazivanja Tretmana, tako i u slučaju zakazivanja Edukacije.\nObuke i paketi mogu zahtevati avansnu uplatu ili uplatu u ratama, o čemu\nse Korisnik obaveštava pre uplate.</p>\n<p>2.3. Za sve uplate Centar izdaje fiskalni račun ili drugi dokument u\nskladu sa propisima o fiskalizaciji.</p>\n<p>2.4. Centar trenutno ne nudi pretplatu sa automatskim obnavljanjem.\nUkoliko se takva usluga uvede, Korisnik će o tome biti jasno obavešten\npre zaključenja ugovora, uz navođenje cene, trajanja i načina\notkazivanja.</p>\n<p>2.5. <strong>Povraćaj sredstava.</strong> U slučajevima u kojima\nKorisnik ima pravo na povraćaj novca (otkazivanje Obuke od strane\nKorisnika ili Centra, nemogućnost pružanja usluge ili opravdan\nodustanak), povraćaj se vrši istim sredstvom plaćanja kojim je izvršena\nuplata, bez nepotrebnog odlaganja, a najkasnije u roku od 14 dana od\ndana prijema izjave o odustanku ili od dana kada je utvrđeno pravo na\npovraćaj.</p>\n<p class=\"h\"><strong>3. Prava potrošača</strong></p>\n<p>3.1. <strong>Pravo na odustanak (14 dana).</strong> Potrošač koji\nzaključi ugovor na daljinu (npr. Putem Aplikacije ili telefonom) ima, u\nskladu sa Zakonom o zaštiti potrošača, pravo da odustane od ugovora u\nroku od 14 dana od dana zaključenja ugovora, bez navođenja razloga.\nIzjavu o odustanku možete poslati na e-mail adresu: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>\nili poštom na adresu Centra, preuzimanjem i korišćenjem <strong>obrasca\nza odustanak</strong> ili bilo koje nedvosmislene izjave.</p>\n<p>3.2. <strong>Izuzeci od prava na odustanak.</strong> Potrošač nema\npravo na odustanak, između ostalog:</p>\n<ul>\n<li><p>kada je Usluga u potpunosti izvršena, ako je njeno izvršenje\npočelo uz prethodnu izričitu saglasnost potrošača i uz njegovu potvrdu\nda zna da će izgubiti pravo na odustanak nakon potpunog\nizvršenja;</p></li>\n<li><p>kada se radi o digitalnom sadržaju koji se ne isporučuje na\ntrajnom nosaču podataka (npr. snimljena predavanja ili onlajn\nmaterijali), ako je isporuka počela uz prethodnu izričitu saglasnost\npotrošača i njegovu potvrdu da time gubi pravo na odustanak;</p></li>\n<li><p>u drugim slučajevima predviđenim zakonom.</p></li>\n</ul>\n<p>3.3. Ukoliko potrošač odustane od ugovora o usluzi čije je izvršenje\npočelo na njegov izričit zahtev u toku roka za odustanak, dužan je da\nplati srazmerni deo cene za do tada pružene Usluge.</p>\n<p>3.4. <strong>Ugovori zaključeni u poslovnim prostorijama.</strong> Za\nUsluge ugovorene i pružene neposredno u prostorijama Centra pravo na\nodustanak iz tačke 3.1. ne primenjuje se, ali Potrošač zadržava sva\nprava iz osnova saobraznosti i reklamacije.</p>\n<p>3.5. <strong>Reklamacije.</strong> Potrošač ima pravo da uloži\nreklamaciju ukoliko smatra da Usluga nije pružena u skladu sa ugovorom,\nkao i zbog pogrešno obračunate cene i drugih nedostataka. Reklamaciju\nmožete uložiti usmeno u prostorijama Centra Živojina Žujovića 25,\nZvezdara, 11000, ili pisanim putem e-mail adrese: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>,\nuz navođenje podataka o klijentu, usluzi, datumu pružanja i opisa\nnedostatka, uz dostavljanje računa na uvid ili drugog dokaza o pruženoj\nusluzi. Obrazac reklamacije možete preuzeti klikom na <strong>obrazac za\nreklamacije</strong> ispod.\nCentar će potvrditi prijem reklamacije i o njoj odlučiti najkasnije u\nroku od 8 dana od dana prijema, a najkasnije u roku od 15 dana pisanim\nili elektronskim putem odgovoriti Potrošaču, u skladu sa zakonom. Centar\nvodi evidenciju primljenih reklamacija. U slučaju opravdane reklamacije,\nPotrošač može zahtevati\notklanjanje nedostatka, umanjenje cene, ponovno pružanje usluge ili\nraskid ugovora uz povraćaj novca, u skladu sa zakonom.</p>\n<p>3.6. <strong>Vansudsko rešavanje potrošačkih sporova.</strong>\nUkoliko Potrošač nije zadovoljan ishodom reklamacije, može pokrenuti\npostupak vansudskog rešavanja potrošačkog spora pred ovlašćenim telom\n(posrednikom) upisanim u registar koji vodi ministarstvo nadležno za\nposlove trgovine i zaštite potrošača, kao i obratiti se udruženjima za\nzaštitu potrošača.</p>\n<p>3.7. Odredbe ovih Uslova ne isključuju niti ograničavaju prava koja\npotrošaču pripadaju po prinudnim propisima.</p>\n<p class=\"h\"><strong>4. Ograničenje odgovornosti i odricanje od\ngarancija</strong></p>\n<p>4.1. Cene, opisi i dostupnost Usluga mogu se menjati.</p>\n<p>4.2. Centar nije odgovoran za štetu nastalu usled:</p>\n<ul>\n<li><p>netačnih, nepotpunih ili prećutanih podataka o zdravstvenom\nstanju koje je dao Korisnik;</p></li>\n<li><p>nepoštovanja uputstava stručnog osoblja pre, tokom i nakon\nTretmana i Usluga;</p></li>\n<li><p>rezultata Edukacija u meri u kojoj oni zavise od angažovanja,\nzalaganja, primene stečenih znanja i veština, kao i ukupne uključenosti\nKorisnika u proces edukacije.</p></li>\n</ul>\n<p>4.3. Individualni rezultati tretmana variraju i ne mogu se\ngarantovati.</p>\n<p>4.4. U meri u kojoj to zakon dozvoljava, Centar ne odgovara za\nindirektne i posledične štete, kao ni za izgubljenu dobit, izgubljene\nprilike ili druge slične štete nastale u vezi sa pružanjem Usluga, čak i\nako je Centar unapred obavešten o mogućnosti nastanka takve štete.</p>\n<p>4.5. Ništa u ovim Uslovima ne isključuje odgovornost centra za\npružene Usluge koja se po zakonu i prinudnim propisima ne može\nisključiti.</p>\n<ol start=\"5\" type=\"I\">\n<li><p class=\"h\"><strong>Izmene Uslova i način obaveštavanja\nkorisnika</strong></p></li>\n</ol>\n<p>Centar zadržava pravo da povremeno menja ove Uslove korišćenja,\nnaročito radi usklađivanja sa propisima, promenama u uslugama,\nposlovanju ili tehničkim funkcionalnostima.</p>\n<p>Izmenjeni Uslovi korišćenja objavljuju se na Sajtu sa novim datumom\nposlednje izmene. Molimo Vas da, pre korišćenja Aplikacije i Sajta, kao\ni pre zakazivanja Usluga, proverite da li ste upoznati sa sa najnovijom\nvažećom verzijom ovih Uslova korišćenja.</p>\n<p>Nastavak korišćenja Aplikacije i/ili Sajta i zakazivanje Usluga nakon\npočetka primene izmena smatra se prihvatanjem izmenjenih Uslova\nkorišćenja. Ukoliko se Korisnik ne slaže sa izmenama, dužan je da\nprestane da koristi Aplikaciju i/ili Sajt. Izmene ne utiču na prava\nstečena iz već zaključenih ugovora.</p>\n<ol start=\"6\" type=\"I\">\n<li><p class=\"h\"><strong>Merodavno pravo i nadležni sud</strong></p></li>\n</ol>\n<p>Na ove Uslove korišćenja i na sve odnose između Centra i Korisnika\nprimenjuje se pravo Republike Srbije.</p>\n<p>Sporove koji proisteknu iz ovih Uslova ili u vezi sa njima strane će\nnastojati da reše sporazumno. Ukoliko sporazumno rešenje nije moguće, za\nrešavanje spora nadležan je stvarno nadležni sud u Beogradu.</p>\n<p>Za potrošačke sporove ostaje nepromenjeno pravo Potrošača da se\nobrati sudu koji je zakonom određen kao nadležan, kao i pravo na\nvansudsko rešavanje spora iz tačke 3.6.</p>\n<ol start=\"7\" type=\"I\">\n<li><p class=\"h\"><strong>Delimična ništavost i celokupnost\nugovora</strong></p></li>\n</ol>\n<p>Ukoliko se neka odredba ovih Uslova korišćenja pokaže ništavom,\nnevažećom ili neprimenjivom, to ne utiče na punovažnost ostalih odredbi.\nTakva odredba biće zamenjena važećom odredbom koja je po dejstvu\nnajbliža nameri originalne odredbe.</p>\n<p>Ovi Uslovi korišćenja, zajedno sa Politikom privatnosti, Politikom\nkolačića, kao i svim pojedinačnim potvrdama termina, ponudama i pisanim\ndogovorima o Uslugama, čine celokupan sporazum između Centra i Korisnika\nu vezi sa predmetom Uslova i zamenjuju sve prethodne dogovore.</p>\n<p>Propuštanje Centra da u određenom trenutku ostvari neko svoje pravo\nne znači odricanje od tog prava.</p>\n<p>Korisnik ne može preneti svoja prava i obaveze iz ovih Uslova\nkorišćenja na treće lice bez pisane saglasnosti Centra.</p>\n<ol start=\"8\" type=\"I\">\n<li><p class=\"h\"><strong>Kontakt za pitanja i prigovore</strong></p></li>\n</ol>\n<p>Za sva pitanja, primedbe, prigovore, reklamacije i zahteve u vezi sa\novim Uslovima korišćenja i Uslugama možete nas kontaktirati:</p>\n<ul>\n<li><p class=\"h\"><strong>Beauty &amp; Nutrition – Estetsko edukativni\ncentar</strong></p></li>\n<li><p><strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000\nBeograd</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p></li>\n<li><p><strong>Instagram:</strong> @beauty_and_nutrition_</p></li>\n<li><p><strong>Facebook:</strong> Beauty &amp; Nutrition (stranica na\nFacebook-u)</p></li>\n<li><p><strong>Radno vreme:</strong> ponedeljak-petak na zakazivanje;\nsubota: 10h-15h; nedelja: neradan dan.</p></li>\n</ul>\n<p>Na pisane upite odgovaramo u razumnom roku, a najkasnije u rokovima\npredviđenim zakonom.</p>\n<p class=\"h\"><strong>18. Datum poslednje izmene</strong></p>\n<p>Ovi Uslovi korišćenja poslednji put izmenjeni su <strong>6. novembra\n2026. godine</strong>.</p>\n", "odustanak": "<p><strong>OBRAZAC ZA ODUSTANAK OD UGOVORA</strong></p>\n<p><strong>Primalac obrasca:</strong> <strong>:</strong> ANDRIJANA\nOBRADOVIĆ PR EDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa\nizdvojenim prostorom, poslovno ime pod kojim se nastupa: Beauty &amp;\nNutrition – Estetsko edukativni centar<br />\n<strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000 Beograd,\nSrbija, adresa sedišta: Branka Miljkovića 27, 34000 Kragujevac<br />\n<strong>E-mail:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p>\n<p>Ovim obrascem obaveštavam pružaoca usluge da odustajem od ugovora\nzaključenog na daljinu, u meri u kojoj imam pravo na odustanak u skladu\nsa važećim propisima.</p>\n<p><strong>1. Podaci o korisniku</strong></p>\n<p>Ime i prezime: __________________________________</p>\n<p>Adresa: ________________________________________</p>\n<p>E-mail adresa: __________________________________</p>\n<p>Broj telefona (opciono): __________________________</p>\n<p><strong>2. Podaci o ugovoru</strong></p>\n<p>Vrsta usluge:</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Kozmetički\ntretman</label></p></li>\n<li><p><label><input type=\"checkbox\" />Edukacija uživo</label></p></li>\n<li><p><label><input type=\"checkbox\" />Online edukacija ili digitalni\nsadržaj</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Naziv usluge: ___________________________________</p>\n<p>Datum zaključenja ugovora odnosno rezervacije: ______________</p>\n<p>Datum zakazanog termina: ______________</p>\n<p>Ukupan ugovoreni iznos Usluge: ______________ RSD</p>\n<p>Uplaćeni avans: ______________ RSD</p>\n<p><strong>3. Izjava o odustanku</strong></p>\n<p>Ovim izjavljujem da odustajem od navedenog ugovora, u skladu sa\nprimenjivim zakonskim uslovima.</p>\n<p>Razlog odustanka (opciono):</p>\n<p><strong>4. Podaci za povraćaj novca</strong></p>\n<p>Ime vlasnika računa: ______________________________</p>\n<p>Broj tekućeg računa (ako je potreban): _________________</p>\n<p>Iznos čiji se povraćaj traži: ______________ RSD</p>\n<p><strong>5. Dodatne informacije</strong></p>\n<p>Da li je usluga već započeta ili izvršena?</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Ne</label></p></li>\n<li><p><label><input type=\"checkbox\" />Da</label></p></li>\n<li><p><label><input type=\"checkbox\" />Delimično</label></p></li>\n</ul>\n<p>Datum podnošenja obrasca: ________________________</p>\n<p>Ime i prezime korisnika: ___________________________</p>\n<p><strong>Napomena:</strong> Pravo na odustanak, eventualna naknada za\nveć pruženi deo usluge i povraćaj novca procenjuju se prema vrsti\nugovora i važećim zakonskim pravilima. Podnošenje obrasca ne znači\nautomatski da su ispunjeni svi uslovi za povraćaj celokupnog iznosa.</p>\n", "reklamacija": "<p><strong>OBRAZAC ZA REKLAMACIJU</strong></p>\n<p><strong>Pružalac usluge:</strong> <strong>:</strong> ANDRIJANA\nOBRADOVIĆ PR EDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa\nizdvojenim prostorom, poslovno ime pod kojim se nastupa: Beauty &amp;\nNutrition – Estetsko edukativni centar<br />\n<strong>Adresa sedišta:</strong> Živojina Žujovića 25, Zvezdara, 11000\nBeograd, Srbija, adresa sedišta: Branka Miljkovića 27, 34000\nKragujevac<br />\n<strong>Matični broj:</strong> 66506665 <strong>PIB:</strong>\n113013378<br />\n<strong>E-mail za reklamacije:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p>\n<p><strong>1. Podaci o korisniku</strong></p>\n<p>Ime i prezime: __________________________________</p>\n<p>E-mail adresa: __________________________________</p>\n<p>Broj telefona (opciono): __________________________</p>\n<p><strong>2. Podaci o usluzi</strong></p>\n<p>Vrsta usluge:</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Kozmetički\ntretman</label></p></li>\n<li><p><label><input type=\"checkbox\" />Edukacija</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Naziv usluge: ___________________________________</p>\n<p>Datum pružanja usluge ili zakazanog termina: ______________</p>\n<p>Broj rezervacije ili porudžbine (ako postoji): ______________</p>\n<p>Plaćeni iznos: ______________ RSD</p>\n<p><strong>3. Opis reklamacije</strong></p>\n<p>Molimo vas da opišete problem zbog kojeg podnosite reklamaciju:</p>\n<p><strong>4. Zahtev korisnika</strong></p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Otklanjanje nedostatka, kada je\nprimenljivo</label></p></li>\n<li><p><label><input type=\"checkbox\" />Ponovno pružanje usluge, kada je\nprimenljivo</label></p></li>\n<li><p><label><input type=\"checkbox\" />Umanjenje cene, kada je\nopravdano</label></p></li>\n<li><p><label><input type=\"checkbox\" />Povraćaj novca, kada za to\npostoje zakonski uslovi</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Dodatno obrazloženje zahteva:</p>\n<p><strong>5. Prilozi</strong></p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Potvrda rezervacije ili\nkupovine</label></p></li>\n<li><p><label><input type=\"checkbox\" />Dokaz o uplati, ako je\npotreban</label></p></li>\n<li><p><label><input type=\"checkbox\" />Fotografije ili druga relevantna\ndokumentacija</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Datum podnošenja reklamacije: _____________________</p>\n<p><strong>Napomena:</strong> Podnošenje reklamacije ne utiče na druga\nprava koja korisnik ima prema važećim propisima. Pružalac usluge će\nevidentirati reklamaciju, potvrditi njen prijem i odgovoriti u zakonom\npropisanom roku.</p>\n"};

function forgotModal(){
  const pre=[$("#l-id"),$("#r-email")].map(x=>x?x.value.trim():"").find(v=>v.includes("@"))||"";
  showModal(`<h3>Zaboravljena lozinka</h3>
  <p class="note" style="margin:0 0 12px">Unesite e-mail adresu naloga - šaljemo vam link za postavljanje nove lozinke${S.smsEnabled?" (na e-mail i SMS-om na broj iz naloga)":""}. Link važi 1 sat.</p>
  <div id="fg-err" class="err hidden"></div>
  <div class="field"><label for="fg-mail">E-mail</label><input id="fg-mail" type="email" autocomplete="email" value="${esc(pre)}"></div>
  <div style="display:flex;gap:10px"><button class="btn btn-gold btn-sm" id="fg-send">Pošalji link</button><button class="btn btn-ghost btn-sm" id="m-close">Odustani</button></div>`);
  $("#fg-send").onclick=async()=>{
    const em=$("#fg-mail").value.trim();
    const err=m=>{const b=$("#fg-err");if(b){b.textContent=m;b.classList.remove("hidden")}};
    if(!em)return err("Unesite e-mail adresu.");
    const btn=$("#fg-send");btn.disabled=true;
    try{
      const r=await apiPost("/api/forgot",{email:em});
      const via=[r.mail!==false?"na e-mail":"",r.sms?"SMS-om na broj iz naloga":""].filter(Boolean).join(" i ");
      showModal(`<h3>Proverite ${r.mail!==false?"e-mail":"telefon"}</h3><p class="note">Ako nalog sa adresom <b>${esc(em)}</b> postoji, link za novu lozinku je upravo poslat ${esc(via)}.${r.mail!==false?" Pogledajte i Spam/Promotions folder.":""}</p><div style="margin-top:14px"><button class="btn btn-gold btn-sm" id="m-close">U redu</button></div>`);
    }catch(e){err(e.message);btn.disabled=false}
  };
}

function phoneModal(then){
  showModal(`<h3>Broj telefona</h3>

    const v=$("#ph-tel").value.trim();

function showModal(html,cls){
  const r=$("#modal-root");
  r.innerHTML=`<div class="modal-bg" id="m-bg"><div class="modal ${cls||""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#m-bg").addEventListener("click",e=>{if(e.target.id==="m-bg")closeModal()});
  const x=$("#m-close");if(x)x.onclick=closeModal;
  wireEyes(r);
  r.querySelectorAll("[data-copymail]").forEach(b=>b.onclick=()=>copyText(b.dataset.copymail));
}
function closeModal(){$("#modal-root").innerHTML=""}

async function renderSlots(){
  const area=$("#slot-area");if(!area||!S.bDate)return;
  area.innerHTML=`<div class="loading">Proveravam slobodne termine…</div>`;
  try{
    const {slots,h,off}=await computeSlots(S.bDate);
    const emp=S.bEmp!=="__any"?S.employees.find(e=>e.id===S.bEmp):null;
    if(!h){area.innerHTML=`<p class="note">Salon ne radi izabranog dana.</p>`;return}
    if(off){area.innerHTML=`<p class="note">${emp?esc(emp.name)+" ne radi izabranog dana - izaberite drugi datum ili „Bilo koja slobodna“.":"Tog dana ne radi nijedna kozmetičarka za izabrane tretmane - izaberite drugi datum."}</p>`;return}
    if(!slots.length){area.innerHTML=`<p class="note">Nema termina u koje staju svi izabrani tretmani tog dana.</p>`;return}
    area.innerHTML=`<p class="note" style="margin:0 0 10px">${emp?esc(emp.name)+" radi":"Radno vreme"}: ${toHM(h.open)}-${toHM(h.close)}</p>
      <div class="slots">${slots.map(s=>`<button class="slot ${S.bSlot===s.t?"on":""}" data-slot="${s.t}" ${s.free?"":"disabled"}>${toHM(s.t)}</button>`).join("")}</div>`;
    area.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{S.bSlot=+b.dataset.slot;
      area.querySelectorAll(".slot").forEach(x=>x.classList.toggle("on",x===b));
      const p=$("#bk-pick");if(p)p.textContent=fmtD(S.bDate)+" u "+toHM(S.bSlot);
      const c=$("#bk-confirm");if(c&&S.me)c.disabled=false;
    });
  }catch(e){area.innerHTML=`<p class="note">Termine trenutno nije moguće učitati. Pokušajte ponovo.</p>`}
}
/* avans 30% je obavezan za sve usluge, tretmane i edukacije; podaci za uplatu dolaze sa servera (/api/public), ovo je rezerva */
const AVANS0={pct:30,racun:"160-6000001958308-27",primalac:"Andrijana Obradović",svrha:"Avans"};
const avansCfg=()=>S.avans||AVANS0;
const avansAmt=(r,e)=>{const p=avansCfg().pct;return {r:Math.round((+r||0)*p/100),e:Math.round((+e||0)*p)/100}};
/* kratka napomena u pregledu pre potvrde rezervacije */
function avansMini(r,e){
  const a=avansAmt(r,e);if(!a.r&&!a.e)return "";
  return `<div class="av-mini">Obavezan avans ${avansCfg().pct}%: <b>${money(a.r,a.e)}</b><br>Podatke za uplatu dobijate kad salon potvrdi termin.</div>`;
}
/* podaci za uplatu; edu = edukacije (iznos po dogovoru) */
function avansBox(r,e,edu){
  const A=avansCfg(),a=avansAmt(r,e),has=!!(a.r||a.e);
  const amt=has?money(a.r,a.e):A.pct+(edu?"% dogovorene cene":"% cene usluge");
  const row=(k,v,copy)=>`<div class="av-row"><span>${k}</span><b>${esc(v)}</b>${copy?`<button class="copybtn" data-copymail="${esc(copy)}">Kopiraj</button>`:""}</div>`;
  return `<div class="avans-box" role="note">
    <div class="av-h">Obavezan avans ${A.pct}%${has?": "+esc(amt):""}</div>
    ${row("Primalac",A.primalac)}${row("Tekući račun",A.racun,A.racun)}${row("Svrha uplate",A.svrha)}${row("Iznos",amt,has&&!a.e?String(a.r):"")}
    <p class="av-p">${edu?"Avans je obavezan i za sve edukacije i obuke.":"Avans je obavezan za sve usluge i tretmane. Preostali iznos plaća se u salonu."}</p>
  </div>`;
}
const hasPrice=b=>!!((b.totalPrice||0)||(b.totalPriceEur||0));

  showModal(`<h3>Uplata avansa</h3>
    <p class="note" style="margin:0"><b>${esc(fmtD(b.date))} u ${esc(b.start)}</b> · ${esc(b.services.map(svcLine).join(" + "))}</p>

/* posle rezervacije: strana i iskačući prozor. Online rezervacija je zahtev (status „ceka"): salon je potvrđuje ili odbija u adminu,
   pa klijent ovde vidi „Zahtev je poslat" bez podataka za uplatu - oni stižu e-mailom uz potvrdu. Mejl ume da završi u Spam/Junk folderu, pa to piše na oba mesta */
const spamNote=(b,what)=>S.mailEnabled&&b.userEmail?`<div class="spam-box" role="note"><b>Proverite e-mail.</b> ${what||"Potvrda"} je poslata na <b>${esc(b.userEmail)}</b>. Ako je ne vidite u prijemnom sandučetu, pogledajte folder <b>Spam</b> ili <b>Junk</b> (neželjena pošta), kao i karticu Promocije. Označite poruku sa „Nije spam" da vam obaveštenja stižu redovno.</div>`:"";
const isWait=b=>!!b&&b.status==="ceka";
/* šta klijenta čeka dok salon ne odluči: potvrda i podaci za uplatu avansa stižu e-mailom */
const waitNote=b=>{const a=avansAmt(b.totalPrice||0,b.totalPriceEur||0),has=!!(a.r||a.e);
  return `<div class="wait-box" role="note"><b>Salon potvrđuje termin u najkraćem roku.</b> Termin je rezervisan za vas dok salon ne odluči; obaveštenje stiže na e-mail${has?`, a uz potvrdu i podaci za uplatu obaveznog avansa ${avansCfg().pct}%: <b>${money(a.r,a.e)}</b>`:""}. Do potvrde se podsetnici ne šalju.</div>`};
function doneModal(b){
  if(!b)return;
  const w=isWait(b);
  showModal(`<div class="done-pop">
    <div class="ok-ico">${ICON_OK}</div>
    <h3>${w?"Zahtev je poslat!":"Vaš termin je zakazan!"}</h3>
    <p class="note"><b>${esc(fmtD(b.date))} u ${esc(b.start)}</b>${b.employeeName?" · "+esc(b.employeeName):""}</p>
    ${w?waitNote(b):hasPrice(b)?avansBox(b.totalPrice||0,b.totalPriceEur||0):""}
    ${spamNote(b,w?"Potvrda prijema zahteva":"")}
    <button class="btn btn-gold" id="m-close" style="width:100%">U redu</button>
  </div>`,"done-modal");
}

/* statusi: zakazano (potvrđeno), ceka (online zahtev čeka potvrdu salona), odbijeno (salon odbio), otkazano */
const ST={zakazano:["Zakazano","pill-ok"],ceka:["Čeka potvrdu salona","pill-wait"],odbijeno:["Odbijeno","pill-off"],otkazano:["Otkazano","pill-off"]};
const stPill=b=>{const x=ST[b.status]||[b.status,"pill-cat"];return `<span class="pill ${x[1]}">${esc(x[0])}</span>`};
function bkCard(b,adminView){
  const d=parseD(b.date);const past=b.date<dstr(new Date());
  const wait=b.status==="ceka";
  const cancellable=(b.status==="zakazano"||wait)&&!past;
  const man=adminView&&b.source==="manual"&&b.status==="zakazano";
  return `<div class="card bk${wait?" wait":""}" data-bk="${esc(b.id)}">
    <div class="when"><div class="d">${d.getDate()}.</div><div class="m">${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</div><div class="t">${esc(b.start)}-${esc(b.end)}</div></div>
    <div class="mid">
      <div class="who">${adminView?esc(b.userName):esc(b.employeeName)}</div>
      ${adminView?`<div class="note">${esc([b.userEmail,b.userTel,"kod: "+b.employeeName].filter(Boolean).join(" · "))}</div>`:""}
      <div class="list">${b.services.map(s=>esc(s.name)+(s.pkg?` · <b class="pk-tag">${esc(pkgName(s.pkg))}</b>`:"")).join(" + ")}</div>
      ${adminView&&b.note?`<div class="note">Napomena: ${esc(b.note)}</div>`:""}
      <div class="tags">
        ${stPill(b)}
        <span class="pill pill-cat">${esc(durTxt(b.totalDuration))}</span>
        ${adminView&&b.source==="manual"?`<span class="pill pill-cat">Ručni unos</span>`:""}
        ${adminView&&b.blocked?`<span class="pill pill-off" title="Klijent ne može da zakazuje online">Blokiran klijent</span>`:""}
      </div>
      ${!adminView&&wait&&!past?`<div class="note" style="margin-top:8px">Salon potvrđuje termin u najkraćem roku; obaveštenje i podaci za uplatu avansa stižu na e-mail.</div>`:""}
      ${adminView&&wait?`<div class="note" style="margin-top:8px">Zahtev poslat ${esc(fmtWhen(b.created))}; termin je zauzet dok se ne odluči.</div>`:""}
    </div>
    <div class="side">
      <div class="price">${money(b.totalPrice||0,b.totalPriceEur||0)}</div>
      ${adminView&&wait&&!past?`<button class="btn btn-gold btn-sm" data-accept="${esc(b.id)}">Potvrdi</button>
      <button class="btn btn-danger btn-sm" data-reject="${esc(b.id)}">Odbij</button>`:""}
      ${man?`<button class="btn btn-ghost btn-sm" data-bkedit="${esc(b.id)}">Izmeni</button>
      <button class="btn btn-ghost btn-sm" data-bkdel="${esc(b.id)}" title="Briše pogrešno unet termin, bez obaveštenja klijentu">Obriši</button>`:""}
      ${!adminView&&cancellable&&!wait&&hasPrice(b)?`<button class="btn btn-ghost btn-sm" data-avans="${esc(b.id)}">Uplata avansa</button>`:""}
      ${adminView&&isAdmin()&&(b.userTel||b.userEmail)&&b.status!=="otkazano"?`<button class="btn btn-ghost btn-sm" data-bkblock="${esc(b.id)}" title="${b.blocked?"Klijent ponovo može da zakazuje online":"Npr. posle nedolaska: klijent više ne može da zakazuje online"}">${b.blocked?"Odblokiraj":"Blokiraj"}</button>`:""}
      ${cancellable&&!(adminView&&wait)?`<button class="btn btn-danger btn-sm" data-cancel="${esc(b.id)}">${wait?"Otkaži zahtev":"Otkaži"}</button>`:""}
    </div>
  </div>`;
}
/* „8. nov u 11:45" za vreme slanja zahteva */
const fmtWhen=iso=>{const d=new Date(iso||"");if(isNaN(d))return"";return d.getDate()+". "+MONTHS[d.getMonth()].toLowerCase()+" u "+pad(d.getHours())+":"+pad(d.getMinutes())};

  const up=S.myBookings.filter(b=>b.date>=dstr(new Date())).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1);

  return `

const pl=(n,one,few,many)=>{const a=n%10,b=n%100;return n+" "+(a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many)};

function cliMatch(c,q){
  const f=fold(q).trim();if(!f)return true;
  const d=digits(q);
  if(d.length>=3&&!/\p{L}/u.test(q)){const cd=digits(c.tel),d0=d.replace(/^(00381|381|0)/,"");return cd.includes(d)||(d0.length>=3&&cd.includes(d0))}
  const nm=fold(c.name),em=fold(c.email);
  return f.split(/\s+/).every(w=>nm.includes(w)||em.includes(w));
}
function cliMeta(c){

  if(c.visits)a.push(pl(c.visits,"dolazak","dolaska","dolazaka")+(c.last?" · poslednji "+fmtShort(c.last):""));
  if(c.next)a.push("zakazan "+fmtShort(c.next));

/* tabela iz Excela/CSV: razdvajač tab, ; ili , (navodnici kao u CSV-u) */
function csvRows(text){
  text=String(text||"").replace(/^\ufeff/,"");
  const sample=text.split(/\r\n|\r|\n/).filter(l=>l.trim()).slice(0,30);
  if(!sample.length)return [];
  const cnt=ch=>sample.reduce((a,l)=>a+l.split(ch).length-1,0);
  const delim=cnt("\t")?"\t":cnt(";")&&cnt(";")>=cnt(",")?";":cnt(",")?",":"\t";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&!cell.trim())q=true;
    else if(ch===delim){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
/* prvi ispravan broj iz polja (npr. „064 111 2222 / 011 333 444“) */
function pickTel(s){
  s=String(s||"").trim();if(!s||normTel(s))return s;
  for(const p of s.split(/:::|[,;\/|]|\s+(?:i|ili|or)\s+/))if(normTel(p))return p.trim();
  return s;
}
/* jedan red bez kolona: „Ana Petrović 064 123 4567“ ili „064 123 4567 Ana Petrović“ */
function splitNameTel(s){
  let m=s.match(/^(.*?\p{L}.*?)[\s,;:-]+((?:\+|00)?\d[\d\s\-\/().]{5,}\d)\s*$/u);if(m)return [m[1].trim(),m[2].trim()];
  m=s.match(/^((?:\+|00)?\d[\d\s\-\/().]{5,}\d)[\s,;:-]+(.*\p{L}.*)$/u);if(m)return [m[2].trim(),m[1].trim()];
  return [s];
}
const H_FULL=/^(ime i prezime|ime i prezime klijenta|ime prezime|ime_prezime|klijent|klijentkinja|kontakt|naziv|name|full name|display name)$/;
const H_FIRST=/^(ime|first name|given name)$/,H_LAST=/^(prezime|last name|family name|surname)$/;
const H_TEL=/(telefon|^tel\b|^tel\.|mobil|^mob\b|broj|phone|cell|gsm)/,H_MAIL=/(e-?mail|mejl|imejl)/,H_NOTE=/^(napomena|beleska|komentar|note|notes)$/,H_SKIP=/(type|label|tip|vrsta)/;
function rowsToClients(rows){
  if(!rows.length)return [];
  if(rows.every(r=>r.length===1))rows=rows.map(r=>splitNameTel(r[0]));
  const at=(r,i)=>i==null||i<0?"":String(r[i]==null?"":r[i]).trim();
  const firstTel=(r,cols)=>{let raw="";for(const i of cols){const v=pickTel(at(r,i));if(normTel(v))return v;if(!raw&&v)raw=v}return raw};
  const h=rows[0].map(x=>fold(x).replace(/\s+/g," ").trim());
  const col={tels:[],mails:[]};let hdr=false;
  if(!rows[0].some(x=>normTel(pickTel(x)))&&!rows[0].some(x=>/@/.test(x)))h.forEach((x,i)=>{
    if(!x)return;const sk=H_SKIP.test(x);
    if(H_MAIL.test(x)){if(!sk){col.mails.push(i);hdr=true}}
    else if(H_TEL.test(x)){if(!sk){col.tels.push(i);hdr=true}}
    else if(H_FULL.test(x)){if(col.full==null)col.full=i;hdr=true}
    else if(H_FIRST.test(x)){if(col.first==null)col.first=i;hdr=true}
    else if(H_LAST.test(x)){if(col.last==null)col.last=i;hdr=true}
    else if(H_NOTE.test(x)){if(col.note==null)col.note=i;hdr=true}
  });
  if(hdr&&col.tels.length){
    col.tels.sort((a,b)=>/mob|cell/.test(h[b])-/mob|cell/.test(h[a]));
    const used=new Set([...col.tels,...col.mails,col.full,col.first,col.last,col.note].filter(i=>i!=null));
    if(col.full==null&&col.first==null&&col.last==null)col.full=h.findIndex((x,i)=>!used.has(i));
    return rows.slice(1).map(r=>({
      name:at(r,col.full)||[at(r,col.first),at(r,col.last)].filter(Boolean).join(" "),
      tel:firstTel(r,col.tels),email:col.mails.map(i=>at(r,i)).find(Boolean)||"",note:at(r,col.note)}));
  }
  /* bez naslova: kolona sa najviše brojeva je telefon, sa @ je e-mail; ime su tekstualne kolone levo od telefona (npr. Ime | Prezime | Telefon) */
  const n=Math.max(...rows.map(r=>r.length)),score=(i,f)=>rows.reduce((a,r)=>a+(f(at(r,i))?1:0),0);
  let telI=-1,best=0;for(let i=0;i<n;i++){const s=score(i,v=>!!normTel(pickTel(v)));if(s>best){best=s;telI=i}}
  let mailI=-1;best=0;for(let i=0;i<n;i++){if(i===telI)continue;const s=score(i,v=>/@/.test(v));if(s>best){best=s;mailI=i}}
  const text=[];for(let i=0;i<n;i++)if(i!==telI&&i!==mailI&&score(i,v=>/\p{L}/u.test(v)&&!/@/.test(v))>0)text.push(i);
  const left=text.filter(i=>i<telI).reverse();
  let nameCols=left.length?[left[0]]:text.slice(0,1);
  if(left.length>1&&score(left[0],v=>/\s/.test(v))<rows.length*.6)nameCols=[left[1],left[0]];
  return rows.map(r=>({name:nameCols.map(i=>at(r,i)).filter(Boolean).join(" "),tel:telI<0?"":pickTel(at(r,telI)),email:mailI<0?"":at(r,mailI),note:""}));
}
/* kontakti sa telefona (vCard 2.1/3.0/4.0) */
function qpDecode(s){
  const b=[];for(let i=0;i<s.length;i++){if(s[i]==="="&&/^[0-9A-F]{2}$/i.test(s.substr(i+1,2))){b.push(parseInt(s.substr(i+1,2),16));i+=2}else b.push(s.charCodeAt(i)&255)}

function vSplit(s){const a=[];let c="";for(let i=0;i<s.length;i++){if(s[i]==="\\"&&i+1<s.length){c+=s[i]+s[i+1];i++}else if(s[i]===";"){a.push(c);c=""}else c+=s[i]}a.push(c);return a}
const vUn=s=>s.replace(/\\n/gi," ").replace(/\\(.)/g,"$1").replace(/\s+/g," ").trim();
function parseVcf(text){
  const un=[];

    const last=un.length?un[un.length-1]:null;

    if(last!=null&&/=$/.test(last)&&/QUOTED-PRINTABLE/i.test(last.split(":")[0])){un[un.length-1]=last.slice(0,-1)+l;continue}
    un.push(l);

  const out=[];let cur=null;

    const parts=l.slice(0,i).split(";"),prop=parts[0].replace(/^[^.]*\./,"").toUpperCase(),par=parts.slice(1).join(";").toUpperCase();
    let v=l.slice(i+1);

    if(prop==="END"&&/^VCARD/i.test(v.trim())){if(cur)out.push(cur);cur=null;continue}

/* Excel .xlsx: zip (bez biblioteke, DecompressionStream) → prvi list */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eo=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)if(dv.getUint32(i,true)===0x06054b50){eo=i;break}
  if(eo<0)throw new Error("Fajl nije ispravan Excel (.xlsx).");
  const files={},n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);
  for(let k=0;k<n&&dv.getUint32(p,true)===0x02014b50;k++){
    const nl=dv.getUint16(p+28,true);
    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
    p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  const get=async name=>{
    const f=files[name];if(!f)return null;
    const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(s,s+f.size);
    if(f.m===0)return new TextDecoder().decode(data);
    if(f.m!==8||typeof DecompressionStream==="undefined")throw new Error("Ovaj pregledač ne može da otvori .xlsx. Kopirajte kolone iz Excela i nalepite ih u „Nalepi iz Excela“.");
    return new TextDecoder().decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  };
  return {files,get};
}
async function xlsxRows(buf){
  const z=await unzip(buf),X=s=>new DOMParser().parseFromString(s,"application/xml"),T=(el,t)=>[...el.getElementsByTagNameNS("*",t)];
  let sheet=null;
  try{
    const wb=X(await z.get("xl/workbook.xml")),rels=X(await z.get("xl/_rels/workbook.xml.rels"));
    const s0=T(wb,"sheet")[0],idA=s0&&[...s0.attributes].find(a=>a.localName==="id"),rel=idA&&T(rels,"Relationship").find(r=>r.getAttribute("Id")===idA.value);
    if(rel){const t=rel.getAttribute("Target");sheet=t.charAt(0)==="/"?t.slice(1):"xl/"+t.replace(/^\.\//,"")}
  }catch(e){}

  if(!sheet)throw new Error("U Excel fajlu nema tabele.");

  const ss=ssx?T(X(ssx),"si").map(si=>T(si,"t").filter(t=>t.parentNode.localName!=="rPh").map(t=>t.textContent).join("")):[];
  const rows=[];

    const row=[];

      if(m){ci=0;for(const ch of m[0])ci=ci*26+ch.charCodeAt(0)-64;ci--}

      let val=t==="s"?(v?ss[+v.textContent]||"":""):t==="inlineStr"?T(c,"t").map(x=>x.textContent).join(""):(v?v.textContent:"");
      if(!t&&/^-?\d+(\.\d+)?(E[+-]?\d+)?$/i.test(val)){const num=Number(val);if(Number.isInteger(num)&&Math.abs(num)<1e15)val=String(num)}

}
async function readImportFile(file){
  const nm=(file.name||"").toLowerCase();
  if(file.size>15*1024*1024)throw new Error("Fajl je prevelik (najviše 15 MB).");
  const buf=await file.arrayBuffer(),u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4B)return rowsToClients(await xlsxRows(buf));
  if(/\.xls$/.test(nm)||(u8[0]===0xD0&&u8[1]===0xCF))throw new Error("Stari Excel format (.xls) nije podržan. U Excelu izaberite Sačuvaj kao → Excel radna sveska (.xlsx) ili CSV, ili kopirajte kolone i nalepite ih.");
  let text;
  if(u8[0]===0xFF&&u8[1]===0xFE)text=new TextDecoder("utf-16le").decode(u8);
  else try{text=new TextDecoder("utf-8",{fatal:true}).decode(u8)}catch(e){text=new TextDecoder("windows-1250").decode(u8)}
  text=text.replace(/^\ufeff/,"");
  return /BEGIN:VCARD/i.test(text)?parseVcf(text):rowsToClients(csvRows(text));
}

function acAttach(inp){

  const pick=c=>{
    M.name=c.name;M.tel=c.tel;M.email=c.email||"";
    [["#m-name",M.name],["#m-tel",M.tel],["#m-mail",M.email]].forEach(([q,v])=>{const el=$(q);if(el)el.value=v});
    close();
  };
  inp.addEventListener("input",()=>{
    close();
    const q=inp.value.trim();if(!S.clients||q.length<2)return;
    list=S.clients.filter(c=>cliMatch(c,q)).slice(0,6);

  });
}

function calLanes(bks){
  const arr=bks.map(b=>({id:b.id,s:toMin(b.start),e:toMin(b.start)+Math.max(15,+b.totalDuration||0)})).sort((x,y)=>x.s-y.s||y.e-x.e);
  const out={};let cl=[],clEnd=-1,ends=[];
  const flush=()=>{cl.forEach(c=>out[c.id]={lane:c.lane,lanes:ends.length});cl=[];ends=[];clEnd=-1};
  for(const c of arr){
    if(cl.length&&c.s>=clEnd)flush();
    let i=ends.findIndex(e=>e<=c.s);if(i<0){i=ends.length;ends.push(c.e)}else ends[i]=c.e;
    c.lane=i;cl.push(c);clEnd=Math.max(clEnd,c.e);
  }
  if(cl.length)flush();
  return out;
}

function mRefreshTot(){const r=$("#mm-body");if(!r)return;r.querySelectorAll(".mblock").forEach((el,bi)=>{const t=el.querySelector(".m-tot");if(t&&M.blocks[bi])t.textContent=mTotTxt(M.blocks[bi])})}
function mRedraw(){
  const root=$("#mm-body");if(!root||!M)return;
  root.innerHTML=mBody();
  root.querySelectorAll("[data-mk]").forEach(el=>el.oninput=()=>{M[el.dataset.mk]=el.value});
  if(!M.editId){if(!S.clients)loadCli();["#m-name","#m-tel"].forEach(q=>{const el=root.querySelector(q);if(el)acAttach(el)})}
  root.querySelectorAll("[data-mb]").forEach(el=>{const h=()=>{M.blocks[+el.dataset.mb][el.dataset.f]=el.value;mRefreshTot()};el.oninput=h;el.onchange=h});
  root.querySelectorAll("[data-mr]").forEach(el=>{
    const [bi,ri]=el.dataset.mr.split(":").map(Number),f=el.dataset.f;
    const h=()=>{const r=M.blocks[bi].svcs[ri];r[f]=el.value;
      if(f==="serviceId"){const s=S.services.find(x=>x.id===el.value);if(s){r.duration=s.duration||"";r.price=s.price==null?"":s.price}mRedraw();return}
      mRefreshTot();
    };
    if(el.tagName==="SELECT")el.onchange=h;else el.oninput=h;
  });
  root.querySelectorAll("[data-mcat]").forEach(b=>b.onclick=()=>{const [bi,ri,c]=b.dataset.mcat.split(":");const r=M.blocks[+bi].svcs[+ri];if(r.cat===c)return;r.cat=c;if(r.serviceId!=="__custom"){r.serviceId="";r.duration="";r.price=""}mRedraw()});
  root.querySelectorAll("[data-maddsvc]").forEach(b=>b.onclick=()=>{const bl=M.blocks[+b.dataset.maddsvc];if(bl.svcs.length>=MAX_PER_EMP)return;bl.svcs.push(mNewRow(bl.svcs[bl.svcs.length-1].cat));mRedraw()});
  root.querySelectorAll("[data-mdelsvc]").forEach(b=>b.onclick=()=>{const [bi,ri]=b.dataset.mdelsvc.split(":").map(Number);M.blocks[bi].svcs.splice(ri,1);mRedraw()});
  root.querySelectorAll("[data-mdelblock]").forEach(b=>b.onclick=()=>{M.blocks.splice(+b.dataset.mdelblock,1);mRedraw()});
  const ae=root.querySelector("[data-maddemp]");
  if(ae)ae.onclick=()=>{
    const used=M.blocks.map(b=>b.employee);const e=S.employees.find(x=>x.active!==false&&!used.includes(x.id));if(!e)return;
    const last=M.blocks[M.blocks.length-1];const t=mTot(last);
    const next=validHM(last.start)?Math.min(toMin(last.start)+t.d,21*60):10*60;
    M.blocks.push({employee:e.id,date:last.date,start:toHM(next),note:"",svcs:[mNewRow(last.svcs[0]?last.svcs[0].cat:"lice")]});mRedraw();
  };
}
function loadCal(ws){

async function saveManual(){
  const err=m=>{const b=$("#m-err");if(b){b.textContent=m;b.classList.remove("hidden");b.scrollIntoView({block:"nearest"})}};
  const name=M.name.trim(),tel=M.tel.trim(),email=M.email.trim();
  if(!name)return err("Unesite ime i prezime klijenta.");
  if(!telOk(tel))return err("Unesite ispravan broj telefona klijenta (npr. 064 123 4567) - na njega stiže SMS podsetnik.");
  const used=new Set();
  for(let bi=0;bi<M.blocks.length;bi++){
    const bl=M.blocks[bi],pre=M.blocks.length>1?"Zaposlena "+(bi+1)+": ":"";
    if(used.has(bl.employee))return err(pre+"ista zaposlena je izabrana dva puta - spojite usluge u jedan blok (najviše "+MAX_PER_EMP+").");
    used.add(bl.employee);
    if(!bl.date||!validHM(bl.start))return err(pre+"proverite datum i vreme.");
    for(const r of bl.svcs){
      if(!r.serviceId)return err(pre+"izaberite uslugu ili „Paket / ručni opis“.");
      if(r.serviceId==="__custom"&&!r.label.trim())return err(pre+"upišite naziv paketa ili usluge.");
      if(!(+r.duration>0))return err(pre+"upišite trajanje usluge u minutima.");
    }
  }
  const blocks=M.blocks.map(bl=>({employee:bl.employee,date:bl.date,start:bl.start,note:bl.note.trim(),
    services:bl.svcs.map(r=>({serviceId:r.serviceId==="__custom"?null:r.serviceId,label:r.label.trim(),cat:r.cat,duration:+r.duration,price:+r.price||0}))}));
  const btn=$("#m-save");btn.disabled=true;
  try{
    if(M.editId){await apiPost("/api/admin/booking/"+encodeURIComponent(M.editId),Object.assign({name,tel,email},blocks[0]));toast("Izmene su sačuvane.")}
    else{const r=await apiPost("/api/admin/manual",{name,tel,email,blocks});toast(r.bookings.length>1?"Upisano je "+r.bookings.length+" termina u kalendar.":"Termin je upisan u kalendar.")}
    closeModal();M=null;S.calLoadKey=null;S.calBk=null;S.clients=null;loadAdm();render();
  }catch(e){err(e.message);btn.disabled=false}
}

    toast("Termin je obrisan.");closeModal();M=null;S.calLoadKey=null;S.calBk=null;loadAdm();render();
  }catch(e){toast(e.message)}
}

async function orderVoucher(){
  const rec=$("#v-rec").value.trim(),svc=$("#v-svc").value,amt=+$("#v-amt").value,msg=$("#v-msg").value.trim();
  const err=m=>{const b=$("#v-err");if(b){b.textContent=m;b.classList.remove("hidden")}};
  if(!rec)return err("Unesite ime osobe kojoj poklanjate vaučer.");
  if(!(amt>=1000))return err("Najmanji iznos vaučera je 1.000 RSD.");
  const btn=$("#v-order");btn.disabled=true;
  try{
    await apiPost("/api/vouchers",{recipient:rec,serviceId:svc||null,amount:amt,message:msg});
    S.vcrKey=null;S.admVouchers=null;
    showModal(`<h3>Vaučer je poručen</h3><p class="note">Hvala! ${S.mailEnabled?"Potvrda je poslata na vaš e-mail, a salon":"Salon"} vas kontaktira u najkraćem roku radi uplate i preuzimanja vaučera za <b>${esc(rec)}</b> (${RSD(amt)}).</p><div style="margin-top:14px"><button class="btn btn-gold btn-sm" id="m-close">U redu</button></div>`);

}

function wire(root){
  root.querySelectorAll("[data-nav2]").forEach(b=>b.onclick=()=>{S.view=b.dataset.nav2;render()});
  const ga=root.querySelector("#go-auth");if(ga)ga.onclick=()=>{S.view="auth";render()};
  const tl=root.querySelector("#t-login"),tr=root.querySelector("#t-reg");
  if(tl)tl.onclick=()=>{S.authTab="login";render()};
  if(tr)tr.onclick=()=>{S.authTab="reg";render()};
  const fl=root.querySelector("#f-login");if(fl)fl.onsubmit=e=>{e.preventDefault();login(fl)};
  root.querySelectorAll("[data-forgot]").forEach(b=>b.onclick=forgotModal);
  const tl2=root.querySelector("#t-login2");if(tl2)tl2.onclick=()=>{S.authTab="login";render()};
  const fr=root.querySelector("#f-reg");if(fr)fr.onsubmit=e=>{e.preventDefault();register(fr)};
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;S.q="";render();toCatList()});
  const sq=root.querySelector("#svc-q");
  if(sq){ /* pretraga osvežava samo listu, bez render() da kursor i skrol ostanu na mestu */
    const refresh=()=>{const q=(S.q||"").trim();const body=$("#cat-body");if(body){body.innerHTML=catalogBody();wire(body)}
      document.querySelectorAll(".cat-tabs [data-cat]").forEach(b=>b.classList.toggle("on",!q&&b.dataset.cat===S.cat));
      sq.closest(".search").classList.toggle("has-q",!!q)};
    sq.oninput=()=>{S.q=sq.value;refresh()};
    sq.onkeydown=e=>{if(e.key==="Escape"){S.q="";sq.value="";refresh()}else if(e.key==="Enter"){e.preventDefault();sq.blur()}};
    const sf=sq.closest("form");if(sf)sf.onsubmit=e=>{e.preventDefault();sq.blur()};
    const sc=root.querySelector("#svc-q-clr");if(sc)sc.onclick=()=>{S.q="";sq.value="";refresh();sq.focus()};
  }
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.add;const s=S.services.find(x=>x.id===id);if(!s)return;
    const i=S.cart.findIndex(c=>c.id===id);
    if(i>=0){S.cart.splice(i,1)}else{const it=cartItem(s);S.cart.push(it);toast("Dodato: "+svcLine(it))}
    /* u cenovniku se osvežava samo ta kartica i traka korpe, a ne ceo ekran sa svim slikama */
    const card=b.closest(".svc");
    if(S.view==="catalog"&&card){const t=document.createElement("template");t.innerHTML=svcCard(s);const nc=t.content.firstElementChild;card.replaceWith(nc);wire(nc);renderCartbar()}
    else render();
  });
  /* izbor „1 tretman / paket": pamti se po usluzi; ako je usluga već u korpi, stavka i zbir u traci se odmah menjaju */
  root.querySelectorAll("[data-opt]").forEach(r=>r.onchange=()=>{
    const id=r.dataset.opt,s=S.services.find(x=>x.id===id);if(!s)return;
    S.pick[id]=r.value===""?null:+r.value;
    const i=S.cart.findIndex(c=>c.id===id);if(i>=0)S.cart[i]=cartItem(s);
    const card=r.closest(".svc");if(card)card.querySelectorAll(".opt").forEach(l=>l.classList.toggle("on",l.contains(r)));
    renderCartbar();
  });
  root.querySelectorAll("[data-inq]").forEach(b=>b.onclick=()=>{const s=S.services.find(x=>x.id===b.dataset.inq);if(s)inquiryModal(s)});
  root.querySelectorAll("[data-avans]").forEach(b=>b.onclick=()=>{const x=(S.myBookings||[]).find(y=>y.id===b.dataset.avans);if(x)avansModal(x)});
  root.querySelectorAll("[data-policy]").forEach(b=>b.onclick=e=>{e.preventDefault();policyModal()});
  root.querySelectorAll("[data-terms]").forEach(b=>b.onclick=e=>{e.preventDefault();termsModal()});
  root.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{
    const card=b.closest(".svc"),id=b.dataset.more;if(!card)return;
    const o=card.classList.toggle("open");if(o)openDesc.add(id);else openDesc.delete(id);
    b.setAttribute("aria-expanded",String(o));b.textContent=o?"Prikaži manje":"Prikaži više";
  });
  root.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.bEmp=b.dataset.emp;S.bSlot=null;render()});
  root.querySelectorAll("[data-date-off]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.bOff=+b.dataset.dateOff;render()});
  root.querySelectorAll("[data-date-sel]").forEach(s=>s.onchange=()=>{S.bOff=+s.value;render();const x=$("[data-date-sel]");if(x)x.focus({preventScroll:true})});
  root.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>calModal(b.dataset.cal));

  const bk=root.querySelector("[data-backup]");

  const rs=root.querySelector("[data-restore]"),rf=root.querySelector("#restore-file");
  if(rs&&rf){
    rs.onclick=()=>rf.click();
    rf.onchange=async()=>{
      const f=rf.files&&rf.files[0];rf.value="";if(!f)return;
      if(!confirm("Vratiti podatke iz fajla „"+f.name+"\"?\n\nNalozi, rezervacije, radno vreme zaposlenih, vaučeri i klijenti iz kopije se DODAJU (ništa postojeće se ne briše). Cenovnik, zaposlene i radno vreme salona se vraćaju na stanje iz kopije."))return;
      let data;try{data=JSON.parse(await f.text())}catch(e){toast("Fajl nije ispravna rezervna kopija.");return}
      try{const r=await apiPost("/api/admin/restore",data),a=r.added||{};
        toast("Vraćeno: "+(a.users||0)+" naloga, "+(a.bookings||0)+" rezervacija.");
        await refreshPublic();loadAdm();
      }catch(e){toast(e.message)}
    };
  }
  const aks=root.querySelector("#ak-save");
  if(aks)aks.onclick=async()=>{
    const err=m=>{const b=root.querySelector("#ak-err");if(b){b.textContent=m;b.classList.remove("hidden")}};

    try{const r=await apiPost("/api/admin/service-new",{name,desc,price,oldPrice:old>price?old:null,duration:dur,emps});S.services.push(r.service);toast("Akcija je objavljena.");render()}
    catch(e){err(e.message);aks.disabled=false}
  };
  root.querySelectorAll("[data-akdel]").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Potvrdi brisanje";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Obriši"}},4000);return}
    try{await apiPost("/api/admin/service-del/"+encodeURIComponent(b.dataset.akdel));S.services=S.services.filter(s=>s.id!==b.dataset.akdel);toast("Akcija je obrisana.");render()}
    catch(e){toast(e.message)}
  });
  root.querySelectorAll("[data-svcadd]").forEach(b=>b.onclick=()=>svcAddModal(b.dataset.svcadd));
  root.querySelectorAll("[data-svcdel]").forEach(b=>b.onclick=async()=>{

  const stAdd=root.querySelector("#st-add");

    const refresh=()=>{cliRefreshList();cq.closest(".search").classList.toggle("has-q",!!(S.cliQ||"").trim())};
    cq.oninput=()=>{S.cliQ=cq.value;S.cliLimit=CLI_PAGE;refresh()};
    cq.onkeydown=e=>{if(e.key==="Escape"){S.cliQ="";cq.value="";refresh()}else if(e.key==="Enter"){e.preventDefault();cq.blur()}};
    const f=cq.closest("form");if(f)f.onsubmit=e=>{e.preventDefault();cq.blur()};
    const c=root.querySelector("#cli-q-clr");if(c)c.onclick=()=>{S.cliQ="";cq.value="";refresh();cq.focus()};
  }
  root.querySelectorAll("[data-clibl]").forEach(b=>b.onclick=()=>{S.cliBl=!S.cliBl;S.cliLimit=CLI_PAGE;cliRefreshList()});
  root.querySelectorAll("[data-climore]").forEach(b=>b.onclick=()=>{S.cliLimit=(S.cliLimit||CLI_PAGE)+CLI_PAGE*3;cliRefreshList()});
  root.querySelectorAll("[data-clinew]").forEach(b=>b.onclick=()=>cliModal());
  root.querySelectorAll("[data-cliedit]").forEach(b=>b.onclick=()=>{const c=(S.clients||[]).find(x=>x.id===b.dataset.cliedit);if(c)cliModal(c)});
  root.querySelectorAll("[data-clibook]").forEach(b=>b.onclick=()=>{const c=(S.clients||[]).find(x=>x.id===b.dataset.clibook);if(c)manualModal(null,{name:c.name,tel:c.tel,email:c.email})});
  const cim=root.querySelector("[data-cliimp]");if(cim)cim.onclick=importModal;
  const cex=root.querySelector("[data-cliexp]");if(cex)cex.onclick=exportClients;
  const vs=root.querySelector("#v-svc");
  if(vs)vs.onchange=()=>{const s=S.services.find(x=>x.id===vs.value);if(s){const a=root.querySelector("#v-amt");if(a)a.value=s.price}};
  const vo=root.querySelector("#v-order");if(vo)vo.onclick=orderVoucher;
  root.querySelectorAll("[data-vcr]").forEach(b=>b.onclick=async()=>{
    const v=(S.admVouchers||[]).find(x=>x.id===b.dataset.vcr);if(!v)return;b.disabled=true;
    const next=v.status==="obrađen"?"novo":"obrađen";
    try{await apiPost("/api/admin/vouchers/"+encodeURIComponent(v.id),{status:next});v.status=next;render()}catch(e){toast(e.message);b.disabled=false}
  });
  wireEyes(root);
  const ar=root.querySelector("#adm-refresh");if(ar)ar.onclick=()=>{S.clients=null;refreshPublic().then(()=>loadAdm())};
  root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const t=root.querySelector(`template[data-txt="${CSS.escape(b.dataset.copy)}"]`);if(t)copyText(t.innerHTML.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"))});
  root.querySelectorAll("[data-copymail]").forEach(b=>b.onclick=()=>copyText(b.dataset.copymail));
  root.querySelectorAll("[data-sent]").forEach(b=>b.onclick=async()=>{try{await apiPost("/api/admin/remind/"+encodeURIComponent(b.dataset.sent),{send:false});toast("Označeno kao poslato.");loadAdm()}catch(e){toast(e.message)}});
  root.querySelectorAll("[data-sendnow]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await apiPost("/api/admin/remind/"+encodeURIComponent(b.dataset.sendnow),{send:true});toast(r.sent?"Podsetnik je poslat ✓":"Slanje nije uspelo - proverite SMTP.");loadAdm()}catch(e){toast(e.message);b.disabled=false}});
  const hs=root.querySelector("#hrs-save");
  if(hs)hs.onclick=async()=>{
    const H={};let bad="";["0","1","2","3","4","5","6"].forEach(k=>{
      const x=root.querySelector("#h-x-"+k),o=root.querySelector("#h-o-"+k),c=root.querySelector("#h-c-"+k);
      H[k]=x&&x.checked?{closed:true}:{open:(o&&o.value)||"09:00",close:(c&&c.value)||"21:00",closed:false};
      const ap=root.querySelector("#h-a-"+k);
      if(!H[k].closed&&ap&&ap.checked)H[k].appt=true;
      if(!H[k].closed&&!(H[k].open<H[k].close))bad=bad||DOWS[+k];
    });
    if(bad)return toast("Proverite vreme za: "+bad+" (početak pre kraja).");
    try{const r=await apiPost("/api/admin/hours",H);S.hours=r.hours;S.eh=null;toast("Radno vreme je sačuvano.");render()}catch(e){toast(e.message)}
  };
  root.querySelectorAll("[data-svcpk]").forEach(b=>b.onclick=()=>pkgModal(b.dataset.svcpk));
  root.querySelectorAll("[data-svcsave]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.svcsave;
    const pe=root.querySelector("#sp-"+CSS.escape(id)),de=root.querySelector("#sd-"+CSS.escape(id));
    const a=root.querySelector("#sa-"+CSS.escape(id)).checked,ap=root.querySelector("#sap-"+CSS.escape(id));
    const body={active:a};
    if(ap)body.aparat=ap.checked;
    if(pe&&de){
      const p=+pe.value,d=+de.value;
      if(!(p>=0)||!(d>0))return toast("Proverite cenu i trajanje.");
      body.price=p;body.duration=d;
    }
    try{
      const r=await apiPost("/api/admin/service/"+encodeURIComponent(id),body);
      const i=S.services.findIndex(x=>x.id===id);if(i>=0)S.services[i]=r.service;
      toast("Usluga je ažurirana.");
      if(ap)render();
    }catch(e){toast(e.message)}
  });
  root.querySelectorAll('[id^="h-x-"]').forEach(x=>x.onchange=()=>{
    const k=x.id.slice(4);const o=root.querySelector("#h-o-"+k),c=root.querySelector("#h-c-"+k);
    if(o)o.disabled=x.checked;if(c)c.disabled=x.checked;
  });
}

</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});</script>
</body>
</html>
