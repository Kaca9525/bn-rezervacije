nije u sistemu PDV-a.</p></li>\n</ul>\n<ol start=\"2\" type=\"I\">\n<li><p><strong>Definicije pojmova</strong></p></li>\n</ol>\n<p>U ovim Uslovima korišćenja navedeni pojmovi imaju sledeće\nznačenje:</p>\n<ul>\n<li><p><strong>„Uslovi korišćenja“</strong> – Posebni uslovi pružanja\nUsluga i Opšti uslovi korišćenja Sajta i Aplikacije dostupni u ovom\ndokumentu</p></li>\n<li><p><strong>„Pružalac“, „Centar“, „mi“</strong> – subjekt naveden u\ntački 1.</p></li>\n<li><p><strong>„Sajt“</strong> – internet prezentacija dostupna na\nadresi bg-beauty-and-nutrition.com, sa svim podstranicama (uključujući\nstranice o uslugama, edukacijama, galeriji, kontaktu i blogu\n„Nutrition“).</p></li>\n<li><p><strong>„Aplikacija“</strong> – web aplikacija i alati dostupni\npreko Sajta, uključujući formu za kontakt i modul za online zakazivanje\ntermina.</p></li>\n<li><p><strong>„Korisnik“, „Vi“</strong> – svako lice koje posećuje\nSajt, koristi Aplikaciju, zakazuje termin ili kupuje uslugu, uključujući\ni polaznike edukativnog programa ili kursa u organizaciji\nCentra.</p></li>\n<li><p><strong>„Potrošač“</strong> – fizičko lice koje na tržištu\npribavlja robu ili usluge u svrhe koje nisu namenjene njegovoj poslovnoj\nili drugoj komercijalnoj delatnosti.</p></li>\n<li><p><strong>„Tretman“</strong> – pojedinačna kozmetička usluga ili\npaket tretmana koji se izvodi u prostorijama Centra.</p></li>\n<li><p><strong>„Edukacija“ ili „Obuka“</strong> – edukativni program ili\nkurs koji organizuje Centar.</p></li>\n<li><p><strong>„Usluge“</strong> – kozmetički Tretmani lica i tela,\npaketi Tretmana, Obuke i Edukacije za tretmane lica i tela, kao i\ninformativni sadržaji (blog).</p></li>\n<li><p><strong>„Termin“</strong> – dogovoreni datum i vreme pružanja\nusluge.</p></li>\n<li><p><strong>„Sadržaj Sajta i Aplikacije“</strong> – tekstovi,\nfotografije, video zapisi, logotipi, grafika, dizajn i drugi materijali\nna Sajtu i Aplikaciji.</p></li>\n<li><p><strong>„Korisnički sadržaj“</strong> – svaki sadržaj koji\nKorisnik dostavi Centru preko Sajta, Aplikacije ili društvenih mreža\n(poruke, fotografije, komentari).</p></li>\n</ul>\n<ol start=\"3\" type=\"I\">\n<li><p><strong>Predmet i prihvatanje uslova, stupanje na\nsnagu</strong></p></li>\n</ol>\n<p>Ovim Uslovima korišćenja uređuju se uslovi pod kojima Centar pruža\nUsluge Korisnicima kao i uslovi koriščenja korišćenja Sajta i\nAplikacije.</p>\n<p>Korišćenjem Sajta i/ili Aplikacije, slanjem upita, zakazivanjem\nTermina ili kupovinom Usluge, Korisnik potvrđuje da je pročitao ove\nUslove korišćenja, da ih razume i da ih prihvata. Ako se ne slažete sa\nUslovima korišćenja, molimo vas da ne koristite Sajt i Aplikaciju i ne\nzakazujete Usluge.</p>\n<p>Uslovi korišćenja stupaju na snagu danom objavljivanja na Sajtu i\nAplikaciji i primenjuju se do objavljivanja izmenjene verzije. Na\npojedinačne ugovore o uslugama primenjuje se verzija Uslova korišćenja\nkoja je važila u trenutku zaključenja ugovora.</p>\n<p>Ugovor o pružanju usluge smatra se zaključenim kada Centar potvrdi\ntermin (putem sistema Aplikacije za online zakazivanje, telefonom ili\nporukom) ili kada Korisnik izvrši uplatu za Obuku/Edukaciju, Tretman ili\npaket, u zavisnosti od toga šta nastupi prvo i traju dok odnosna Usluga\nne bude u potpunosti izvršena.</p>\n<p>****</p>\n<p><strong><u>1. Opšti Uslovi korišćenja Sajta i\nAplikacije</u></strong></p>\n<p>1.1. <strong>Uzrast.</strong> Aplikaciju i Sajt mogu koristiti i\nUsluge zakazivati lica starija od 18 godina. Maloletna lica mogu\nkoristiti Usluge isključivo uz prisustvo i pisanu ili usmenu saglasnost\nroditelja ili staratelja, koji preuzima odgovornost za korišćenje\nUsluge. Pojedini Tretmani (na primer EMS tretmani, tretmani\nmezoporacijom i voćnim kiselinama) ne izvode se maloletnim licima.\nKlikom na link da prihvatatate uslove korišćenja, potvrđujete da ste\nstariji od 18 godina i da imate pravo da koristite Sajt odnosno\nAplikaciju.</p>\n<p>1.2. <strong>Registracija i zakazivanje.</strong> Pregled Sajta ne\nzahteva registraciju. Za online zakazivanje koristi se Aplikacija, za\nčije korišćenje je potrebno otvaranje korisničkog naloga i unos traženih\npodataka. Za zakazivanje putem web sajta „Sredi me“ koristi se sistem\ntrećeg lica (Sredi me – sredime.rs), za koji može biti potrebno\notvaranje naloga ili unos kontakt podataka. Na korišćenje tog servisa\nprimenjuju se i njegovi uslovi korišćenja i politika privatnosti.</p>\n<p>1.3. <strong>Tačnost podataka.</strong> Korisnik garantuje da su\npodaci koje unosi (ime, kontakt telefon, e-adresa) tačni, potpuni i\nažurni. Centar nije odgovoran za propuštene termine ili izostanak\nobaveštenja usled netačno unetih podataka.</p>\n<p>1.4. <strong>Bezbednost naloga.</strong> Ukoliko Korisnik koristi\nnalog u Aplikaciji za zakazivanje Termina, odgovoran je za čuvanje\nsvojih pristupnih podataka i za sve radnje preduzete preko naloga.\nKorisnik je dužan da bez odlaganja obavesti Centar o svakom neovlašćenom\nkorišćenju naloga. U slučaju zakazivanja putem web sajta „Sredi me“,\nKorisnik je dužan da bez odlaganja obavesti odnosnog pružaoca usluge o\nsvakom neovlašćenom korišćenju naloga u skladu sa njihovim uslovima\nkorišćenja.</p>\n<p>1.5. <strong>Informativni sadržaji.</strong> Sadržaj bloga\n<em>„Nutrition“</em> o nezi, zdravlju i ishrani i drugi savetodavni\ntekstovi na Sajtu odnosno Aplikaciji su isključivo informativnog\nkaraktera i ne predstavljaju medicinski savet, dijagnozu niti lečenje.\nPre promene ishrane ili započinjanja programa mršavljenja, naročito kod\npostojećih zdravstvenih stanja, posavetujte se sa lekarom.</p>\n<p>1.6. <strong>Tehnički uslovi.</strong> Za korišćenje Aplikacije i\nSajta potrebni su uređaj sa pristupom internetu i savremen internet\npregledač. Troškove internet veze snosi Korisnik.</p>\n<p><strong>2. Korisnički sadržaj i licenca</strong></p>\n<p>2.1. Korisnik zadržava sva prava na sadržaj koji dostavi Centru\n(poruke, fotografije, recenzije, komentari).</p>\n<p>2.2. Davanjem saglasnosti i slanjem Korisničkog sadržaja koji je\nnamenjen objavljivanju (npr. recenzija, fotografije pre i posle)\nKorisnik daje Centru izričitu saglasnost i neekskluzivnu, neprenosivu,\nvremenski neograničenu i teritorijalno neograničenu licencu da taj\nsadržaj, bez naknade, prikazuje, čuva i koristi na Sajtu i/ili\nAplikaciji i zvaničnim društvenim mrežama Centra, uz opoziv u bilo kom\ntrenutku pisanim zahtevom, osim za sadržaj koji je već objavljen u\nštampanim ili arhiviranim materijalima.</p>\n<p>2.3. Korisnik garantuje da je nosilac prava na dostavljeni sadržaj\nili da ima potrebnu dozvolu i da sadržaj ne krši prava trećih lica niti\nzakon.</p>\n<p><strong>3. Zabranjena ponašanja</strong></p>\n<p>Korisniku je zabranjeno da:</p>\n<ul>\n<li><p>koristi Sajt ili Aplikaciju na način koji je protivan zakonu,\novim Uslovima ili dobrim poslovnim običajima;</p></li>\n<li><p>unosi lažne, netačne ili tuđe podatke, ili se lažno\npredstavlja;</p></li>\n<li><p>pokušava neovlašćen pristup Aplikaciji, Sajtu, serverima, bazama\npodataka ili nalozima drugih lica;</p></li>\n<li><p>unosi ili širi viruse, zlonamerni kod ili sadržaj koji može\noštetiti ili ometati rad Aplikacije i Sajta;</p></li>\n<li><p>koristi automatizovane alate (botove, skripte, scraping) bez\npisane saglasnosti Centra;</p></li>\n<li><p>masovno ili zlonamerno zakazuje termine koje ne namerava da\niskoristi;</p></li>\n<li><p>objavljuje ili šalje uvredljiv, pretnjujući, diskriminatorni,\nnezakonit ili obmanjujući sadržaj, kao i sadržaj kojim se povređuju\nprava trećih lica;</p></li>\n<li><p>kopira, umnožava, distribuira ili komercijalno koristi Sadržaj\nSajta, uključujući materijale iz Obuka, bez prethodne pisane\nsaglasnosti;</p></li>\n<li><p>snima, fotografiše ili emituje tretmane, osoblje, druge Korisnike\nili materijale sa Obuka u prostorijama Centra bez saglasnosti;</p></li>\n</ul>\n<p>U slučaju kršenja zabrana Centar može ograničiti ili ukinuti pristup\nAplikaciji i Sajtu, odbiti pružanje usluge i preduzeti zakonom\ndozvoljene mere.</p>\n<p><strong>4. Intelektualna svojina</strong></p>\n<p>4.1. Sadržaj Aplikacije i Sajta, uključujući logotip, naziv, vizuelni\nidentitet, tekstove, fotografije, video zapise, galeriju, dizajn,\nstrukturu i programski kod, zaštićen je autorskim i srodnim pravima i\npripada Centru, odnosno licima od kojih je Centar dobio pravo\nkorišćenja. Dizajn Sajta može biti zaštićen i pravima njegovog\nautora.</p>\n<p>4.2. Korisniku se daje ograničeno, neekskluzivno, neprenosivo pravo\nda Aplikaciju i/ili Sajt koristi isključivo za lične, nekomercijalne\npotrebe u skladu sa ovim Uslovima.</p>\n<p>4.3. Materijali koji se dele na Obukama i Edukacijama (skripte,\nprezentacije, protokoli, tehnike rada) predstavljaju intelektualnu\nsvojinu Centra odnosno lica od kojih je Centar dobio pravo korišćenja i\nnamenjeni su isključivo ličnoj upotrebi polaznika i Korisnika. Njihovo\numnožavanje, objavljivanje ili preprodaja nisu dozvoljeni bez pisane\nsaglasnosti ovlašćenog lica Centra.</p>\n<p>4.4. Nazivi uređaja, brendova i proizvoda koji se pominju na Sajtu\npripadaju njihovim vlasnicima.</p>\n<p><strong>5. Ograničenje odgovornosti i odricanje od\ngarancija</strong></p>\n<p>5.1. Sajt, Aplikacija i informativni sadržaji pružaju se u stanju\n<em>kakvi jesu</em>. Ulažemo razumnu pažnju da informacije na Aplikaciji\ni Sajtu budu tačne i ažurne, ali ne garantujemo da su u svakom trenutku\npotpune, bez grešaka ili odgovaraju svakoj pojedinačnoj situaciji. Cene,\nopisi i dostupnost Usluga mogu se menjati.</p>\n<p>5.2. Centar nije odgovoran za štetu nastalu usled:</p>\n<ul>\n<li><p>pojave tehničkih smetnji, prekida internet veze ili rada servisa\ntrećih lica (uključujući sistem za zakazivanje i servise društvenih\nmreža), na koje Centar ne može uticati;</p></li>\n<li><p>više sile;</p></li>\n<li><p>korišćenja linkova ka spoljnim sajtovima trećih lica, za čiji\nsadržaj Centar ne odgovara.</p></li>\n</ul>\n<p>5.3. U meri u kojoj to zakon dozvoljava, Centar ne odgovara za\nindirektne i posledične štete, kao ni za izgubljenu dobit, izgubljene\nprilike ili druge slične štete nastale u vezi sa korišćenjem Sajta,\nAplikacije ili Usluga, čak i ako je Centar unapred obavešten o\nmogućnosti nastanka takve štete.</p>\n<p><strong>6. Raspoloživost usluge, održavanje, prekid i suspenzija\nnaloga</strong></p>\n<p>6.1. Trudimo se da Aplikacija i Sajt budu dostupni neprekidno, ali ne\ngarantujemo da će pristup biti bez prekida ili grešaka. Centar može\nprivremeno obustaviti rad Aplikacije, Sajta ili pojedinih funkcija radi\nodržavanja, unapređenja ili iz bezbednosnih razloga, a o planiranim\ndužim prekidima nastojaće da blagovremeno obavesti Korisnike.</p>\n<p>6.2. Centar može iz opravdanih razloga (bolest osoblja, kvar uređaja,\nviša sila) promeniti ili otkazati zakazani termin. U tom slučaju\nKorisniku se nudi novi termin ili povraćaj uplaćenog iznosa za\nneiskorišćenu uslugu ili rezervaciju.</p>\n<p>6.3. Centar može privremeno ili trajno ograničiti ili ukinuti pristup\nAplikaciji i Sajtu, odnosno nalogu Korisnika (u meri u kojoj Centar\nupravlja nalozima), kao i odbiti zakazivanje, u slučaju kršenja ovih\nUslova, zloupotrebe, ponovljenih neopravdanih nedolazaka ili ugrožavanja\nbezbednosti osoblja i drugih Korisnika. Korisnik će, kad je to moguće,\nbiti obavešten o razlozima i imaće mogućnost da se izjasni.</p>\n<p>6.4. Korisnik može u svakom trenutku prestati da koristi Aplikaciju i\nSajt, a brisanje naloga ili podataka može zatražiti slanjem zahteva na\ne-adresu iz tačke VII, uz poštovanje zakonskih rokova čuvanja\ndokumentacije.</p>\n<p><strong>7. Zaštita podataka o ličnosti</strong></p>\n<p>7.1. Centar obrađuje podatke o ličnosti u skladu sa Zakonom o zaštiti\npodataka o ličnosti i drugim primenjivim propisima. Detaljne informacije\no vrstama podataka koji se prikupljaju, svrhama i pravnom osnovu obrade,\nrokovima čuvanja, primaocima podataka i pravima lica na koje se podaci\nodnose (pristup, ispravka, brisanje, ograničenje obrade, prenosivost,\nprigovor i opoziv saglasnosti) nalaze se u <strong>Politici\nprivatnosti</strong> dostupnoj na Aplikaciji, odnosno Sajtu.</p>\n<p>7.2. Informacije o kolačićima i sličnim tehnologijama koje koristi\nSajt nalaze se u <strong>Politici kolačića</strong>.</p>\n<p>7.3. Podaci o zdravstvenom stanju koje Korisnik dostavi pre Tretmana\nsmatraju se naročito osetljivim podacima i obrađuju se samo u meri\nneophodnoj za bezbedno pružanje Usluge i uz odgovarajući pravni osnov, u\nskladu sa Politikom privatnosti.</p>\n<p>7.4. Ukoliko smatrate da su Vam povređena prava u vezi sa obradom\npodataka o ličnosti, možete se obratiti Centru, a imate pravo da\npodnesete pritužbu Povereniku za informacije od javnog značaja i zaštitu\npodataka o ličnosti.</p>\n<ol start=\"4\" type=\"I\">\n<li><p><strong>Podaci o pružaocu usluge</strong></p></li>\n</ol>\n<p>U skladu sa Zakonom o elektronskoj trgovini i Zakonom o zaštiti\npotrošača, objavljujemo sledeće podatke:</p>\n<ul>\n<li><p><strong>Poslovno ime / naziv:</strong> ANDRIJANA OBRADOVIĆ PR\nEDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa izdvojenim\nprostorom, poslovno ime pod kojim se nastupa: Beauty &amp; Nutrition –\nEstetsko edukativni centar</p></li>\n<li><p><strong>Pravni oblik:</strong> preduzetnik</p></li>\n<li><p><strong>Sedište i adresa poslovnog prostora:</strong> Živojina\nŽujovića 25, Zvezdara, 11000 Beograd, Srbija, adresa sedišta: Branka\nMiljkovića 27, 34000 Kragujevac</p></li>\n<li><p><strong>PIB:</strong> 113013378</p></li>\n<li><p><strong>Matični broj:</strong> 66506665</p></li>\n<li><p><strong>Registar:</strong> upisan u registar Agencije za\nprivredne registre (APR), broj rešenja o upisu БП 48846/2022 od\n05.05.2022. godine</p></li>\n<li><p><strong>Šifra i opis pretežne delatnosti:</strong> 85.59 – Ostalo\nobrazovanje</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> andrijanaobradovic5@gmail.com</p></li>\n<li><p><strong>Društvene mreže:</strong> Facebook i Instagram\n(@beauty_and_nutrition_)</p></li>\n<li><p><strong>PDV status:</strong> nije u sistemu PDV-a.</p></li>\n</ul>\n<p><strong><u>Posebni uslovi pružanja Usluga</u></strong></p>\n<p><strong>1. Opis usluge i prava i obaveze Korisnika</strong></p>\n<p>1.1. <strong>Opis Usluga.</strong> Centar pruža:</p>\n<ul>\n<li><p>kozmetičke tretmane lica navedene u cenovniku (npr. higijenski\ntretman, mezoporacija, oksigen terapija, kolagenski anti-age tretman,\ntretmani sa fototerapijom);</p></li>\n<li><p>tretmane tela (npr. rolosfera, EMS body sculpt, maderoterapija,\nbrazilsko podizanje zadnjice, vacuum sonda, anticelulit\nprogrami);</p></li>\n<li><p>obuke i edukacije za tretmane lica i tela;</p></li>\n</ul>\n<p>1.2. <strong>Cene i sadržaj usluga.</strong> Opis, sadržaj i cena\npojedinačnih usluga i paketa objavljeni su na Aplikaciji i Sajtu i\nizraženi su u dinarima (RSD). Rezultati Tretmana zavise od individualnih\nkarakteristika i mogu se razlikovati od osobe do osobe; opisi rezultata\nu na Aplikaciji i/ili Sajtu nisu garancija konkretnog ishoda.</p>\n<p>1.3. <strong>Zdravstveno stanje Korisnika.</strong> Pre svakog\nTretmana Korisnik je dužan da istinito i potpuno obavesti stručno lice\nCentra o zdravstvenom stanju, alergijama, lekovima koje uzima, trudnoći\ni dojenju, implantatima (uključujući pejsmejker i metalne implantate),\nkožnim oboljenjima i drugim okolnostima relevantnim za bezbednost\nTretmana. Pojedini Tretmani su kontraindikovani u određenim stanjima, a\nCentar zadržava pravo da odbije ili prekine Tretman ukoliko proceni da\nbi mogao ugroziti zdravlje Korisnika. Korisnik može biti zamoljen da\npopuni i potpiše informisani pristanak ili upitnik pre Tretmana na licu\nmesta.</p>\n<p>1.4. <strong>Zakazivanje i dolazak.</strong> Termin se zakazuje preko\nsistema za online zakazivanje dostupnog u Aplikaciji, telefonom, putem\nsistema web sajta „sredi me“ ili putem društvenih mreža. Molimo da na\ntretman dođete na vreme. Kašnjenje može skratiti trajanje Tretmana i/ili\nEdukacije bez umanjenja cene, ako se tretman ne može izvesti u celosti u\npreostalom vremenu.</p>\n<p>1.5. <strong>Zakazivanje putem Aplikacije.</strong></p>\n<p>Zakazivanje putem Aplikacije vrši se u skladu sa Opštim uslovima\nkorišćenja Sajta i Aplikacije. Prilikom rezervacije termina, Korisnik\nbira osobu iz salona koja će obaviti tretman u skladu sa ponuđenim\nmogućnostima. Radi dobijanja potvrde rezervisanog termina, putem\nAplikacije, Korisnik je dužan da unapred uplati avans od 30% ukupne cene\nizabrane Usluge, na ime rezervacije termina Tretmana ili\nEdukacije. Preostali iznos plaća se prilikom\npružanja Usluge.</p>\n<p>1.6. <strong>Otkazivanje i pomeranje Termina.</strong> Termin je\nmoguće otkazati ili pomeriti najkasnije 24 (dvadeset četiri) sata pre\nzakazanog vremena, telefonom ili preko sistema za zakazivanje. Razumemo\nda se nepredviđene situacije dešavaju, ali otkazivanje u kraćem roku ne\nostavlja dovoljno vremena da se upražnjeni termin ponudi drugom\nKorisniku. Zbog toga, u slučaju otkazivanja nakon navedenog roka ili\nnedolaska bez prethodnog obaveštenja, Centar zadržava pravo da\nkumulativno: zadrži naplaćeni iznos 30% cene Usluge na ime rezervacije\ntermina Tretmana ili Edukacije; odbije zakazivanje novih termina bez\nprethodne uplate; smatra Termin iskorišćenim u okviru paketa. Nadoknada\nse ne naplaćuje u slučaju bolesti ili više sile, uz razumno obrazloženje\ni potvrdu Centra.</p>\n<p>1.7. <strong>Paketi tretmana.</strong> Paketi (npr. Paket od 5 ili\npaket od 10 tretmana) koriste se prema dinamici koju preporuči stručno\nlice Centra. Rok važenja paketa je 1 mesec od dana uplate, osim ukoliko\nje drukčije dogovoreno. Neiskorišćeni tretmani nakon isteka roka\nprestaju da važe. Izuzetno, neiskorišćeni tretmani nakon isteka roka,\nmogu se produžiti uz dogovor i potvrdu Centra.</p>\n<p>1.8. <strong>Obuke i Edukacije.</strong> Prijava na Obuku i Edukaciju\nvrši se putem kontakt forme Aplikacije, telefona, telefona ili\ndruštvenih mreža. program, trajanje, termin, cena i uslovi izdavanja\npotvrde ili sertifikata dogovaraju se pojedinačno i potvrđuju pre\nuplate. Centar zadržava pravo da promeni termin održavanja iz opravdanih\nrazloga, uz blagovremeno obaveštenje, kao i da otkaže Obuku i/ili\nEdukaciju ili izvrši zakazivanje u novom terminu. Završetak Obuke i/ili\nEdukacije ne predstavlja javnu ispravu niti zamenu za obrazovanje\nstečeno u okviru formalnog obrazovnog sistema.</p>\n<p>1.9. <strong>Vaučeri i njihovo korišćenje.</strong> Vaučeri se mogu\nkoristiti za plaćanje Usluga i Edukacija koje Centar nudi, u skladu sa\nnjihovom nominalnom vrednošću i/ili izabranim Uslugama, shodno ponuđenim\ni dogovorenim uslovima. Prilikom korišćenja vaučera, Korisnik je dužan\nda prezentuje validan Vaučer. Rok važenja vaučera je 12 meseci od dana\nkupovine. Ukoliko je cena odabrane usluge veća od vrednosti vaučera,\nKorisnik je dužan da doplati razliku, dok se eventualni neiskorišćeni\niznos može koristiti za naredne Usluge u roku od 12 meseci od dana\nkupovine vaučera. Vaučeri se ne mogu zameniti za novac, osim kada je to\npredviđeno zakonskim uslovima ili izuzetno, uz odobrenje i pristanak\nCentra.</p>\n<p>1.10. <strong>Obaveze Korisnika.</strong> Korisnik je dužan da\npoštuje ove Uslove, pravila ponašanja Centra, uputstva stručnog osoblja\ni higijenske mere, da ne pristupa tretmanima pod dejstvom psihoaktivnih\nsupstanci i bez ometajućeg ponašanja i da blagovremeno izmiruje obaveze\nplaćanja.</p>\n<p>1.11. <strong>Fotografije i snimci pre/posle tretmana.</strong>\nFotografije i video zapisi Korisnika (uključujući snimke pre i posle\ntretmana) objavljuju se isključivo uz prethodnu izričitu pisanu\nsaglasnost Korisnika, koju je moguće opozvati u bilo kom trenutku bez\nposledica po pružanje Usluga.</p>\n<p>1.12. Centar zadržava pravo da ukloni sadržaj koji je u suprotnosti\nsa ovim Uslovima ili relevantnim zakonskim propisima.</p>\n<p><strong>2. Cene, naplata, pretplata i otkazivanje</strong></p>\n<p>2.1. Cene su izražene u dinarima (RSD) bez obračunatog PDV-a budući\nda pružalac nije u sistemu PDV-a i važe u trenutku zaključenja ugovora.\nCentar zadržava pravo izmene cena; izmena ne utiče na već zaključene\nugovore i plaćene Usluge.</p>\n<p>2.2. Plaćanje se vrši gotovinom, platnim karticama, uplatom na račun,\nili putem generisanog QR koda preko sistema za zakazivanje. Za potvrdu\nrezervisanog termina putem Aplikacije, Korisnik je dužan da unapred\nuplati avans od 30% ukupne cene ugovorene Usluge, kako u slučaju\nzakazivanja Tretmana, tako i u slučaju zakazivanja Edukacije.\nObuke i paketi mogu zahtevati avansnu uplatu ili uplatu u ratama, o čemu\nse Korisnik obaveštava pre uplate.</p>\n<p>2.3. Za sve uplate Centar izdaje fiskalni račun ili drugi dokument u\nskladu sa propisima o fiskalizaciji.</p>\n<p>2.4. Centar trenutno ne nudi pretplatu sa automatskim obnavljanjem.\nUkoliko se takva usluga uvede, Korisnik će o tome biti jasno obavešten\npre zaključenja ugovora, uz navođenje cene, trajanja i načina\notkazivanja.</p>\n<p>2.5. <strong>Povraćaj sredstava.</strong> U slučajevima u kojima\nKorisnik ima pravo na povraćaj novca (otkazivanje Obuke od strane\nKorisnika ili Centra, nemogućnost pružanja usluge ili opravdan\nodustanak), povraćaj se vrši istim sredstvom plaćanja kojim je izvršena\nuplata, bez nepotrebnog odlaganja, a najkasnije u roku od 14 dana od\ndana prijema izjave o odustanku ili od dana kada je utvrđeno pravo na\npovraćaj.</p>\n<p><strong>3. Prava potrošača</strong></p>\n<p>3.1. <strong>Pravo na odustanak (14 dana).</strong> Potrošač koji\nzaključi ugovor na daljinu (npr. Putem Aplikacije ili telefonom) ima, u\nskladu sa Zakonom o zaštiti potrošača, pravo da odustane od ugovora u\nroku od 14 dana od dana zaključenja ugovora, bez navođenja razloga.\nIzjavu o odustanku možete poslati na e-mail adresu: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>\nili poštom na adresu Centra, korišćenjem <strong>obrasca za\nodustanak</strong> ciubaili bilo koje nedvosmislene izjave.</p>\n<p>3.2. <strong>Izuzeci od prava na odustanak.</strong> Potrošač nema\npravo na odustanak, između ostalog:</p>\n<ul>\n<li><p>kada je Usluga u potpunosti izvršena, ako je njeno izvršenje\npočelo uz prethodnu izričitu saglasnost potrošača i uz njegovu potvrdu\nda zna da će izgubiti pravo na odustanak nakon potpunog\nizvršenja;</p></li>\n<li><p>kada se radi o digitalnom sadržaju koji se ne isporučuje na\ntrajnom nosaču podataka (npr. snimljena predavanja ili onlajn\nmaterijali), ako je isporuka počela uz prethodnu izričitu saglasnost\npotrošača i njegovu potvrdu da time gubi pravo na odustanak;</p></li>\n<li><p>u drugim slučajevima predviđenim zakonom.</p></li>\n</ul>\n<p>3.3. Ukoliko potrošač odustane od ugovora o usluzi čije je izvršenje\npočelo na njegov izričit zahtev u toku roka za odustanak, dužan je da\nplati srazmerni deo cene za do tada pružene Usluge.</p>\n<p>3.4. <strong>Ugovori zaključeni u poslovnim prostorijama.</strong> Za\nUsluge ugovorene i pružene neposredno u prostorijama Centra pravo na\nodustanak iz tačke 3.1. ne primenjuje se, ali Potrošač zadržava sva\nprava iz osnova saobraznosti i reklamacije.</p>\n<p>3.5. <strong>Reklamacije.</strong> Potrošač ima pravo da uloži\nreklamaciju ukoliko smatra da Usluga nije pružena u skladu sa ugovorom,\nkao i zbog pogrešno obračunate cene i drugih nedostataka. Reklamaciju\nmožete uložiti usmeno u prostorijama Centra Živojina Žujovića 25,\nZvezdara, 11000, ili pisanim putem e-mail adrese: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>,\nuz navođenje podataka o klijentu, usluzi, datumu pružanja i opisa\nnedostatka, uz dostavljanje računa na uvid ili drugog dokaza o pruženoj\nusluzi. Obrazac reklamacije možete preuzeti <strong>ovde</strong>.\nCentar će potvrditi prijem reklamacije i o njoj odlučiti najkasnije u\nroku od 8 dana od dana prijema, a najkasnije u roku od 15 dana pisanim\nili elektronskim putem odgovoriti Potrošaču, u skladu sa zakonom. Centar\nvodi evidenciju primljenih reklamacija. U slučaju može zahtevati\notklanjanje nedostatka, umanjenje cene, ponovno pružanje usluge ili\nraskid ugovora uz povraćaj novca, u skladu sa zakonom.</p>\n<p>3.6. <strong>Vansudsko rešavanje potrošačkih sporova.</strong>\nUkoliko Potrošač nije zadovoljan ishodom reklamacije, može pokrenuti\npostupak vansudskog rešavanja potrošačkog spora pred ovlašćenim telom\n(posrednikom) upisanim u registar koji vodi ministarstvo nadležno za\nposlove trgovine i zaštite potrošača, kao i obratiti se udruženjima za\nzaštitu potrošača.</p>\n<p>3.7. Odredbe ovih Uslova ne isključuju niti ograničavaju prava koja\npotrošaču pripadaju po prinudnim propisima.</p>\n<p><strong>4. Ograničenje odgovornosti i odricanje od\ngarancija</strong></p>\n<p>4.1. Cene, opisi i dostupnost Usluga mogu se menjati.</p>\n<p>4.2. Centar nije odgovoran za štetu nastalu usled:</p>\n<ul>\n<li><p>netačnih, nepotpunih ili prećutanih podataka o zdravstvenom\nstanju koje je dao Korisnik;</p></li>\n<li><p>nepoštovanja uputstava stručnog osoblja pre, tokom i nakon\nTretmana i Usluga;</p></li>\n<li><p>rezultata Edukacija u meri u kojoj oni zavise od angažovanja,\nzalaganja, primene stečenih znanja i veština, kao i ukupne uključenosti\nKorisnika u proces edukacije.</p></li>\n</ul>\n<p>4.3. Individualni rezultati tretmana variraju i ne mogu se\ngarantovati.</p>\n<p>4.4. U meri u kojoj to zakon dozvoljava, Centar ne odgovara za\nindirektne i posledične štete, kao ni za izgubljenu dobit, izgubljene\nprilike ili druge slične štete nastale u vezi sa pružanjem Usluga, čak i\nako je Centar unapred obavešten o mogućnosti nastanka takve štete.</p>\n<p>4.5. Ništa u ovim Uslovima ne isključuje odgovornost centra za\npružene Usluge koja se po zakonu i prinudnim propisima ne može\nisključiti.</p>\n<ol start=\"5\" type=\"I\">\n<li><p><strong>Izmene Uslova i način obaveštavanja\nkorisnika</strong></p></li>\n</ol>\n<p>Centar zadržava pravo da povremeno menja ove Uslove korišćenja,\nnaročito radi usklađivanja sa propisima, promenama u uslugama,\nposlovanju ili tehničkim funkcionalnostima.</p>\n<p>Izmenjeni Uslovi korišćenja objavljuju se na Sajtu sa novim datumom\nposlednje izmene. Molimo Vas da, pre korišćenja Aplikacije i Sajta, kao\ni pre zakazivanja Usluga, proverite da li ste upoznati sa sa najnovijom\nvažećom verzijom ovih Uslova korišćenja.</p>\n<p>Nastavak korišćenja Aplikacije i/ili Sajta i zakazivanje Usluga nakon\npočetka primene izmena smatra se prihvatanjem izmenjenih Uslova\nkorišćenja. Ukoliko se Korisnik ne slaže sa izmenama, dužan je da\nprestane da koristi Aplikaciju i/ili Sajt. Izmene ne utiču na prava\nstečena iz već zaključenih ugovora.</p>\n<ol start=\"6\" type=\"I\">\n<li><p><strong>Merodavno pravo i nadležni sud</strong></p></li>\n</ol>\n<p>Na ove Uslove korišćenja i na sve odnose između Centra i Korisnika\nprimenjuje se pravo Republike Srbije.</p>\n<p>Sporove koji proisteknu iz ovih Uslova ili u vezi sa njima strane će\nnastojati da reše sporazumno. Ukoliko sporazumno rešenje nije moguće, za\nrešavanje spora nadležan je stvarno nadležni sud u Beogradu.</p>\n<p>Za potrošačke sporove ostaje nepromenjeno pravo Potrošača da se\nobrati sudu koji je zakonom određen kao nadležan, kao i pravo na\nvansudsko rešavanje spora iz tačke 3.6.</p>\n<ol start=\"7\" type=\"I\">\n<li><p><strong>Delimična ništavost i celokupnost\nugovora</strong></p></li>\n</ol>\n<p>Ukoliko se neka odredba ovih Uslova korišćenja pokaže ništavom,\nnevažećom ili neprimenjivom, to ne utiče na punovažnost ostalih odredbi.\nTakva odredba biće zamenjena važećom odredbom koja je po dejstvu\nnajbliža nameri originalne odredbe.</p>\n<p>Ovi Uslovi korišćenja, zajedno sa Politikom privatnosti, Politikom\nkolačića, kao i svim pojedinačnim potvrdama termina, ponudama i pisanim\ndogovorima o Uslugama, čine celokupan sporazum između Centra i Korisnika\nu vezi sa predmetom Uslova i zamenjuju sve prethodne dogovore.</p>\n<p>Propuštanje Centra da u određenom trenutku ostvari neko svoje pravo\nne znači odricanje od tog prava.</p>\n<p>Korisnik ne može preneti svoja prava i obaveze iz ovih Uslova\nkorišćenja na treće lice bez pisane saglasnosti Centra.</p>\n<ol start=\"8\" type=\"I\">\n<li><p><strong>Kontakt za pitanja i prigovore</strong></p></li>\n</ol>\n<p>Za sva pitanja, primedbe, prigovore, reklamacije i zahteve u vezi sa\novim Uslovima korišćenja i Uslugama možete nas kontaktirati:</p>\n<ul>\n<li><p><strong>Beauty &amp; Nutrition – Estetsko edukativni\ncentar</strong></p></li>\n<li><p><strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000\nBeograd</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p></li>\n<li><p><strong>Instagram:</strong> @beauty_and_nutrition_</p></li>\n<li><p><strong>Facebook:</strong> Beauty &amp; Nutrition (stranica na\nFacebook-u)</p></li>\n<li><p><strong>Radno vreme:</strong> ponedeljak-petak na zakazivanje;\nsubota: 10h-15h; nedelja: neradan dan.</p></li>\n</ul>\n<p>Na pisane upite odgovaramo u razumnom roku, a najkasnije u rokovima\npredviđenim zakonom.</p>\n<p><strong>18. Datum poslednje izmene</strong></p>\n<p>Ovi Uslovi korišćenja poslednji put izmenjeni su <strong>6. novembra\n2026. godine</strong>.</p>\n", "odustanak": "<p><strong>OBRAZAC ZA ODUSTANAK OD UGOVORA</strong></p>\n<p><strong>Primalac obrasca:</strong> <strong>:</strong> ANDRIJANA\nOBRADOVIĆ PR EDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa\nizdvojenim prostorom, poslovno ime pod kojim se nastupa: Beauty &amp;\nNutrition – Estetsko edukativni centar<br />\n<strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000 Beograd,\nSrbija, adresa sedišta: Branka Miljkovića 27, 34000 Kragujevac<br />\n<strong>E-mail:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p>\n<p>Ovim obrascem obaveštavam pružaoca usluge da odustajem od ugovora\nzaključenog na daljinu, u meri u kojoj imam pravo na odustanak u skladu\nsa važećim propisima.</p>\n<p><strong>1. Podaci o korisniku</strong></p>\n<p>Ime i prezime: __________________________________</p>\n<p>Adresa: ________________________________________</p>\n<p>E-mail adresa: __________________________________</p>\n<p>Broj telefona (opciono): __________________________</p>\n<p><strong>2. Podaci o ugovoru</strong></p>\n<p>Vrsta usluge:</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Kozmetički\ntretman</label></p></li>\n<li><p><label><input type=\"checkbox\" />Edukacija uživo</label></p></li>\n<li><p><label><input type=\"checkbox\" />Online edukacija ili digitalni\nsadržaj</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Naziv usluge: ___________________________________</p>\n<p>Datum zaključenja ugovora odnosno rezervacije: ______________</p>\n<p>Datum zakazanog termina: ______________</p>\n<p>Ukupan ugovoreni iznos Usluge: ______________ RSD</p>\n<p>Uplaćeni avans: ______________ RSD</p>\n<p><strong>3. Izjava o odustanku</strong></p>\n<p>Ovim izjavljujem da odustajem od navedenog ugovora, u skladu sa\nprimenjivim zakonskim uslovima.</p>\n<p>Razlog odustanka (opciono):</p>\n<p><strong>4. Podaci za povraćaj novca</strong></p>\n<p>Ime vlasnika računa: ______________________________</p>\n<p>Broj tekućeg računa (ako je potreban): _________________</p>\n<p>Iznos čiji se povraćaj traži: ______________ RSD</p>\n<p><strong>5. Dodatne informacije</strong></p>\n<p>Da li je usluga već započeta ili izvršena?</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Ne</label></p></li>\n<li><p><label><input type=\"checkbox\" />Da</label></p></li>\n<li><p><label><input type=\"checkbox\" />Delimično</label></p></li>\n</ul>\n<p>Datum podnošenja obrasca: ________________________</p>\n<p>Ime i prezime korisnika: ___________________________</p>\n<p><strong>Napomena:</strong> function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const CAL_COLORS=["#A8853F","#6B8E6B","#A2645A","#5F7A99","#8A6B9E","#4F8E8B","#7D7461"];

/* termini koji se preklapaju u istom danu idu jedan pored drugog (npr. zaposlena i aparat u 17:30) */
function calLanes(bks){
  const arr=bks.map(b=>({id:b.id,s:toMin(b.start),e:toMin(b.start)+Math.max(15,+b.totalDuration||0)})).sort((x,y)=>x.s-y.s||y.e-x.e);
  const out={};let cl=[],clEnd=-1,ends=[];
  const flush=()=>{cl.forEach(c=>out[c.id]={lane:c.lane,lanes:ends.length});cl=[];ends=[];clEnd=-1};
  for(const c of arr){
    if(cl.length&&c.s>=clEnd)flush();
    let i=ends.findIndex(e=>e<=c.s);if(i<0){i=ends.length;ends.push(c.e)}else ends[i]=c.e;
    c.lane=i;cl.push(c);clEnd=Math.max(clEnd,c.e);
  }
  if(cl.length)flush();
  return out;
}
function admCal(){

  const list=have?S.calBk.list.filter(b=>b.status==="zakazano"):[];
  const d0=parseD(ws);const days=[];for(let i=0;i<7;i++)days.push(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i));
  const O=480,CL=1260,PXH=44;const H=(CL-O)/60*PXH;
  const shownY=S.calYear||days[3].getFullYear();
  const today=dstr(new Date());

  const cols=days.map(d=>{const ds=dstr(d);const open=dayHours(ds);
    const bks=list.filter(b=>b.date===ds),ln=calLanes(bks);
    return `<div class="cal-col ${open?"":"closed"}" style="height:${H}px">
      ${hrs.map(h=>`<div class="cal-hr" style="top:${(h*60-O)/60*PXH}px"></div>`).join("")}
      ${bks.map(b=>{const t=toMin(b.start);const hpx=Math.max(21,(b.totalDuration/60)*PXH-2);const L=ln[b.id]||{lane:0,lanes:1};
        const pos=L.lanes>1?`left:calc(${(L.lane*100/L.lanes).toFixed(3)}% + 1px);right:auto;width:calc(${(100/L.lanes).toFixed(3)}% - 2px);`:"";
        return `<div class="cal-bk ${b.source==="manual"?"man":""}" data-calbk="${esc(b.id)}" style="${pos}top:${(t-O)/60*PXH}px;height:${hpx}px;background:${calColor(b.employee)}" title="${esc(b.start+"\u2013"+b.end+" \u00b7 "+b.userName+" \u00b7 "+b.services.map(svcLine).join(", ")+" ("+b.employeeName+")")}"><b>${esc(b.start)}</b> ${esc(b.userName)}<br>${esc(b.employeeName)}</div>`}).join("")}
      ${open?"":`<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.14em;color:var(--muted)">NERADNO</div>`}
    </div>`}).join("");
  const headRow=`<div></div>${days.map(d=>{const ds=dstr(d);return `<div class="cal-dayh ${ds===today?"today":""}">${DOWS_S[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.</div>`}).join("")}`;
  const lab=days[0].getDate()+". "+MONTHS[days[0].getMonth()]+" \u2013 "+days[6].getDate()+". "+MONTHS[days[6].getMonth()]+" "+days[6].getFullYear()+".";
  return `
  <div class="cal-months">
    <div class="cal-years" role="group" aria-label="Godina">${calYears().map(y=>`<button class="chip ${y===shownY?"on":""}" data-calyear="${y}">${y}</button>`).join("")}</div>
    <div class="cal-mrow" role="group" aria-label="Mesec">${MONTHS.map((nm,i)=>`<button class="chip ${days.some(d=>d.getMonth()===i&&d.getFullYear()===shownY)?"on":""}" data-calym="${shownY}-${i}" title="${capM(i)} ${shownY}.">${nm}</button>`).join("")}</div>
  </div>
  <div class="cal-head">
    <button class="btn btn-ghost btn-sm" data-calnav="-7">\u2039 Prethodna</button>
    <button class="btn btn-ghost btn-sm" data-calnav="0">Danas</button>
    <button class="btn btn-ghost btn-sm" data-calnav="7">Sledeća \u203a</button>
    <span class="cal-title">${esc(lab)}</span>
    <span class="cal-legend">${S.employees.map(e=>`<span><span class="cal-dot" style="background:${calColor(e.id)}"></span>${esc(e.name)}</span>`).join("")}</span>
  </div>
  ${have?"":`<div class="loading">Učitavanje kalendara…</div>`}
  <div class="cal-wrap"><div class="cal-grid">${headRow}${gut}${cols}</div></div>
  <p class="note" style="margin-top:10px">„+ Ručni unos" upisuje termin direktno u kalendar - za pakete (4, 5, 6, 20 tretmana) i telefonska zakazivanja. Klik na ručno unet termin otvara izmenu.</p>`;

      if(f==="serviceId"){const s=S.services.find(x=>x.id===el.value);if(s){r.duration=s.duration||"";r.price=s.price==null?"":s.price}mRedraw();return}
      mRefreshTot();
    };
    if(el.tagName==="SELECT")el.onchange=h;else el.oninput=h;
  });
  root.querySelectorAll("[data-mcat]").forEach(b=>b.onclick=()=>{const [bi,ri,c]=b.dataset.mcat.split(":");const r=M.blocks[+bi].svcs[+ri];if(r.cat===c)return;r.cat=c;if(r.serviceId!=="__custom"){r.serviceId="";r.duration="";r.price=""}mRedraw()});
  root.querySelectorAll("[data-maddsvc]").forEach(b=>b.onclick=()=>{const bl=M.blocks[+b.dataset.maddsvc];if(bl.svcs.length>=MAX_PER_EMP)return;bl.svcs.push(mNewRow(bl.svcs[bl.svcs.length-1].cat));mRedraw()});
  root.querySelectorAll("[data-mdelsvc]").forEach(b=>b.onclick=()=>{const [bi,ri]=b.dataset.mdelsvc.split(":").map(Number);M.blocks[bi].svcs.splice(ri,1);mRedraw()});
  root.querySelectorAll("[data-mdelblock]").forEach(b=>b.onclick=()=>{M.blocks.splice(+b.dataset.mdelblock,1);mRedraw()});
  const ae=root.querySelector("[data-maddemp]");
  if(ae)ae.onclick=()=>{
    const used=M.blocks.map(b=>b.employee);const e=S.employees.find(x=>x.active!==false&&!used.includes(x.id));if(!e)return;
    const last=M.blocks[M.blocks.length-1];const t=mTot(last);
    const next=validHM(last.start)?Math.min(toMin(last.start)+t.d,21*60):10*60;
    M.blocks.push({employee:e.id,date:last.date,start:toHM(next),note:"",svcs:[mNewRow(last.svcs[0]?last.svcs[0].cat:"lice")]});mRedraw();
  };

async function saveManual(){
  const err=m=>{const b=$("#m-err");if(b){b.textContent=m;b.classList.remove("hidden");b.scrollIntoView({block:"nearest"})}};
  const name=M.name.trim(),tel=M.tel.trim(),email=M.email.trim();
  if(!name)return err("Unesite ime i prezime klijenta.");
  if(!telOk(tel))return err("Unesite ispravan broj telefona klijenta (npr. 064 123 4567) - na njega stiže SMS podsetnik.");
  const used=new Set();
  for(let bi=0;bi<M.blocks.length;bi++){
    const bl=M.blocks[bi],pre=M.blocks.length>1?"Zaposlena "+(bi+1)+": ":"";
    if(used.has(bl.employee))return err(pre+"ista zaposlena je izabrana dva puta - spojite usluge u jedan blok (najviše "+MAX_PER_EMP+").");
    used.add(bl.employee);
    if(!bl.date||!validHM(bl.start))return err(pre+"proverite datum i vreme.");
    for(const r of bl.svcs){
      if(!r.serviceId)return err(pre+"izaberite uslugu ili „Paket / ručni opis“.");
      if(r.serviceId==="__custom"&&!r.label.trim())return err(pre+"upišite naziv paketa ili usluge.");
      if(!(+r.duration>0))return err(pre+"upišite trajanje usluge u minutima.");
    }
  }
  const blocks=M.blocks.map(bl=>({employee:bl.employee,date:bl.date,start:bl.start,note:bl.note.trim(),
    services:bl.svcs.map(r=>({serviceId:r.serviceId==="__custom"?null:r.serviceId,label:r.label.trim(),cat:r.cat,duration:+r.duration,price:+r.price||0}))}));
  const btn=$("#m-save");btn.disabled=true;
  try{
    if(M.editId){await apiPost("/api/admin/booking/"+encodeURIComponent(M.editId),Object.assign({name,tel,email},blocks[0]));toast("Izmene su sačuvane.")}
    else{const r=await apiPost("/api/admin/manual",{name,tel,email,blocks});toast(r.bookings.length>1?"Upisano je "+r.bookings.length+" termina u kalendar.":"Termin je upisan u kalendar.")}
    closeModal();M=null;S.calLoadKey=null;S.calBk=null;loadAdm();render();
  }catch(e){err(e.message);btn.disabled=false}
}

    const sf=sq.closest("form");if(sf)sf.onsubmit=e=>{e.preventDefault();sq.blur()};

  root.querySelectorAll("[data-admemp]").forEach(b=>b.onclick=()=>{S.admFilter=b.dataset.admemp;render()});
  const bk=root.querySelector("[data-backup]");
  if(bk)bk.onclick=()=>{window.location.href="/api/admin/backup";toast("Kopija se preuzima…")};
  const aks=root.querySelector("#ak-save");
  if(aks)aks.onclick=async()=>{
    const err=m=>{const b=root.querySelector("#ak-err");if(b){b.textContent=m;b.classList.remove("hidden")}};
    const name=root.querySelector("#ak-name").value.trim(),desc=root.querySelector("#ak-desc").value.trim();
    const price=+root.querySelector("#ak-price").value,old=+root.querySelector("#ak-old").value||0,dur=+root.querySelector("#ak-dur").value;
    const emps=[...root.querySelectorAll(".ak-emp:checked")].map(x=>x.value);
    if(!name||!(price>=0)||!(dur>0))return err("Unesite naziv, cenu i trajanje.");
    if(!emps.length)return err("Označite bar jednu zaposlenu koja izvodi paket.");
    aks.disabled=true;
    try{const r=await apiPost("/api/admin/service-new",{name,desc,price,oldPrice:old>price?old:null,duration:dur,emps});S.services.push(r.service);toast("Akcija je objavljena.");render()}
    catch(e){err(e.message);aks.disabled=false}
  };
  root.querySelectorAll("[data-akdel]").forEach(b=>b.onclick=async()=>{
    if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Potvrdi brisanje";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Obriši"}},4000);return}
    try{await apiPost("/api/admin/service-del/"+encodeURIComponent(b.dataset.akdel));S.services=S.services.filter(s=>s.id!==b.dataset.akdel);toast("Akcija je obrisana.");render()}
    catch(e){toast(e.message)}
  });
  root.querySelectorAll("[data-svcadd]").forEach(b=>b.onclick=()=>svcAddModal(b.dataset.svcadd));
  root.querySelectorAll("[data-svcdel]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.svcdel;
    if(!b.dataset.arm){b.dataset.arm="1";b.classList.add("arm");b.title="Klikni ponovo za brisanje";toast("Kliknite ponovo na kantu da potvrdite brisanje.");setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.classList.remove("arm");b.title="Obriši uslugu"}},4000);return}
    b.disabled=true;
    try{await apiPost("/api/admin/service-del/"+encodeURIComponent(id));S.services=S.services.filter(s=>s.id!==id);S.cart=S.cart.filter(s=>s.id!==id);toast("Usluga je obrisana.");render()}
    catch(e){toast(e.message);b.disabled=false}
  });
  root.querySelectorAll("[data-emptoggle]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.emptoggle;const e=S.employees.find(x=>x.id===id);if(!e)return;b.disabled=true;
    try{
      const r=await apiPost("/api/admin/employee/"+encodeURIComponent(id),{active:e.active===false});
      const i=S.employees.findIndex(x=>x.id===id);if(i>=0)S.employees[i]=r.employee;
      toast(isDev(e)?(r.employee.active===false?e.name+" je isključen.":e.name+" je ponovo dostupan."):(r.employee.active===false?e.name+" je na odmoru.":e.name+" je ponovo dostupna."));render();
    }catch(er){toast(er.message);b.disabled=false}
  });
  root.querySelectorAll("[data-calnav]").forEach(b=>b.onclick=()=>{const n=+b.dataset.calnav;S.calYear=null;if(n===0){S.calWS=dstr(weekStart(new Date()))}else{const d=parseD(S.calWS);S.calWS=dstr(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}render()});
  root.querySelectorAll("[data-calyear]").forEach(b=>b.onclick=()=>{const y=+b.dataset.calyear,n=new Date();
    S.calYear=y;S.calWS=dstr(weekStart(y===n.getFullYear()?n:new Date(y,0,1)));render()});
  root.querySelectorAll("[data-calym]").forEach(b=>b.onclick=()=>{const[y,m]=b.dataset.calym.split("-").map(Number),n=new Date();
    S.calYear=y;S.calWS=dstr(weekStart(y===n.getFullYear()&&m===n.getMonth()?n:new Date(y,m,1)));render()});
  const mb=root.querySelector("[data-manual]");if(mb)mb.onclick=()=>manualModal();
  root.querySelectorAll("[data-bkedit]").forEach(b=>b.onclick=()=>{const x=findBk(b.dataset.bkedit);if(x)manualModal(x)});
  root.querySelectorAll("[data-bkdel]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Potvrdi brisanje";b.classList.add("btn-danger");setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Obriši";b.classList.remove("btn-danger")}},4000);return}
    b.disabled=true;deleteBooking(b.dataset.bkdel);
  });
  root.querySelectorAll("[data-calbk]").forEach(el=>el.onclick=()=>{const x=findBk(el.dataset.calbk);if(!x)return;
    if(x.source==="manual")manualModal(x);else toast("Online rezervacija ("+x.userName+") - otkazuje se u kartici Rezervacije.")});
  /* radno vreme zaposlenih */
  const ehReload=()=>{S.eh=null;loadEh()};
  root.querySelectorAll("[data-ehemp]").forEach(b=>b.onclick=()=>{S.ehEmp=b.dataset.ehemp;render()});
  root.querySelectorAll('[id^="eh-x-"]').forEach(x=>x.onchange=()=>{const k=x.id.slice(5);const o=root.querySelector("#eh-o-"+k),c=root.querySelector("#eh-c-"+k);if(o)o.disabled=x.checked;if(c)c.disabled=x.checked});
  const ehs=root.querySelector("#eh-save");
  if(ehs)ehs.onclick=async()=>{
    const W={};
    for(const k of ["0","1","2","3","4","5","6"]){
      const x=root.querySelector("#eh-x-"+k),o=root.querySelector("#eh-o-"+k),c=root.querySelector("#eh-c-"+k);
      W[k]=x&&x.checked?{off:true}:{open:o.value,close:c.value};
      if(!W[k].off&&!(W[k].open&&W[k].close&&W[k].open<W[k].close))return toast("Proverite vreme za: "+DOWS[+k]+" (početak pre kraja).");
    }
    ehs.disabled=true;
    try{await apiPost("/api/admin/emp-hours/"+encodeURIComponent(S.ehEmp)+"/week",W);toast("Raspored je sačuvan.");ehReload()}catch(e){toast(e.message);ehs.disabled=false}
  };
  const ehr=root.querySelector("#eh-reset");
  if(ehr)ehr.onclick=async()=>{try{await apiPost("/api/admin/emp-hours/"+encodeURIComponent(S.ehEmp)+"/week",{reset:true});toast("Vraćeno na radno vreme salona.");ehReload()}catch(e){toast(e.message)}};
  const ehx=root.querySelector("#ehd-x");
  if(ehx)ehx.onchange=()=>{["#ehd-o","#ehd-c"].forEach(q=>{const el=root.querySelector(q);if(el)el.disabled=ehx.checked})};
  const eha=root.querySelector("#ehd-add");
  if(eha)eha.onclick=async()=>{
    const date=root.querySelector("#ehd-date").value,off=root.querySelector("#ehd-x").checked,open=root.querySelector("#ehd-o").value,close=root.querySelector("#ehd-c").value;
    if(!date)return toast("Izaberite datum.");
    if(!off&&!(open&&close&&open<close))return toast("Proverite vreme (početak pre kraja).");
    eha.disabled=true;
    try{await apiPost("/api/admin/emp-hours/"+encodeURIComponent(S.ehEmp)+"/date",off?{date,off:true}:{date,open,close});toast("Izmena je dodata.");ehReload()}catch(e){toast(e.message);eha.disabled=false}
  };
  root.querySelectorAll("[data-ehdel]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await apiPost("/api/admin/emp-hours/"+encodeURIComponent(S.ehEmp)+"/date-del",{date:b.dataset.ehdel});toast("Izmena je obrisana.");ehReload()}catch(e){toast(e.message);b.disabled=false}});
  const vs=root.querySelector("#v-svc");
  if(vs)vs.onchange=()=>{const s=S.services.find(x=>x.id===vs.value);if(s){const a=root.querySelector("#v-amt");if(a)a.value=s.price}};
  const vo=root.querySelector("#v-order");if(vo)vo.onclick=orderVoucher;
  root.querySelectorAll("[data-vcr]").forEach(b=>b.onclick=async()=>{
    const v=(S.admVouchers||[]).find(x=>x.id===b.dataset.vcr);if(!v)return;b.disabled=true;
    const next=v.status==="obrađen"?"novo":"obrađen";
    try{await apiPost("/api/admin/vouchers/"+encodeURIComponent(v.id),{status:next});v.status=next;render()}catch(e){toast(e.message);b.disabled=false}
  });
  wireEyes(root);
  const ar=root.querySelector("#adm-refresh");if(ar)ar.onclick=()=>{refreshPublic().then(()=>loadAdm())};
  root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const t=root.querySelector(`template[data-txt="${CSS.escape(b.dataset.copy)}"]`);if(t)copyText(t.innerHTML.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"))});
  root.querySelectorAll("[data-copymail]").forEach(b=>b.onclick=()=>copyText(b.dataset.copymail));
  root.querySelectorAll("[data-sent]").forEach(b=>b.onclick=async()=>{try{await apiPost("/api/admin/remind/"+encodeURIComponent(b.dataset.sent),{send:false});toast("Označeno kao poslato.");loadAdm()}catch(e){toast(e.message)}});
  root.querySelectorAll("[data-sendnow]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await apiPost("/api/admin/remind/"+encodeURIComponent(b.dataset.sendnow),{send:true});toast(r.sent?"Podsetnik je poslat ✓":"Slanje nije uspelo - proverite SMTP.");loadAdm()}catch(e){toast(e.message);b.disabled=false}});
  const hs=root.querySelector("#hrs-save");
  if(hs)hs.onclick=async()=>{
    const H={};["0","1","2","3","4","5","6"].forEach(k=>{
      const x=root.querySelector("#h-x-"+k),o=root.querySelector("#h-o-"+k),c=root.querySelector("#h-c-"+k);
      H[k]=x&&x.checked?{closed:true}:{open:(o&&o.value)||"09:00",close:(c&&c.value)||"21:00",closed:false};
      if(!H[k].closed&&S.hours&&S.hours[k]&&S.hours[k].appt)H[k].appt=true;
    });
    try{const r=await apiPost("/api/admin/hours",H);S.hours=r.hours;S.eh=null;toast("Radno vreme je sačuvano.");render()}catch(e){toast(e.message)}
  };
  root.querySelectorAll("[data-svcpk]").forEach(b=>b.onclick=()=>pkgModal(b.dataset.svcpk));
  root.querySelectorAll("[data-svcsave]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.svcsave;
    const pe=root.querySelector("#sp-"+CSS.escape(id)),de=root.querySelector("#sd-"+CSS.escape(id));
    const a=root.querySelector("#sa-"+CSS.escape(id)).checked,ap=root.querySelector("#sap-"+CSS.escape(id));
    const body={active:a};
    if(ap)body.aparat=ap.checked;
    if(pe&&de){
      const p=+pe.value,d=+de.value;
      if(!(p>=0)||!(d>0))return toast("Proverite cenu i trajanje.");
      body.price=p;body.duration=d;
    }
    try{
      const r=await apiPost("/api/admin/service/"+encodeURIComponent(id),body);
      const i=S.services.findIndex(x=>x.id===id);if(i>=0)S.services[i]=r.service;
      toast("Usluga je ažurirana.");
      if(ap)render();
    }catch(e){toast(e.message)}
  });
  root.querySelectorAll('[id^="h-x-"]').forEach(x=>x.onchange=()=>{
    const k=x.id.slice(4);const o=root.querySelector("#h-o-"+k),c=root.querySelector("#h-c-"+k);
    if(o)o.disabled=x.checked;if(c)c.disabled=x.checked;
  });
}

</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});</script>
</body>
</html>
