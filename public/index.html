<style>
/* Layout: sticky espresso brand band with gold hairline; one serene 1100px column on ivory paper;
   serif editorial headings with italic gold accents; cards as soft porcelain tiles; gold-gradient CTAs. */
:root{
  --bg:#FBF8F2; --bg-glow:rgba(186,148,74,.07);
  --surface:#FFFFFF; --surface2:#F5EFE3;
  --ink:#231D17; --muted:#8B7D6A;
  --gold:#AE873C; --gold2:#D7B66C; --gold-strong:#8F6D2C; --gold-soft:#F1E7CF;
  --on-gold:#2B1F09;
  --band:#17120E; --band-ink:#F3EBDB; --band-mut:#C9BBA0; --band-gold:#E3C784;
  --line:#E9E0CC; --line-soft:#F0E9D9;
  --ok:#4F7A4B; --ok-bg:#EBF2E6; --danger:#A5473C; --danger-bg:#F7E9E5;
  --shadow:0 1px 2px rgba(35,29,23,.05),0 12px 32px -8px rgba(35,29,23,.12);
  --shadow-lg:0 2px 4px rgba(35,29,23,.06),0 24px 48px -12px rgba(35,29,23,.18);
  --ff-disp:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ff-hero:"Playfair Display",Georgia,"Times New Roman",serif;
  --ff-body:"Mulish",-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.6;font-variant-numeric:lining-nums;
  background:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -120px,var(--bg-glow),transparent 70%);
  background-repeat:no-repeat}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::selection{background:var(--gold-soft)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- header band ---------- */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  border-bottom:1px solid rgba(227,199,132,.28)}
.band::after{content:"";display:block;height:2px;background:linear-gradient(90deg,transparent,var(--band-gold) 30%,var(--band-gold) 70%,transparent);opacity:.55}
.band-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:13px;min-width:0}
.logo-mark{width:56px;height:auto;flex:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.logo-word{line-height:1.05}
.logo-word b{display:block;font-family:var(--ff-disp);font-weight:600;font-size:21px;letter-spacing:.15em;color:var(--band-ink)}
.logo-word span{display:block;font-size:9px;letter-spacing:.46em;color:var(--band-gold);text-transform:uppercase;margin-top:4px}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav button{position:relative;padding:9px 14px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-mut);transition:color .18s ease}
.nav button::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--band-gold);transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
.nav button:hover{color:var(--band-ink)}
.nav button.on{color:var(--band-gold)}
.nav button.on::after,.nav button:hover::after{transform:scaleX(1)}
.userchip{display:flex;align-items:center;gap:10px;margin-left:10px;padding:5px 6px 5px 14px;border:1px solid rgba(227,199,132,.4);border-radius:999px;font-size:13px;color:var(--band-ink)}
.userchip .out{padding:6px 12px;border-radius:999px;background:rgba(227,199,132,.16);color:var(--band-gold);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.userchip .out:hover{background:rgba(227,199,132,.28)}

/* ---------- shell & typography ---------- */
.wrap{max-width:1100px;margin:0 auto;padding-block:34px 140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app > *{animation:rise .4s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.h-page{font-family:var(--ff-hero);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.h-page em{font-style:italic;font-weight:500;color:var(--gold-strong)}
.sub{color:var(--muted);margin:0 0 22px;max-width:64ch;font-size:15.5px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-strong)}
/* hero sa fotografijom salona u pozadini: sleva krem preliv da tekst ostane čitljiv, zdesna zid sa natpisom */
.hero{position:relative;padding:36px 40px 30px;margin:0 0 22px;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
  background:#F3ECDF url(/img/hero.jpg) right top/cover no-repeat;min-height:380px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,248,242,.98) 0%,rgba(251,248,242,.95) 36%,rgba(251,248,242,.6) 56%,rgba(251,248,242,.06) 100%)}
.hero>*{position:relative}
.hero .sub{max-width:50ch}
@media (max-width:1000px){
  .hero::before{background:linear-gradient(90deg,rgba(251,248,242,.98) 0%,rgba(251,248,242,.95) 46%,rgba(251,248,242,.72) 66%,rgba(251,248,242,.1) 100%)}
  .hero .sub{max-width:42ch}
}
.hero-h{margin-top:14px;font-size:clamp(34px,5.6vw,54px)}
.hero-hours{margin-top:6px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;background:var(--surface);display:inline-block}
.hero-hours-t{display:block;font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.hero-meta{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.75}
.hero-orn{display:block;width:120px;height:20px;color:var(--gold);margin-top:22px;opacity:.8}
.rule{display:flex;align-items:center;gap:16px;margin:34px 0 16px}
.rule h2{font-family:var(--ff-disp);font-weight:600;font-size:26px;margin:0;white-space:nowrap}
.rule::after{content:"";height:1px;background:linear-gradient(90deg,var(--gold),var(--line) 60%,transparent);flex:1;opacity:.7}
.hidden{display:none!important}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- cards & controls ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;
  font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;
  transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);box-shadow:0 6px 18px -4px rgba(174,135,60,.5)}
.btn-gold:hover{box-shadow:0 10px 24px -4px rgba(174,135,60,.65);transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-strong)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:9px 15px;font-size:10.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);outline:none}
.field textarea{min-height:90px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pill-cat{background:var(--gold-soft);color:var(--gold-strong)}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--danger-bg);color:var(--danger)}

/* ---------- auth ---------- */
.auth-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:start;padding-top:18px}
.auth-hero{padding:10px 4px}
.auth-hero .big{font-family:var(--ff-hero);font-size:clamp(32px,5vw,50px);font-weight:600;line-height:1.08;margin:14px 0 14px;text-wrap:balance}
.auth-hero .big em{font-style:italic;font-weight:500;color:var(--gold-strong)}
.auth-hero p{color:var(--muted);max-width:48ch;font-size:15.5px}
.auth-points{display:grid;gap:12px;margin-top:22px}
.auth-points div{display:flex;gap:12px;align-items:baseline;font-size:14px}
.auth-points b{color:var(--gold);font-family:var(--ff-disp);font-size:17px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--surface2);width:max-content;max-width:100%}
.tabs button{padding:9px 18px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .15s ease}
.tabs button.on{background:var(--surface);color:var(--gold-strong);box-shadow:var(--shadow)}
.form-note{font-size:12.5px;color:var(--muted);margin-top:12px}
.err{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:12px}

/* ---------- catalog ---------- */
.cat-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 22px}
.cat-tabs button{padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  transition:all .18s ease;box-shadow:var(--shadow)}
.cat-tabs button:hover{border-color:var(--gold);color:var(--gold-strong)}
.cat-tabs button.on{background:var(--band);border-color:var(--band);color:var(--band-gold);box-shadow:var(--shadow-lg)}
.search{position:relative;flex:1 1 230px;min-width:190px;margin-left:auto;display:flex;align-items:center}
.search>svg{position:absolute;left:15px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:11px 38px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search .clr{display:none;position:absolute;right:6px;width:30px;height:30px;padding:0;border:0;background:transparent;box-shadow:none;border-radius:50%;place-items:center;color:var(--muted)}
.search.has-q .clr{display:grid}
.search .clr:hover{background:var(--surface2);color:var(--ink)}
.search-sum{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.svc{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden;
  transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease}
.svc::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--gold));opacity:0;transition:opacity .2s ease}
.svc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.svc:hover::before{opacity:1}
.svc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.svc h3{font-family:var(--ff-disp);font-weight:600;font-size:21.5px;line-height:1.18;margin:0;text-wrap:balance}
.svc-meta{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink)}
.svc-meta .lbl{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:3px}
.svc-meta .old{text-decoration:line-through;opacity:.55;font-size:13px}
.svc-meta .price{font-weight:800;color:var(--gold-strong);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:0}
.svc p{margin:0;color:var(--muted);font-size:13.5px}
/* slika usluge ispod naziva; opis je na svakoj kartici sakriven dok se ne klikne „Saznaj više" */
.svc-img{position:relative;margin:2px 0 0;aspect-ratio:16/9;border-radius:14px;background:var(--surface2) center/cover no-repeat;overflow:hidden}
.svc-img::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0) 58%,rgba(255,255,255,.28) 84%,rgba(255,255,255,.72) 100%),
             linear-gradient(90deg,rgba(255,255,255,.26),rgba(255,255,255,0) 12%,rgba(255,255,255,0) 88%,rgba(255,255,255,.26)),
             linear-gradient(0deg,rgba(255,255,255,0) 92%,rgba(255,255,255,.22) 100%);
  box-shadow:inset 0 0 0 1px rgba(35,29,23,.06)}
.svc p.desc{display:none}
.svc.open p.desc{display:block}
.svc .more{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:2px 0;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-strong)}
.svc .more svg{flex:none;transition:transform .18s ease}
.svc.open .more svg{transform:rotate(90deg)}
.svc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft)}
.svc-note{font-size:11.5px;color:var(--gold-strong);font-weight:700}
.svc.inCart{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
.svc.inCart::before{opacity:1}
.empty{border:1px dashed var(--line);border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.remind{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--gold-soft),transparent 160%);border:1px solid var(--gold);color:var(--gold-strong);border-radius:14px;padding:13px 18px;margin:0 0 20px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}

/* ---------- cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--band);color:var(--band-ink);z-index:40;
  border-top:1px solid rgba(227,199,132,.4);box-shadow:0 -14px 40px rgba(0,0,0,.28);
  padding-top:13px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cartbar .sum{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.cartbar .sum b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--band-gold)}
.cartbar .sum span{font-size:12.5px;color:var(--band-mut)}
.cartbar .actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.cartbar .clear{color:var(--band-mut);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cartbar .clear:hover{color:var(--band-ink)}

/* ---------- booking ---------- */
.book-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:20px;align-items:start}
.step-h{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.step-h .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);font-family:var(--ff-disp);font-weight:700;font-size:16px;display:grid;place-items:center;flex:none}
.step-h h3{font-family:var(--ff-disp);font-size:22px;font-weight:600;margin:0}
.choice-row{display:flex;gap:9px;flex-wrap:wrap}
.chip{padding:10px 17px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink);transition:all .15s ease}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:var(--on-gold);box-shadow:0 5px 14px -3px rgba(174,135,60,.5)}
.chip[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
/* kompaktni mesečni kalendar (izbor datuma) */
.mcal{width:100%;max-width:330px}
.mcal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mcal-head b{font-family:var(--ff-disp);font-size:19px;font-weight:600;text-transform:capitalize}
.mcal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1;color:var(--gold-strong);transition:border-color .15s ease}
.mcal-nav:hover{border-color:var(--gold)}
.mcal-nav[disabled]{opacity:.3;cursor:not-allowed}
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal-dow{text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:2px 0 4px}
.mcal-day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid transparent;transition:all .13s ease}
.mcal-day:not([disabled]):hover{border-color:var(--gold);color:var(--gold-strong)}
.mcal-day[disabled]{color:var(--muted);opacity:.38;cursor:not-allowed}
.mcal-day.today{border-color:var(--line)}
.mcal-day.on{background:var(--band);border-color:var(--band);color:var(--band-gold);box-shadow:var(--shadow)}
.mcal-foot{font-size:11.5px;color:var(--muted);margin-top:8px}
.modal.cal-modal{max-width:420px}
.svc-cal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;border-top:1px dashed var(--line-soft)}
.svc-cal .lbl{font-size:10.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-strong)}
.svc-cal .btn svg{flex:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--danger);transition:all .15s ease}
.icon-btn:hover{border-color:var(--danger);background:var(--danger-bg)}
.icon-btn.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.rule .btn{flex:none;order:2}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;margin-top:4px}
.slot{padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:center;transition:all .13s ease}
.slot:hover{border-color:var(--gold);color:var(--gold-strong)}
.slot.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:var(--on-gold);box-shadow:0 5px 14px -3px rgba(174,135,60,.5)}
.slot[disabled]{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.bk-sum{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.bk-sum ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:9px}
.bk-sum li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:9px}
.bk-sum li .rm{display:inline-flex;align-items:center;gap:5px;color:var(--danger);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.bk-sum li .rm:hover{text-decoration:underline}
.bk-sum .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold-strong);font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:2px}
.bk-sum .tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin:9px 0 2px}
.bk-sum .tot span{font-variant-numeric:tabular-nums}
.ok-box{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:15px 17px;font-weight:700;margin-top:14px}

/* ---------- my bookings & admin ---------- */
.bk-list{display:grid;gap:14px}
.bk{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bk .when{flex:none;text-align:center;border-right:1px solid var(--line);padding-right:16px;min-width:90px}
.bk .when .d{font-family:var(--ff-disp);font-size:28px;font-weight:600;line-height:1}
.bk .when .m{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.bk .when .t{font-weight:800;font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--gold-strong)}
.bk .mid{flex:1;min-width:220px}
.bk .mid .who{font-weight:800;font-size:15px}
.bk .mid .list{color:var(--muted);font-size:13px;margin-top:3px}
.bk .mid .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.bk .side{display:flex;flex-direction:column;gap:9px;align-items:flex-end;margin-left:auto}
.bk .price{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;color:var(--gold-strong)}
.adm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
.adm-tabs button{padding:10px 17px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface);transition:all .15s ease}
.adm-tabs button:hover{border-color:var(--gold)}
.adm-tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;color:var(--on-gold)}
.hours-row{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.hours-row b{font-size:13.5px}
.hours-row input[type=time]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.hours-row label.cl{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.adm-svc{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.adm-svc .nm{font-weight:700;min-width:0;display:flex;gap:10px;align-items:center}
.adm-svc .nm>div{min-width:0}
.adm-thumb{width:48px;height:34px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:none}
.adm-svc .nm small{display:block;color:var(--muted);font-weight:400}
.adm-svc input{width:90px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-variant-numeric:tabular-nums}
.adm-svc input[type=checkbox]{width:auto}
.rem-card .mailtxt,.mailtxt{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12.5px;white-space:pre-wrap;margin:10px 0}
.copybtn{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-strong)}
.statline{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 22px;box-shadow:var(--shadow)}
.stat b{font-size:26px;font-family:var(--ff-disp);font-weight:600;display:block;font-variant-numeric:tabular-nums lining-nums;color:var(--gold-strong)}
.stat span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(18,13,8,.6);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;
  padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:20px;max-width:580px;width:100%;max-height:min(84vh,780px);overflow:auto;padding:26px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.modal h3{font-family:var(--ff-disp);font-size:26px;font-weight:600;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-gold);padding:12px 24px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:80;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;border:1px solid rgba(227,199,132,.35)}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px;padding:30px 0}
.loading::before{content:"";width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.footer{margin-top:56px;border-top:1px solid var(--line);padding-top:22px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:12.5px}
.footer b{color:var(--ink)}
.policy h4{font-family:var(--ff-disp);font-size:17.5px;font-weight:600;margin:14px 0 4px;color:var(--ink)}
.policy p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.policy b{color:var(--ink)}
.policy h1,.policy h2,.policy h3{font-family:var(--ff-disp);font-size:18px;font-weight:600;margin:14px 0 4px;color:var(--ink)}
.policy strong{color:var(--ink)}
.policy ul,.policy ol{margin:0 0 8px 18px;padding:0;font-size:13px;color:var(--muted)}
.policy li{margin:0 0 4px}
.policy table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
.policy td,.policy th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;color:var(--muted)}
.policy a{color:var(--gold-strong)}

/* ---------- lozinka-oko ---------- */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);padding:7px;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.pw-eye:hover{color:var(--gold-strong)}
.pw-eye .e2{display:none}
.pw-eye.on .e1{display:none}
.pw-eye.on .e2{display:block}
/* ---------- kolačići ---------- */
.cookie{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;
  width:min(380px,calc(100vw - 32px));background:var(--band);color:var(--band-ink);border:1px solid rgba(227,199,132,.4);border-radius:16px;
  padding:14px 16px;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;transition:bottom .2s ease}
.cookie.lift{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.cookie>svg{flex:none;width:28px;height:28px;color:var(--band-gold);margin-top:1px}
.cookie p{margin:0 0 10px;color:var(--band-mut)}
.cookie p b{color:var(--band-ink)}
.cookie .more{color:var(--band-gold);text-decoration:underline;font-weight:700;padding:0;font-size:inherit;text-transform:none;letter-spacing:0}
.cookie .ok{padding:8px 18px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:760px){.cookie.lift{bottom:calc(128px + env(safe-area-inset-bottom,0px))}}
/* ---------- kalendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.cal-months{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.cal-months .chip{padding:7px 14px;font-size:12px;text-transform:capitalize}
.cal-title{font-family:var(--ff-disp);font-size:20px;font-weight:600;margin-right:auto}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal-wrap{overflow-x:auto;padding-bottom:8px}
.cal-grid{display:grid;grid-template-columns:40px repeat(7,minmax(88px,1fr));gap:3px;min-width:680px;max-width:860px}
.cal-dayh{text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 2px;border-bottom:2px solid var(--line)}
.cal-dayh.today{color:var(--gold-strong);border-color:var(--gold)}
.cal-col{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-col.closed{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 8px,var(--surface) 8px,var(--surface) 16px)}
.cal-gut{position:relative}
.cal-hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line-soft)}
.cal-hlabel{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-bk{position:absolute;left:2px;right:2px;border-radius:6px;color:#FFFDF6;padding:2px 5px;font-size:10px;line-height:1.25;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
@media (max-width:760px){
  .search{order:-1;flex-basis:100%;margin-left:0}
  .auth-grid,.book-grid{grid-template-columns:1fr}
  .adm-svc{grid-template-columns:1fr auto auto;row-gap:6px}
  .adm-svc .nm{grid-column:1/-1}
  .hours-row{grid-template-columns:86px 1fr 1fr;row-gap:6px}
  .hours-row label.cl{grid-column:1/-1}
  .bk .when{border-right:none;border-bottom:1px dashed var(--line);padding:0 0 10px;text-align:left;min-width:0}
  .bk .side{align-items:flex-start;margin-left:0}
  .bk-sum{position:static}
  .hero{padding:200px 18px 22px;min-height:0;background-position:66% 0;background-size:auto 420px}
  .hero::before{background:linear-gradient(180deg,rgba(251,248,242,0) 0%,rgba(251,248,242,.3) 130px,rgba(251,248,242,.96) 200px,rgba(251,248,242,.98) 100%)}
}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RSD=n=>new Intl.NumberFormat("sr-RS").format(n)+" RSD";
const priceTxt=(s,v)=>s&&s.cur==="EUR"?(new Intl.NumberFormat("sr-RS").format(v)+" €"):RSD(v);
const money=(r,e)=>[e?new Intl.NumberFormat("sr-RS").format(e)+" €":null,r?RSD(r):null].filter(Boolean).join(" + ")||RSD(0);
const DOWS=["Nedelja","Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota"];
const DOWS_S=["NED","PON","UTO","SRE","ČET","PET","SUB"];
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const toHM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const fmtD=s=>{const d=parseD(s);return DOWS[d.getDay()]+", "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear()+"."};
const durTxt=m=>m>=60?(Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"min":"")):(m+" min");
let toastT=null;
function toast(msg){const r=$("#toast-root");r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",3200)}
function copyText(t){ (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Kopirano ✓")).catch(()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Kopirano ✓")}catch(e){toast("Označite tekst i kopirajte ručno")}ta.remove()}) }

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"},credentials:"same-origin"},opts||{}));
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||("Greška ("+r.status+")"));
  return j;
}
const apiGet=p=>api(p);
const apiPost=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

/* ================= state ================= */
const S={
  me:null,loaded:false,loadErr:false,mailEnabled:false,
  services:[],employees:[],hours:null,salon:null,
  myBookings:[],admBookings:[],
  cart:[],view:"catalog",cat:"lice",q:"",authTab:"login",
  bEmp:"__any",bDate:null,bSlot:null,
  admTab:"rez",lastBooking:null
};
const isAdmin=()=>!!(S.me&&S.me.admin);
const isStaff=()=>!!(S.me&&(S.me.admin||S.me.staff));
const rezEmail=()=>(S.salon&&S.salon.rezEmail)||"andrijanaobradovic5@gmail.com";
const CATS={lice:"Tretmani lica",telo:"Tretmani tela",masaze:"Masaže",akcije:"Akcija",edu:"Edukacije"};
const TABS={lice:"Tretmani lica",telo:"Tretmani tela",akcije:"Akcije",vauceri:"Poklon vaučeri",edu:"Edukacije i obuke"};
const tabCats=t=>t==="telo"?["telo","masaze"]:[t];
const ICON_ARROW=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const ICON_SEARCH=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>`;

/* ================= boot & data ================= */
(async function boot(){
  render();
  try{
    const [pub,who]=await Promise.all([apiGet("/api/public"),apiGet("/api/me")]);
    Object.assign(S,{services:pub.services,employees:pub.employees,hours:pub.hours,salon:pub.salon,mailEnabled:!!pub.mailEnabled,loaded:true});
    S.me=who.me||null;
    if(S.me)loadMy();
  }catch(e){S.loadErr=true}
  render();
  initCookie();
  if(S.me&&S.me.needConsent)consentGate(async()=>{try{await apiPost("/api/consent");S.me.needConsent=false}catch(e){}},()=>logout());
  try{
    const rt=new URLSearchParams(location.search).get("reset");
    if(rt){history.replaceState(null,"",location.pathname);resetModal(rt)}
  }catch(e){}
})();
/* ================= kolačići ================= */
const COOKIE_KEY="bn_cookies_ok";
function initCookie(){
  const el=$("#cookie");if(!el)return;
  let ok=false;try{ok=localStorage.getItem(COOKIE_KEY)==="1"}catch(e){}
  if(ok)return;
  el.classList.remove("hidden");
  $("#cookie-ok").onclick=()=>{try{localStorage.setItem(COOKIE_KEY,"1")}catch(e){}el.classList.add("hidden")};
  $("#cookie-policy").onclick=policyModal;
}
async function refreshPublic(){try{const p=await apiGet("/api/public");Object.assign(S,{services:p.services,employees:p.employees,hours:p.hours,salon:p.salon})}catch(e){}}
async function loadMy(){try{S.myBookings=await apiGet("/api/my")}catch(e){S.myBookings=[]}render()}
async function loadAdm(){try{S.admBookings=await apiGet("/api/admin/bookings")}catch(e){S.admBookings=[]}if(S.view==="admin")render()}

/* ================= auth ================= */
async function register(f){
  const ime=f.ime.value.trim(),prezime=f.prezime.value.trim(),email=f.email.value.trim(),tel=f.tel.value.trim(),pw=f.pw.value;
  const gd=f.querySelector("#r-gdpr");
  if(!gd||!gd.checked)return consentGate(()=>{const g=f.querySelector("#r-gdpr");if(g)g.checked=true;register(f)});
  if(!ime||!prezime||!email||pw.length<6)return authErr("Popunite ime, prezime i e-mail; lozinka najmanje 6 karaktera.");
  try{
    const r=await apiPost("/api/register",{ime,prezime,email,telefon:tel,pw,consent:true});
    S.me=r.me;loadMy();toast("Dobro došli, "+S.me.ime+"!");S.view="catalog";render();
  }catch(e){authErr(e.message)}
}
async function login(f){
  const ident=f.ident.value.trim(),pw=f.pw.value;
  if(!ident||!pw)return authErr("Unesite e-mail ili ime i prezime, i lozinku.");
  try{
    const r=await apiPost("/api/login",{ident,pw});
    S.me=r.me;
    const fin=()=>{loadMy();toast("Prijavljeni ste kao "+S.me.ime);S.view="catalog";render()};

/* ================= hours / slots ================= */
function dayHours(dateStr){
  const d=parseD(dateStr).getDay();
  const h=S.hours&&S.hours[String(d)];
  if(!h||h.closed)return null;
  return {open:toMin(h.open),close:toMin(h.close)};
}
function cartTotals(){const t={dur:0,rsd:0,eur:0};S.cart.forEach(s=>{t.dur+=+s.duration||0;if(s.cur==="EUR")t.eur+=+s.price||0;else t.rsd+=+s.price||0});return t}
function performs(e,s){return Array.isArray(s.emps)?s.emps.includes(e.id):(e.cats||[]).includes(s.cat)}
function svcEmps(s){return S.employees.filter(e=>e.active!==false&&performs(e,s))}
function eligibleEmployees(){return S.cart.length?S.employees.filter(e=>e.active!==false&&S.cart.every(s=>performs(e,s))):[]}
function hoursSummary(){
  if(!S.hours)return[];
  const hm=t=>String(t).replace(/:00$/,"");
  const key=k=>{const h=S.hours[k];return !h||h.closed?"x":h.appt?"na zakazivanje":(hm(h.open)+"-"+hm(h.close))};
  const order=["1","2","3","4","5","6","0"];const parts=[];let i=0;
  while(i<order.length){
    let j=i;while(j+1<order.length&&key(order[j+1])===key(order[i]))j++;
    const lab=(i===j?DOWS_S[+order[i]]:DOWS_S[+order[i]]+"-"+DOWS_S[+order[j]]).toLowerCase();
    const v=key(order[i]);parts.push(lab+": "+(v==="x"?"neradno":v));i=j+1;
  }
  return parts;
}
async function bookingsFor(dateStr){return apiGet("/api/day?date="+encodeURIComponent(dateStr))}
function freeAt(bks,emp,start,dur){
  const end=start+dur;
  return !bks.some(b=>b.employee===emp&&!(end<=toMin(b.start)||start>=toMin(b.end)));
}
async function computeSlots(dateStr){
  const h=dayHours(dateStr);if(!h)return{slots:[],h:null};
  const {dur}=cartTotals();
  const bks=await bookingsFor(dateStr);
  const emps=S.bEmp==="__any"?eligibleEmployees().map(e=>e.id):[S.bEmp];
  const today=dstr(new Date());
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const slots=[];
  for(let t=h.open;t+dur<=h.close;t+=30){
    if(dateStr===today&&t<nowMin+60)continue;
    const freeEmp=emps.find(e=>freeAt(bks,e,t,dur));
    slots.push({t,free:!!freeEmp});
  }
  return{slots,h};
}
/* slobodni termini za proizvoljnu listu usluga (popup kalendar na karticama) */
async function slotsForServices(dateStr,list){
  const h=dayHours(dateStr);if(!h)return{slots:[],h:null};
  const dur=list.reduce((a,s)=>a+(+s.duration||0),0);
  const emps=S.employees.filter(e=>e.active!==false&&list.every(s=>performs(e,s))).map(e=>e.id);
  if(!emps.length)return{slots:[],h,noEmp:true};
  const bks=await bookingsFor(dateStr);
  const today=dstr(new Date());const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const slots=[];
  for(let t=h.open;t+dur<=h.close;t+=30){
    if(dateStr===today&&t<nowMin+60)continue;
    slots.push({t,free:emps.some(e=>freeAt(bks,e,t,dur))});
  }
  return{slots,h};
}
/* kompaktni mesečni kalendar: tekući mesec + naredna 2, samo radni dani salona */
const MONTHS_L=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
const CAL_SPAN=2;
function calMonthHTML(off,sel,attr){
  const now=new Date();const today=dstr(now);
  const m0=new Date(now.getFullYear(),now.getMonth()+off,1);
  const days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const lead=(m0.getDay()+6)%7;
  const cells=[];for(let i=0;i<lead;i++)cells.push(`<span></span>`);
  for(let d=1;d<=days;d++){
    const ds=dstr(new Date(m0.getFullYear(),m0.getMonth(),d));
    const ok=ds>=today&&!!dayHours(ds);
    cells.push(`<button class="mcal-day ${ds===today?"today":""} ${sel===ds?"on":""}" data-${attr}="${ds}" ${ok?"":"disabled"} aria-label="${esc(fmtD(ds))}">${d}</button>`);
  }
  return `<div class="mcal">
    <div class="mcal-head">
      <button class="mcal-nav" data-${attr}-off="${off-1}" ${off<=0?"disabled":""} aria-label="Prethodni mesec"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b>${MONTHS_L[m0.getMonth()]} ${m0.getFullYear()}.</b>
      <button class="mcal-nav" data-${attr}-off="${off+1}" ${off>=CAL_SPAN?"disabled":""} aria-label="Sledeći mesec"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mcal-grid">${["PON","UTO","SRE","ČET","PET","SUB","NED"].map(x=>`<span class="mcal-dow">${x}</span>`).join("")}${cells.join("")}</div>
    <div class="mcal-foot">Radno vreme: ${hoursSummary().map(esc).join(" · ")}</div>
  </div>`;
}
const calOffFor=ds=>{if(!ds)return 0;const d=parseD(ds),n=new Date();return Math.max(0,Math.min(CAL_SPAN,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth()))};
const ICON_CAL=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;
const ICON_TRASH=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>`;
function calModal(svcId){
  const s=S.services.find(x=>x.id===svcId);if(!s)return;
  const list=S.cart.some(c=>c.id===s.id)?S.cart.slice():S.cart.concat([s]);
  const st={off:0,date:null,slot:null};
  const dur=list.reduce((a,x)=>a+(+x.duration||0),0);
  const draw=()=>{
    const m=$("#modal-root .modal");if(!m)return;
    m.innerHTML=`<h3>${esc(s.name)}</h3>
      <p class="note" style="margin:-4px 0 14px">${list.length>1?"Zajedno sa uslugama iz korpe · ":""}trajanje ${durTxt(dur)}. Izaberite dan, pa slobodan termin.</p>
      ${calMonthHTML(st.off,st.date,"cmday")}
      <div id="cm-slots" style="margin-top:14px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn btn-gold btn-sm" id="cm-go" ${st.date&&st.slot!=null?"":"disabled"}>${st.date&&st.slot!=null?"Nastavi · "+esc(st.date.split("-").reverse().slice(0,2).join(".")+". u "+toHM(st.slot)):"Nastavi"}</button>
        <button class="btn btn-ghost btn-sm" id="m-close">Zatvori</button>
      </div>`;
    m.querySelector("#m-close").onclick=closeModal;
    m.querySelectorAll("[data-cmday-off]").forEach(b=>b.onclick=()=>{if(b.disabled)return;st.off=+b.dataset.cmdayOff;draw()});
    m.querySelectorAll("[data-cmday]").forEach(b=>b.onclick=()=>{if(b.disabled)return;st.date=b.dataset.cmday;st.slot=null;draw()});
    m.querySelector("#cm-go").onclick=()=>{
      if(!st.date||st.slot==null)return;
      if(!S.cart.some(c=>c.id===s.id))S.cart.push(s);
      S.bEmp="__any";S.bDate=st.date;S.bSlot=st.slot;S.bOff=null;closeModal();S.view="booking";render();
    };
    const area=m.querySelector("#cm-slots");
    if(!st.date){area.innerHTML=`<p class="note">Izaberite datum da biste videli slobodne termine.</p>`;return}
    area.innerHTML=`<div class="loading" style="padding:10px 0">Proveravam slobodne termine…</div>`;
    const want=st.date;
    slotsForServices(want,list).then(({slots,h,noEmp})=>{
      if(st.date!==want||!area.isConnected)return;
      if(noEmp){area.innerHTML=`<p class="note" style="color:var(--danger)">Nijedna zaposlena ne izvodi sve izabrane tretmane u jednoj poseti.</p>`;return}
      if(!h){area.innerHTML=`<p class="note">Salon ne radi izabranog dana.</p>`;return}
      if(!slots.some(x=>x.free)){area.innerHTML=`<p class="note">Nema slobodnih termina tog dana - izaberite drugi dan.</p>`;return}
      area.innerHTML=`<p class="note" style="margin:0 0 8px">${esc(fmtD(want))} · radno vreme ${toHM(h.open)}-${toHM(h.close)}</p>
        <div class="slots">${slots.map(x=>`<button class="slot ${st.slot===x.t?"on":""}" data-cmslot="${x.t}" ${x.free?"":"disabled"}>${toHM(x.t)}</button>`).join("")}</div>`;
      area.querySelectorAll("[data-cmslot]").forEach(b=>b.onclick=()=>{st.slot=+b.dataset.cmslot;draw()});
    }).catch(()=>{if(area.isConnected)area.innerHTML=`<p class="note">Termine trenutno nije moguće učitati. Pokušajte ponovo.</p>`});
  };
  showModal("");
  const m=$("#modal-root .modal");if(m)m.classList.add("cal-modal");
  draw();
}

const byName=(a,b)=>a.name.localeCompare(b.name,"sr");

const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"dj");
function searchServices(q){
  const toks=fold(q).split(/\s+/).filter(Boolean);if(!toks.length)return[];
  return S.services.filter(s=>s.active!==false&&toks.every(t=>(fold(s.name)+" "+fold(s.desc)).includes(t)));
}
const nTretmana=n=>n+(n%10===1&&n%100!==11?" tretman":" tretmana");
function catalogBody(){
  const q=(S.q||"").trim();
  const cats=tabCats(S.cat);
  const byCat=c=>S.services.filter(s=>s.active!==false&&s.cat===c).sort(byName);
  if(q&&S.loaded){
    const hits=searchServices(q);
    if(!hits.length)return `<div class="empty"><p style="font-weight:800">Nema tretmana za „${esc(q)}“.</p><p class="note">Probajte drugu reč, npr. „hydrafacial“, „celulit“ ili „masaža“.</p></div>`;
    return `<p class="search-sum">${nTretmana(hits.length)} za „${esc(q)}“</p>`+["lice","telo","masaze","akcije","edu"].map(c=>{
      const arr=hits.filter(s=>s.cat===c).sort(byName);
      return arr.length?`<div class="rule"><h2>${esc(TABS[c]||CATS[c]||c)}</h2></div><div class="svc-grid">${arr.map(svcCard).join("")}</div>`:"";
    }).join("");
  }
  if(S.cat==="vauceri")return tplVoucher();
  if(!S.loaded)return `<div class="loading">Učitavanje cenovnika…</div>`;
  const total=cats.reduce((n,c)=>n+byCat(c).length,0);
  if(!total&&S.cat==="akcije")return `<div class="empty"><p style="font-weight:800">Trenutno nema aktuelnih akcija.</p><p class="note">Zavirite uskoro - paketi i popusti se objavljuju ovde.</p></div>`;
  if(!total)return `<div class="empty"><p style="font-weight:800">Cenovnik se upravo priprema.</p><p class="note">Usluge za „${esc(TABS[S.cat])}" biće vidljive čim ih salon objavi.</p></div>`;
  if(S.cat==="telo"){
    const t=byCat("telo"),m=byCat("masaze");
    return (t.length?`<div class="rule"><h2>Tretmani tela</h2></div><div class="svc-grid">${t.map(svcCard).join("")}</div>`:"")
          +(m.length?`<div class="rule"><h2>Masaže</h2></div><div class="svc-grid">${m.map(svcCard).join("")}</div>`:"");
  }
  return `<div class="svc-grid">${byCat(cats[0]).map(svcCard).join("")}</div>`;
}
function tplCatalog(){
  const q=(S.q||"").trim();
  const sub=S.cat==="vauceri"?`Poklon vaučer na iznos po želji ili za izabrani tretman - poručite online, a uplatu i preuzimanje dogovarate sa salonom.`:S.cat==="edu"
    ?`Profesionalne, sertifikovane obuke za rad u estetici. Program i cena se dogovaraju individualno - pošaljite upit i javljamo se u najkraćem roku.`
    :`Dodajte jedan ili više tretmana, zatim izaberite kozmetičarku, dan i slobodan termin. ${S.me?"":`<button class="more" id="go-auth" style="padding:0">Prijavite se</button> da biste zakazali.`}`;
  return `

    <span class="eyebrow">Estetsko edukativni centar · Zvezdara</span>
    <h1 class="h-page hero-h">${S.cat==="vauceri"?"Poklonite <em>lepotu</em>.":S.cat==="edu"?"Znanje koje <em>inspiriše</em>.":S.cat==="akcije"?"Aktuelne <em>akcije</em> i paketi.":"Luksuz u nezi <em>lica</em> i <em>tela</em>."}</h1>
    <p class="sub">${sub}</p>
    <div class="hero-hours"><span class="hero-hours-t">Radno vreme</span><div class="hero-meta">${hoursSummary().map(p=>esc(p)).join("<br>")}</div></div>
    
  </section>
  <div class="cat-tabs">${Object.entries(TABS).map(([k,v])=>`<button data-cat="${k}" class="${!q&&S.cat===k?"on":""}">${v}</button>`).join("")}<form class="search ${q?"has-q":""}" role="search">${ICON_SEARCH}<input id="svc-q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" aria-label="Pretraga tretmana" placeholder="Pretraži tretmane…" value="${esc(S.q||"")}"><button type="button" class="clr" id="svc-q-clr" aria-label="Obriši pretragu"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form></div>
  <div id="cat-body">${catalogBody()}</div>
  ${footer()}`;
}

govor i opoziv saglasnosti) nalaze se u <strong>Politici\nprivatnosti</strong> dostupnoj na Aplikaciji, odnosno Sajtu.</p>\n<p>7.2. Informacije o kolačićima i sličnim tehnologijama koje koristi\nSajt nalaze se u <strong>Politici kolačića</strong>.</p>\n<p>7.3. Podaci o zdravstvenom stanju koje Korisnik dostavi pre Tretmana\nsmatraju se naročito osetljivim podacima i obrađuju se samo u meri\nneophodnoj za bezbedno pružanje Usluge i uz odgovarajući pravni osnov, u\nskladu sa Politikom privatnosti.</p>\n<p>7.4. Ukoliko smatrate da su Vam povređena prava u vezi sa obradom\npodataka o ličnosti, možete se obratiti Centru, a imate pravo da\npodnesete pritužbu Povereniku za informacije od javnog značaja i zaštitu\npodataka o ličnosti.</p>\n<ol start=\"4\" type=\"I\">\n<li><p><strong>Podaci o pružaocu usluge</strong></p></li>\n</ol>\n<p>U skladu sa Zakonom o elektronskoj trgovini i Zakonom o zaštiti\npotrošača, objavljujemo sledeće podatke:</p>\n<ul>\n<li><p><strong>Poslovno ime / naziv:</strong> ANDRIJANA OBRADOVIĆ PR\nEDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa izdvojenim\nprostorom, poslovno ime pod kojim se nastupa: Beauty &amp; Nutrition –\nEstetsko edukativni centar</p></li>\n<li><p><strong>Pravni oblik:</strong> preduzetnik</p></li>\n<li><p><strong>Sedište i adresa poslovnog prostora:</strong> Živojina\nŽujovića 25, Zvezdara, 11000 Beograd, Srbija, adresa sedišta: Branka\nMiljkovića 27, 34000 Kragujevac</p></li>\n<li><p><strong>PIB:</strong> 113013378</p></li>\n<li><p><strong>Matični broj:</strong> 66506665</p></li>\n<li><p><strong>Registar:</strong> upisan u registar Agencije za\nprivredne registre (APR), broj rešenja o upisu БП 48846/2022 od\n05.05.2022. godine</p></li>\n<li><p><strong>Šifra i opis pretežne delatnosti:</strong> 85.59 – Ostalo\nobrazovanje</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> andrijanaobradovic5@gmail.com</p></li>\n<li><p><strong>Društvene mreže:</strong> Facebook i Instagram\n(@beauty_and_nutrition_)</p></li>\n<li><p><strong>PDV status:</strong> nije u sistemu PDV-a.</p></li>\n</ul>\n<p><strong><u>Posebni uslovi pružanja Usluga</u></strong></p>\n<p><strong>1. Opis usluge i prava i obaveze Korisnika</strong></p>\n<p>1.1. <strong>Opis Usluga.</strong> Centar pruža:</p>\n<ul>\n<li><p>kozmetičke tretmane lica navedene u cenovniku (npr. higijenski\ntretman, mezoporacija, oksigen terapija, kolagenski anti-age tretman,\ntretmani sa fototerapijom);</p></li>\n<li><p>tretmane tela (npr. rolosfera, EMS body sculpt, maderoterapija,\nbrazilsko podizanje zadnjice, vacuum sonda, anticelulit\nprogrami);</p></li>\n<li><p>obuke i edukacije za tretmane lica i tela;</p></li>\n</ul>\n<p>1.2. <strong>Cene i sadržaj usluga.</strong> Opis, sadržaj i cena\npojedinačnih usluga i paketa objavljeni su na Aplikaciji i Sajtu i\nizraženi su u dinarima (RSD). Rezultati Tretmana zavise od individualnih\nkarakteristika i mogu se razlikovati od osobe do osobe; opisi rezultata\nu na Aplikaciji i/ili Sajtu nisu garancija konkretnog ishoda.</p>\n<p>1.3. <strong>Zdravstveno stanje Korisnika.</strong> Pre svakog\nTretmana Korisnik je dužan da istinito i potpuno obavesti stručno lice\nCentra o zdravstvenom stanju, alergijama, lekovima koje uzima, trudnoći\ni dojenju, implantatima (uključujući pejsmejker i metalne implantate),\nkožnim oboljenjima i drugim okolnostima relevantnim za bezbednost\nTretmana. Pojedini Tretmani su kontraindikovani u određenim stanjima, a\nCentar zadržava pravo da odbije ili prekine Tretman ukoliko proceni da\nbi mogao ugroziti zdravlje Korisnika. Korisnik može biti zamoljen da\npopuni i potpiše informisani pristanak ili upitnik pre Tretmana na licu\nmesta.</p>\n<p>1.4. <strong>Zakazivanje i dolazak.</strong> Termin se zakazuje preko\nsistema za online zakazivanje dostupnog u Aplikaciji, telefonom, putem\nsistema web sajta „sredi me“ ili putem društvenih mreža. Molimo da na\ntretman dođete na vreme. Kašnjenje može skratiti trajanje Tretmana i/ili\nEdukacije bez umanjenja cene, ako se tretman ne može izvesti u celosti u\npreostalom vremenu.</p>\n<p>1.5. <strong>Zakazivanje putem Aplikacije.</strong></p>\n<p>Zakazivanje putem Aplikacije vrši se u skladu sa Opštim uslovima\nkorišćenja Sajta i Aplikacije. Prilikom rezervacije termina, Korisnik\nbira osobu iz salona koja će obaviti tretman u skladu sa ponuđenim\nmogućnostima. Radi dobijanja potvrde rezervisanog termina, putem\nAplikacije, Korisnik je dužan da unapred uplati: 50% ukupne cene\nizabrane Usluge rezervacije termina Edukacije, odnosno 30% cene Usluge\nna ime rezervacije termina Tretmana. Preostali iznos plaća se prilikom\npružanja Usluge.</p>\n<p>1.6. <strong>Otkazivanje i pomeranje Termina.</strong> Termin je\nmoguće otkazati ili pomeriti najkasnije 24 (dvadeset četiri) sata pre\nzakazanog vremena, telefonom ili preko sistema za zakazivanje. Razumemo\nda se nepredviđene situacije dešavaju, ali otkazivanje u kraćem roku ne\nostavlja dovoljno vremena da se upražnjeni termin ponudi drugom\nKorisniku. Zbog toga, u slučaju otkazivanja nakon navedenog roka ili\nnedolaska bez prethodnog obaveštenja, Centar zadržava pravo da\nkumulativno: zadrži naplaćeni iznos 30% cene Usluge na ime rezervacije\ntermina Tretmana; zadrži naplaćeni iznos 50% cene Usluge na ime\nrezervacije termina Edukacije; odbije zakazivanje novih termina bez\nprethodne uplate; smatra Termin iskorišćenim u okviru paketa. Nadoknada\nse ne naplaćuje u slučaju bolesti ili više sile, uz razumno obrazloženje\ni potvrdu Centra.</p>\n<p>1.7. <strong>Paketi tretmana.</strong> Paketi (npr. Paket od 5 ili\npaket od 10 tretmana) koriste se prema dinamici koju preporuči stručno\nlice Centra. Rok važenja paketa je 1 mesec od dana uplate, osim ukoliko\nje drukčije dogovoreno. Neiskorišćeni tretmani nakon isteka roka\nprestaju da važe. Izuzetno, neiskorišćeni tretmani nakon isteka roka,\nmogu se produžiti uz dogovor i potvrdu Centra.</p>\n<p>1.8. <strong>Obuke i Edukacije.</strong> Prijava na Obuku i Edukaciju\nvrši se putem kontakt forme Aplikacije, telefona, telefona ili\ndruštvenih mreža. program, trajanje, termin, cena i uslovi izdavanja\npotvrde ili sertifikata dogovaraju se pojedinačno i potvrđuju pre\nuplate. Centar zadržava pravo da promeni termin održavanja iz opravdanih\nrazloga, uz blagovremeno obaveštenje, kao i da otkaže Obuku i/ili\nEdukaciju ili izvrši zakazivanje u novom terminu. Završetak Obuke i/ili\nEdukacije ne predstavlja javnu ispravu niti zamenu za obrazovanje\nstečeno u okviru formalnog obrazovnog sistema.</p>\n<p>1.9. <strong>Vaučeri i njihovo korišćenje.</strong> Vaučeri se mogu\nkoristiti za plaćanje Usluga i Edukacija koje Centar nudi, u skladu sa\nnjihovom nominalnom vrednošću i/ili izabranim Uslugama, shodno ponuđenim\ni dogovorenim uslovima. Prilikom korišćenja vaučera, Korisnik je dužan\nda prezentuje validan Vaučer. Rok važenja vaučera je 12 meseci od dana\nkupovine. Ukoliko je cena odabrane usluge veća od vrednosti vaučera,\nKorisnik je dužan da doplati razliku, dok se eventualni neiskorišćeni\niznos može koristiti za naredne Usluge u roku od 12 meseci od dana\nkupovine vaučera. Vaučeri se ne mogu zameniti za novac, osim kada je to\npredviđeno zakonskim uslovima ili izuzetno, uz odobrenje i pristanak\nCentra.</p>\n<p>1.10. <strong>Obaveze Korisnika.</strong> Korisnik je dužan da\npoštuje ove Uslove, pravila ponašanja Centra, uputstva stručnog osoblja\ni higijenske mere, da ne pristupa tretmanima pod dejstvom psihoaktivnih\nsupstanci i bez ometajućeg ponašanja i da blagovremeno izmiruje obaveze\nplaćanja.</p>\n<p>1.11. <strong>Fotografije i snimci pre/posle tretmana.</strong>\nFotografije i video zapisi Korisnika (uključujući snimke pre i posle\ntretmana) objavljuju se isključivo uz prethodnu izričitu pisanu\nsaglasnost Korisnika, koju je moguće opozvati u bilo kom trenutku bez\nposledica po pružanje Usluga.</p>\n<p>1.12. Centar zadržava pravo da ukloni sadržaj koji je u suprotnosti\nsa ovim Uslovima ili relevantnim zakonskim propisima.</p>\n<p><strong>2. Cene, naplata, pretplata i otkazivanje</strong></p>\n<p>2.1. Cene su izražene u dinarima (RSD) bez obračunatog PDV-a budući\nda pružalac nije u sistemu PDV-a i važe u trenutku zaključenja ugovora.\nCentar zadržava pravo izmene cena; izmena ne utiče na već zaključene\nugovore i plaćene Usluge.</p>\n<p>2.2. Plaćanje se vrši gotovinom, platnim karticama, uplatom na račun,\nili putem generisanog QR koda preko sistema za zakazivanje. Za potvrdu\nrezervisanog termina putem Aplikacije, Korisnik je dužan da unapred\nuplati 50% ukupne cene ugovorene Usluge u slučaju zakazivanja Edukacije,\nodnosno 30% ukupne cene ugovorene usluge u slučaju zakazivanja Tretmana.\nObuke i paketi mogu zahtevati avansnu uplatu ili uplatu u ratama, o čemu\nse Korisnik obaveštava pre uplate.</p>\n<p>2.3. Za sve uplate Centar izdaje fiskalni račun ili drugi dokument u\nskladu sa propisima o fiskalizaciji.</p>\n<p>2.4. Centar trenutno ne nudi pretplatu sa automatskim obnavljanjem.\nUkoliko se takva usluga uvede, Korisnik će o tome biti jasno obavešten\npre zaključenja ugovora, uz navođenje cene, trajanja i načina\notkazivanja.</p>\n<p>2.5. <strong>Povraćaj sredstava.</strong> U slučajevima u kojima\nKorisnik ima pravo na povraćaj novca (otkazivanje Obuke od strane\nKorisnika ili Centra, nemogućnost pružanja usluge ili opravdan\nodustanak), povraćaj se vrši istim sredstvom plaćanja kojim je izvršena\nuplata, bez nepotrebnog odlaganja, a najkasnije u roku od 14 dana od\ndana prijema izjave o odustanku ili od dana kada je utvrđeno pravo na\npovraćaj.</p>\n<p><strong>3. Prava potrošača</strong></p>\n<p>3.1. <strong>Pravo na odustanak (14 dana).</strong> Potrošač koji\nzaključi ugovor na daljinu (npr. Putem Aplikacije ili telefonom) ima, u\nskladu sa Zakonom o zaštiti potrošača, pravo da odustane od ugovora u\nroku od 14 dana od dana zaključenja ugovora, bez navođenja razloga.\nIzjavu o odustanku možete poslati na e-mail adresu: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>\nili poštom na adresu Centra, korišćenjem <strong>obrasca za\nodustanak</strong> ciubaili bilo koje nedvosmislene izjave.</p>\n<p>3.2. <strong>Izuzeci od prava na odustanak.</strong> Potrošač nema\npravo na odustanak, između ostalog:</p>\n<ul>\n<li><p>kada je Usluga u potpunosti izvršena, ako je njeno izvršenje\npočelo uz prethodnu izričitu saglasnost potrošača i uz njegovu potvrdu\nda zna da će izgubiti pravo na odustanak nakon potpunog\nizvršenja;</p></li>\n<li><p>kada se radi o digitalnom sadržaju koji se ne isporučuje na\ntrajnom nosaču podataka (npr. snimljena predavanja ili onlajn\nmaterijali), ako je isporuka počela uz prethodnu izričitu saglasnost\npotrošača i njegovu potvrdu da time gubi pravo na odustanak;</p></li>\n<li><p>u drugim slučajevima predviđenim zakonom.</p></li>\n</ul>\n<p>3.3. Ukoliko potrošač odustane od ugovora o usluzi čije je izvršenje\npočelo na njegov izričit zahtev u toku roka za odustanak, dužan je da\nplati srazmerni deo cene za do tada pružene Usluge.</p>\n<p>3.4. <strong>Ugovori zaključeni u poslovnim prostorijama.</strong> Za\nUsluge ugovorene i pružene neposredno u prostorijama Centra pravo na\nodustanak iz tačke 3.1. ne primenjuje se, ali Potrošač zadržava sva\nprava iz osnova saobraznosti i reklamacije.</p>\n<p>3.5. <strong>Reklamacije.</strong> Potrošač ima pravo da uloži\nreklamaciju ukoliko smatra da Usluga nije pružena u skladu sa ugovorom,\nkao i zbog pogrešno obračunate cene i drugih nedostataka. Reklamaciju\nmožete uložiti usmeno u prostorijama Centra Živojina Žujovića 25,\nZvezdara, 11000, ili pisanim putem e-mail adrese: <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a>,\nuz navođenje podataka o klijentu, usluzi, datumu pružanja i opisa\nnedostatka, uz dostavljanje računa na uvid ili drugog dokaza o pruženoj\nusluzi. Obrazac reklamacije možete preuzeti <strong>ovde</strong>.\nCentar će potvrditi prijem reklamacije i o njoj odlučiti najkasnije u\nroku od 8 dana od dana prijema, a najkasnije u roku od 15 dana pisanim\nili elektronskim putem odgovoriti Potrošaču, u skladu sa zakonom. Centar\nvodi evidenciju primljenih reklamacija. U slučaju može zahtevati\notklanjanje nedostatka, umanjenje cene, ponovno pružanje usluge ili\nraskid ugovora uz povraćaj novca, u skladu sa zakonom.</p>\n<p>3.6. <strong>Vansudsko rešavanje potrošačkih sporova.</strong>\nUkoliko Potrošač nije zadovoljan ishodom reklamacije, može pokrenuti\npostupak vansudskog rešavanja potrošačkog spora pred ovlašćenim telom\n(posrednikom) upisanim u registar koji vodi ministarstvo nadležno za\nposlove trgovine i zaštite potrošača, kao i obratiti se udruženjima za\nzaštitu potrošača.</p>\n<p>3.7. Odredbe ovih Uslova ne isključuju niti ograničavaju prava koja\npotrošaču pripadaju po prinudnim propisima.</p>\n<p><strong>4. Ograničenje odgovornosti i odricanje od\ngarancija</strong></p>\n<p>4.1. Cene, opisi i dostupnost Usluga mogu se menjati.</p>\n<p>4.2. Centar nije odgovoran za štetu nastalu usled:</p>\n<ul>\n<li><p>netačnih, nepotpunih ili prećutanih podataka o zdravstvenom\nstanju koje je dao Korisnik;</p></li>\n<li><p>nepoštovanja uputstava stručnog osoblja pre, tokom i nakon\nTretmana i Usluga;</p></li>\n<li><p>rezultata Edukacija u meri u kojoj oni zavise od angažovanja,\nzalaganja, primene stečenih znanja i veština, kao i ukupne uključenosti\nKorisnika u proces edukacije.</p></li>\n</ul>\n<p>4.3. Individualni rezultati tretmana variraju i ne mogu se\ngarantovati.</p>\n<p>4.4. U meri u kojoj to zakon dozvoljava, Centar ne odgovara za\nindirektne i posledične štete, kao ni za izgubljenu dobit, izgubljene\nprilike ili druge slične štete nastale u vezi sa pružanjem Usluga, čak i\nako je Centar unapred obavešten o mogućnosti nastanka takve štete.</p>\n<p>4.5. Ništa u ovim Uslovima ne isključuje odgovornost centra za\npružene Usluge koja se po zakonu i prinudnim propisima ne može\nisključiti.</p>\n<ol start=\"5\" type=\"I\">\n<li><p><strong>Izmene Uslova i način obaveštavanja\nkorisnika</strong></p></li>\n</ol>\n<p>Centar zadržava pravo da povremeno menja ove Uslove korišćenja,\nnaročito radi usklađivanja sa propisima, promenama u uslugama,\nposlovanju ili tehničkim funkcionalnostima.</p>\n<p>Izmenjeni Uslovi korišćenja objavljuju se na Sajtu sa novim datumom\nposlednje izmene. Molimo Vas da, pre korišćenja Aplikacije i Sajta, kao\ni pre zakazivanja Usluga, proverite da li ste upoznati sa sa najnovijom\nvažećom verzijom ovih Uslova korišćenja.</p>\n<p>Nastavak korišćenja Aplikacije i/ili Sajta i zakazivanje Usluga nakon\npočetka primene izmena smatra se prihvatanjem izmenjenih Uslova\nkorišćenja. Ukoliko se Korisnik ne slaže sa izmenama, dužan je da\nprestane da koristi Aplikaciju i/ili Sajt. Izmene ne utiču na prava\nstečena iz već zaključenih ugovora.</p>\n<ol start=\"6\" type=\"I\">\n<li><p><strong>Merodavno pravo i nadležni sud</strong></p></li>\n</ol>\n<p>Na ove Uslove korišćenja i na sve odnose između Centra i Korisnika\nprimenjuje se pravo Republike Srbije.</p>\n<p>Sporove koji proisteknu iz ovih Uslova ili u vezi sa njima strane će\nnastojati da reše sporazumno. Ukoliko sporazumno rešenje nije moguće, za\nrešavanje spora nadležan je stvarno nadležni sud u Beogradu.</p>\n<p>Za potrošačke sporove ostaje nepromenjeno pravo Potrošača da se\nobrati sudu koji je zakonom određen kao nadležan, kao i pravo na\nvansudsko rešavanje spora iz tačke 3.6.</p>\n<ol start=\"7\" type=\"I\">\n<li><p><strong>Delimična ništavost i celokupnost\nugovora</strong></p></li>\n</ol>\n<p>Ukoliko se neka odredba ovih Uslova korišćenja pokaže ništavom,\nnevažećom ili neprimenjivom, to ne utiče na punovažnost ostalih odredbi.\nTakva odredba biće zamenjena važećom odredbom koja je po dejstvu\nnajbliža nameri originalne odredbe.</p>\n<p>Ovi Uslovi korišćenja, zajedno sa Politikom privatnosti, Politikom\nkolačića, kao i svim pojedinačnim potvrdama termina, ponudama i pisanim\ndogovorima o Uslugama, čine celokupan sporazum između Centra i Korisnika\nu vezi sa predmetom Uslova i zamenjuju sve prethodne dogovore.</p>\n<p>Propuštanje Centra da u određenom trenutku ostvari neko svoje pravo\nne znači odricanje od tog prava.</p>\n<p>Korisnik ne može preneti svoja prava i obaveze iz ovih Uslova\nkorišćenja na treće lice bez pisane saglasnosti Centra.</p>\n<ol start=\"8\" type=\"I\">\n<li><p><strong>Kontakt za pitanja i prigovore</strong></p></li>\n</ol>\n<p>Za sva pitanja, primedbe, prigovore, reklamacije i zahteve u vezi sa\novim Uslovima korišćenja i Uslugama možete nas kontaktirati:</p>\n<ul>\n<li><p><strong>Beauty &amp; Nutrition – Estetsko edukativni\ncentar</strong></p></li>\n<li><p><strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000\nBeograd</p></li>\n<li><p><strong>Telefon:</strong> +381 64 93 55 003</p></li>\n<li><p><strong>E-pošta:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p></li>\n<li><p><strong>Instagram:</strong> @beauty_and_nutrition_</p></li>\n<li><p><strong>Facebook:</strong> Beauty &amp; Nutrition (stranica na\nFacebook-u)</p></li>\n<li><p><strong>Radno vreme:</strong> ponedeljak-petak na zakazivanje;\nsubota: 10h-15h; nedelja: neradan dan.</p></li>\n</ul>\n<p>Na pisane upite odgovaramo u razumnom roku, a najkasnije u rokovima\npredviđenim zakonom.</p>\n<p><strong>18. Datum poslednje izmene</strong></p>\n<p>Ovi Uslovi korišćenja poslednji put izmenjeni su <strong>22. oktobra\n2026. godine</strong>.</p>\n", "odustanak": "<p><strong>OBRAZAC ZA ODUSTANAK OD UGOVORA</strong></p>\n<p><strong>Primalac obrasca:</strong> <strong>:</strong> ANDRIJANA\nOBRADOVIĆ PR EDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa\nizdvojenim prostorom, poslovno ime pod kojim se nastupa: Beauty &amp;\nNutrition – Estetsko edukativni centar<br />\n<strong>Adresa:</strong> Živojina Žujovića 25, Zvezdara, 11000 Beograd,\nSrbija, adresa sedišta: Branka Miljkovića 27, 34000 Kragujevac<br />\n<strong>E-mail:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p>\n<p>Ovim obrascem obaveštavam pružaoca usluge da odustajem od ugovora\nzaključenog na daljinu, u meri u kojoj imam pravo na odustanak u skladu\nsa važećim propisima.</p>\n<p><strong>1. Podaci o korisniku</strong></p>\n<p>Ime i prezime: __________________________________</p>\n<p>Adresa: ________________________________________</p>\n<p>E-mail adresa: __________________________________</p>\n<p>Broj telefona (opciono): __________________________</p>\n<p><strong>2. Podaci o ugovoru</strong></p>\n<p>Vrsta usluge:</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Kozmetički\ntretman</label></p></li>\n<li><p><label><input type=\"checkbox\" />Edukacija uživo</label></p></li>\n<li><p><label><input type=\"checkbox\" />Online edukacija ili digitalni\nsadržaj</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Naziv usluge: ___________________________________</p>\n<p>Datum zaključenja ugovora odnosno rezervacije: ______________</p>\n<p>Datum zakazanog termina: ______________</p>\n<p>Ukupan ugovoreni iznos Usluge: ______________ RSD</p>\n<p>Uplaćeni avans: ______________ RSD</p>\n<p><strong>3. Izjava o odustanku</strong></p>\n<p>Ovim izjavljujem da odustajem od navedenog ugovora, u skladu sa\nprimenjivim zakonskim uslovima.</p>\n<p>Razlog odustanka (opciono):</p>\n<p><strong>4. Podaci za povraćaj novca</strong></p>\n<p>Ime vlasnika računa: ______________________________</p>\n<p>Broj tekućeg računa (ako je potreban): _________________</p>\n<p>Iznos čiji se povraćaj traži: ______________ RSD</p>\n<p><strong>5. Dodatne informacije</strong></p>\n<p>Da li je usluga već započeta ili izvršena?</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Ne</label></p></li>\n<li><p><label><input type=\"checkbox\" />Da</label></p></li>\n<li><p><label><input type=\"checkbox\" />Delimično</label></p></li>\n</ul>\n<p>Datum podnošenja obrasca: ________________________</p>\n<p>Ime i prezime korisnika: ___________________________</p>\n<p><strong>Napomena:</strong> Pravo na odustanak, eventualna naknada za\nveć pruženi deo usluge i povraćaj novca procenjuju se prema vrsti\nugovora i važećim zakonskim pravilima. Podnošenje obrasca ne znači\nautomatski da su ispunjeni svi uslovi za povraćaj celokupnog iznosa.</p>\n", "reklamacija": "<p><strong>OBRAZAC ZA REKLAMACIJU</strong></p>\n<p><strong>Pružalac usluge:</strong> <strong>:</strong> ANDRIJANA\nOBRADOVIĆ PR EDUKATIVNI CENTAR BEAUTY AND NUTRITION ARANĐELOVAC sa\nizdvojenim prostorom, poslovno ime pod kojim se nastupa: Beauty &amp;\nNutrition – Estetsko edukativni centar<br />\n<strong>Adresa sedišta:</strong> Živojina Žujovića 25, Zvezdara, 11000\nBeograd, Srbija, adresa sedišta: Branka Miljkovića 27, 34000\nKragujevac<br />\n<strong>Matični broj:</strong> 66506665 <strong>PIB:</strong>\n113013378<br />\n<strong>E-mail za reklamacije:</strong> <a\nhref=\"mailto:andrijanaobradovic5@gmail.com\">andrijanaobradovic5@gmail.com</a></p>\n<p><strong>1. Podaci o korisniku</strong></p>\n<p>Ime i prezime: __________________________________</p>\n<p>E-mail adresa: __________________________________</p>\n<p>Broj telefona (opciono): __________________________</p>\n<p><strong>2. Podaci o usluzi</strong></p>\n<p>Vrsta usluge:</p>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\" />Kozmetički\ntretman</label></p></li>\n<li><p><label><input type=\"checkbox\" />Edukacija</label></p></li>\n<li><p><label><input type=\"checkbox\" />Drugo:\n__________________________________</label></p></li>\n</ul>\n<p>Naziv usluge: ___________________________________</p>\n<p>Datum pružanja usluge ili zakazanog termina: ______________</p>\n<p>Broj rezervacije ili porudžbine (ako postoji): ______________</p>\n<p>Plaćeni iznos: ______________ RSD</p>\n<p><strong>3. Opis reklamacije</strong></p>\n<p>Molimo vas da opišete problem zbog kojeg podnosite reklamaciju:</p>\n<p><strong>4. Zahtev kori async function renderSlots(){
  const area=$("#slot-area");if(!area||!S.bDate)return;
  area.innerHTML=`<div class="loading">Proveravam slobodne termine…</div>`;
  try{
    const {slots,h}=await computeSlots(S.bDate);
    if(!h){area.innerHTML=`<p class="note">Salon ne radi izabranog dana.</p>`;return}
    if(!slots.length){area.innerHTML=`<p class="note">Nema termina u koje staju svi izabrani tretmani tog dana.</p>`;return}
    area.innerHTML=`<p class="note" style="margin:0 0 10px">Radno vreme: ${toHM(h.open)}-${toHM(h.close)}</p>
      <div class="slots">${slots.map(s=>`<button class="slot ${S.bSlot===s.t?"on":""}" data-slot="${s.t}" ${s.free?"":"disabled"}>${toHM(s.t)}</button>`).join("")}</div>`;
    area.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{S.bSlot=+b.dataset.slot;
      area.querySelectorAll(".slot").forEach(x=>x.classList.toggle("on",x===b));
      const p=$("#bk-pick");if(p)p.textContent=fmtD(S.bDate)+" u "+toHM(S.bSlot);
      const c=$("#bk-confirm");if(c&&S.me)c.disabled=false;
    });
  }catch(e){area.innerHTML=`<p class="note">Termine trenutno nije moguće učitati. Pokušajte ponovo.</p>`}
}

/* slika usluge: smanji u pregledaču (najviše 1200px, JPEG) pa pošalji kao data URL */
function shrinkImage(file,max,q){
  return new Promise((ok,err)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",q));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);err(new Error("Fotografiju nije moguće učitati. Probajte JPG ili PNG."))};
    im.src=url;
  });
}
async function uploadSvcImg(id,file,btn){
  if(!file)return;
  if(file.type&&!/^image\//.test(file.type))return toast("Izaberite fotografiju.");
  const old=btn.textContent;btn.disabled=true;btn.textContent="Šaljem…";
  try{
    const data=await shrinkImage(file,1200,.82);
    const r=await apiPost("/api/admin/service-img/"+encodeURIComponent(id),{data});
    const i=S.services.findIndex(x=>x.id===id);if(i>=0)S.services[i]=r.service;
    toast("Slika je sačuvana.");render();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent=old}
}

function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const CAL_COLORS=["#A8853F","#6B8E6B","#A2645A","#5F7A99","#8A6B9E","#4F8E8B","#7D7461"];
function calColor(empId){const i=S.employees.findIndex(e=>e.id===empId);return CAL_COLORS[(i<0?6:i)%CAL_COLORS.length]}
function admCal(){
  const wsD=S.calWS?parseD(S.calWS):weekStart(new Date());const ws=dstr(weekStart(wsD));S.calWS=ws;
  loadCal(ws);
  const have=S.calBk&&S.calBk.ws===ws;
  const list=have?S.calBk.list.filter(b=>b.status==="zakazano"):[];
  const d0=parseD(ws);const days=[];for(let i=0;i<7;i++)days.push(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i));
  const O=480,CL=1260,PXH=44;const H=(CL-O)/60*PXH;
  const today=dstr(new Date());
  const hrs=[];for(let h=8;h<=21;h++)hrs.push(h);
  const gut=`<div class="cal-gut" style="height:${H}px">${hrs.map(h=>`<span class="cal-hlabel" style="top:${(h*60-O)/60*PXH}px">${pad(h)}h</span>`).join("")}</div>`;
  const cols=days.map(d=>{const ds=dstr(d);const open=dayHours(ds);
    const bks=list.filter(b=>b.date===ds);
    return `<div class="cal-col ${open?"":"closed"}" style="height:${H}px">
      ${hrs.map(h=>`<div class="cal-hr" style="top:${(h*60-O)/60*PXH}px"></div>`).join("")}
      ${bks.map(b=>{const t=toMin(b.start);const hpx=Math.max(21,(b.totalDuration/60)*PXH-2);
        return `<div class="cal-bk" style="top:${(t-O)/60*PXH}px;height:${hpx}px;background:${calColor(b.employee)}" title="${esc(b.start+"\u2013"+b.end+" \u00b7 "+b.userName+" \u00b7 "+b.services.map(s=>s.name).join(", ")+" ("+b.employeeName+")")}"><b>${esc(b.start)}</b> ${esc(b.userName)}<br>${esc(b.employeeName)}</div>`}).join("")}
      ${open?"":`<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.14em;color:var(--muted)">NERADNO</div>`}
    </div>`}).join("");
  const headRow=`<div></div>${days.map(d=>{const ds=dstr(d);return `<div class="cal-dayh ${ds===today?"today":""}">${DOWS_S[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.</div>`}).join("")}`;
  const lab=days[0].getDate()+". "+MONTHS[days[0].getMonth()]+" \u2013 "+days[6].getDate()+". "+MONTHS[days[6].getMonth()]+" "+days[6].getFullYear()+".";
  return `
  <div class="cal-months">${[0,1,2].map(off=>{const n=new Date();const m=new Date(n.getFullYear(),n.getMonth()+off,1);
    const on=days.some(d=>d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear());
    return `<button class="chip ${on?"on":""}" data-calmonth="${off}">${MONTHS_L[m.getMonth()]} ${m.getFullYear()}.</button>`}).join("")}</div>
  <div class="cal-head">
    <button class="btn btn-ghost btn-sm" data-calnav="-7">\u2039 Prethodna</button>
    <button class="btn btn-ghost btn-sm" data-calnav="0">Danas</button>
    <button class="btn btn-ghost btn-sm" data-calnav="7">Sledeća \u203a</button>
    <span class="cal-title">${esc(lab)}</span>
    <span class="cal-legend">${S.employees.map(e=>`<span><span class="cal-dot" style="background:${calColor(e.id)}"></span>${esc(e.name)}</span>`).join("")}</span>
  </div>
  ${have?"":`<div class="loading">Učitavanje kalendara…</div>`}
  <div class="cal-wrap"><div class="cal-grid">${headRow}${gut}${cols}</div></div>
  <p class="note" style="margin-top:10px">„+ Ručni unos" upisuje termin direktno u kalendar - za pakete (4, 5, 6, 20 tretmana) i telefonska zakazivanja.</p>`;
}

  if(svcId==="__custom"&&!label)return err("Unesite opis paketa/usluge.");

function wire(root){
  root.querySelectorAll("[data-nav2]").forEach(b=>b.onclick=()=>{S.view=b.dataset.nav2;render()});
  const ga=root.querySelector("#go-auth");if(ga)ga.onclick=()=>{S.view="auth";render()};
  const tl=root.querySelector("#t-login"),tr=root.querySelector("#t-reg");
  if(tl)tl.onclick=()=>{S.authTab="login";render()};
  if(tr)tr.onclick=()=>{S.authTab="reg";render()};
  const fl=root.querySelector("#f-login");if(fl)fl.onsubmit=e=>{e.preventDefault();login(fl)};
  const gf=root.querySelector("#go-forgot");if(gf)gf.onclick=forgotModal;
  const fr=root.querySelector("#f-reg");if(fr)fr.onsubmit=e=>{e.preventDefault();register(fr)};
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;S.q="";render()});
  const sq=root.querySelector("#svc-q");
  if(sq){ /* pretraga osvežava samo listu, bez render() da kursor i skrol ostanu na mestu */
    const refresh=()=>{const q=(S.q||"").trim();const body=$("#cat-body");if(body){body.innerHTML=catalogBody();wire(body)}
      document.querySelectorAll(".cat-tabs [data-cat]").forEach(b=>b.classList.toggle("on",!q&&b.dataset.cat===S.cat));
      sq.closest(".search").classList.toggle("has-q",!!q)};
    sq.oninput=()=>{S.q=sq.value;refresh()};
    sq.onkeydown=e=>{if(e.key==="Escape"){S.q="";sq.value="";refresh()}else if(e.key==="Enter"){e.preventDefault();sq.blur()}};
    const sf=sq.closest("form");if(sf)sf.onsubmit=e=>{e.preventDefault();sq.blur()};
    const sc=root.querySelector("#svc-q-clr");if(sc)sc.onclick=()=>{S.q="";sq.value="";refresh();sq.focus()};
  }
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.add;const s=S.services.find(x=>x.id===id);if(!s)return;
    const i=S.cart.findIndex(c=>c.id===id);
    if(i>=0){S.cart.splice(i,1)}else{S.cart.push(s);toast("Dodato: "+s.name)}
    render();
  });
  root.querySelectorAll("[data-inq]").forEach(b=>b.onclick=()=>{const s=S.services.find(x=>x.id===b.dataset.inq);if(s)inquiryModal(s)});
  root.querySelectorAll("[data-policy]").forEach(b=>b.onclick=e=>{e.preventDefault();policyModal()});
  root.querySelectorAll("[data-terms]").forEach(b=>b.onclick=e=>{e.preventDefault();termsModal()});
  root.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{
    const card=b.closest(".svc");if(!card)return;const o=card.classList.toggle("open");
    b.setAttribute("aria-expanded",o?"true":"false");const l=b.querySelector("span");if(l)l.textContent=o?"Sakrij":"Saznaj više";
  });
  root.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.bEmp=b.dataset.emp;S.bSlot=null;render()});
  root.querySelectorAll("[data-date-off]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.bOff=+b.dataset.dateOff;render()});
  root.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>calModal(b.dataset.cal));
  root.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.bDate=b.dataset.date;S.bSlot=null;render()});
  root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.cart=S.cart.filter(c=>c.id!==b.dataset.rm);if(!S.cart.length){S.view="catalog"}S.bSlot=null;render()});
  const bc=root.querySelector("#bk-confirm");if(bc)bc.onclick=confirmBooking;
  const bb=root.querySelector("#bk-back");if(bb)bb.onclick=()=>{S.view="catalog";render()};
  root.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{
    if(b.dataset.arm){cancelBooking(b.dataset.cancel)}
    else{b.dataset.arm="1";b.textContent="Potvrdi otkazivanje";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Otkaži"}},4000)}
  });
  root.querySelectorAll("[data-admtab]").forEach(b=>b.onclick=()=>{S.admTab=b.dataset.admtab;if(S.admTab==="vcr")S.vcrKey=null;render()});
